repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: fix-byte-order-marker
        types: [powershell]
        exclude: "^scripts/powershell/"
  - repo: local
    hooks:
      - id: treefmt
        name: treefmt
        entry: nix fmt -- --fail-on-change
        language: system
        pass_filenames: false
      - id: powershell-tests
        name: powershell tests
        entry: scripts/sh/run-windows-powershell-tests.sh -NoProfile -File scripts/powershell/tests/Invoke-Tests.ps1
        language: system
        pass_filenames: false
        files: '\.(ps1|psm1|psd1|tmpl)$'
