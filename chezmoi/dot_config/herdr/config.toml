# Managed by chezmoi. Keep this file portable across Unix and Windows.
onboarding = false

[terminal]
shell_mode = "auto"
new_cwd = "follow"

[update]
version_check = true
manifest_check = true

[keys]
prefix = "ctrl+space"
workspace_picker = "prefix+w"
new_workspace = "prefix+a"
navigate_workspace_down = "j"
navigate_workspace_up = "k"
new_tab = "prefix+n"
close_tab = "prefix+q"
next_tab = "prefix+tab"
previous_tab = "prefix+shift+tab"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
split_vertical = "prefix+v"
split_horizontal = "prefix+minus"
close_pane = "prefix+x"
goto = "prefix+g"
detach = "prefix+d"
