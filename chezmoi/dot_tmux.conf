# prefix: C-Space
unbind C-b
unbind C-a
set -g prefix C-Space
bind C-Space send-prefix

# 256 color + true color
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

# インデックスを 1 始まりに
set -g base-index 1
setw -g pane-base-index 1

# マウス有効
set -g mouse on

# ウィンドウ番号の自動振り直し
set -g renumber-windows on

# ネイティブ multiplexer 契約: Workspace=Session、Tab=Window
bind w choose-tree -s
bind a command-prompt -p "new workspace:" "new-session -s '%%'"
bind n new-window
bind q kill-window
bind Tab next-window
bind BTab previous-window

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind v split-window -h
bind - split-window -v
bind x kill-pane

bind g choose-tree -Zw
bind d detach-client

unbind '"'
unbind '%'

# vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# コピーモードを vi キーに
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# 設定リロード
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ステータスバー: 右上に session/repo/branch + ウィンドウリストを集約
set -g status-position top
set -g status-style 'bg=#1e1e2e fg=#cdd6f4'
set -g status-interval 2
set -g status-left-length 0
set -g status-right-length 300
set -g status-justify left

# 左側は空
set -g status-left ''

# デフォルトのウィンドウリストは非表示 (status-right で W ループ描画)
setw -g window-status-format ''
setw -g window-status-current-format ''
set -g window-status-separator ''

# 右上: 󰉋 session  󰊤 repo  󰘬 branch  windows...
set -g status-right '#[fg=#89b4fa,bold]󰉋 #S  #[fg=#a6e3a1]󰊤 #(cd #{pane_current_path} && git rev-parse --show-toplevel 2>/dev/null | xargs basename 2>/dev/null)  #[fg=#f38ba8]󰘬 #(cd #{pane_current_path} && git branch --show-current 2>/dev/null) #{W:#{?window_active,#[fg=#cdd6f4\,bold] #{window_index} #{window_name} ,#[fg=#585b70] #{window_index} #{window_name} }}'
