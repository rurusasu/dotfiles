# Shared MCP configuration
#
# Docker MCP Toolkit owns catalog-managed servers. Client templates emit one
# MCP_DOCKER gateway entry for this profile. Servers without a current Toolkit
# catalog entry remain below as direct client entries.

mcp_toolkit:
  profile: dotfiles
  server_name: MCP_DOCKER
  supports:
    - codex
    - cursor
    - gemini
    - windsurf
  secrets:
    account: "my.1password.com"
    vault: "openclaw"
    refs:
      exa.api_key: "op://openclaw/ExaUsedOpenclawPAT/credential"
      firecrawl.api_key: "op://openclaw/FirecrawlUsedOpenclawPAT/credential"
      github.personal_access_token: "op://openclaw/GitHubUsedOpenClawPAT/credential"
      tavily.api_token: "op://openclaw/TavilyUsedOpenclawPAT/credential"
    unavailable:
      - context7.api_key
      - obsidian.api_key
  servers:
    - name: context7
      ref: "catalog://mcp/docker-mcp-catalog/context7"
    - name: deepwiki
      ref: "catalog://mcp/docker-mcp-catalog/deepwiki"
    - name: exa
      ref: "catalog://mcp/docker-mcp-catalog/exa"
    - name: firecrawl
      ref: "catalog://mcp/docker-mcp-catalog/firecrawl"
    - name: github-official
      ref: "catalog://mcp/docker-mcp-catalog/github-official"
    - name: obsidian
      ref: "catalog://mcp/docker-mcp-catalog/obsidian"
    - name: playwright
      ref: "catalog://mcp/docker-mcp-catalog/playwright"
    - name: tavily
      ref: "catalog://mcp/docker-mcp-catalog/tavily"

mcp_servers:
  # Hindsight is a local HTTP MCP service. Docker MCP Gateway rejects local
  # HTTP remotes, so keep this direct entry shared across every client.
  - name: hindsight
    url: "http://127.0.0.1:8888/mcp/codex-shared/"
    supports:
      - codex
      - cursor
      - gemini
      - windsurf

  # Plane - Local self-hosted project management
  - name: plane
    command: uvx
    args:
      - "plane-mcp-server"
      - "stdio"
    startup_timeout_sec: 120
    env:
      PLANE_API_KEY: "${PLANE_API_KEY}"
      PLANE_WORKSPACE_SLUG: "ruru"
      PLANE_BASE_URL: "http://127.0.0.1:18080"
    op_env:
      PLANE_API_KEY: "op://hxgiw3ekjzktxf7hiyf5lyb4hi/fzhjphxau3ila6wlelo5y4ehhe/credential"
    supports:
      - cursor
      - gemini
      - windsurf

  # Draw.io Official - Open diagrams in draw.io editor (browser)
  - name: drawio
    command: pnpm
    args:
      - "dlx"
      - "@drawio/mcp@1.2.6"
    startup_timeout_sec: 30
    # pnpm/npm exec currently fails to resolve the Windows bin shim for this
    # package in Codex startup, so keep it out of Codex auto-start.
    supports:
      - windsurf
      - cursor
      - gemini

  # Kaggle - Official remote MCP (competitions, datasets, notebooks, models, benchmarks)
  # Docs: https://www.kaggle.com/docs/mcp
  - name: kaggle
    url: "https://www.kaggle.com/mcp"
    command: pnpm
    args:
      - "dlx"
      - "mcp-remote@0.1.38"
      - "https://www.kaggle.com/mcp"
    startup_timeout_sec: 30
    # Keep OAuth/API-key remote startup out of Codex by default.
    supports:
      - cursor
      - gemini
      - windsurf
