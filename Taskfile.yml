# https://taskfile.dev
version: "3"

vars:
  DISTRO: NixOS
  DOTFILES_PATH: '{{if eq OS "windows"}}~/.dotfiles{{else}}{{.ROOT_DIR}}{{end}}'
  HERMES_COMPOSE_FILE: docker/hermes-service/compose.yml
  HINDSIGHT_COMPOSE_FILE: docker/local-ai-services/compose.yml
  MLFLOW_COMPOSE_FILE: docker/local-ai-services/compose.yml
  # OS は go-task の特殊変数なのでドット無しで参照する（`.OS` は常に空になり、
  # Windows から実行しても WSL プレフィックスが付かず失敗する）。
  WSL: '{{if eq OS "windows"}}wsl -d {{.DISTRO}} -- {{end}}'

includes:
  quality:
    taskfile: ./taskfiles/quality/taskfile.yml
    flatten: true
  sync:
    taskfile: ./taskfiles/sync/taskfile.yml
    flatten: true
  git:
    taskfile: ./taskfiles/git/taskfile.yml
    flatten: true
  nix:
    taskfile: ./taskfiles/nix/taskfile.yml
    flatten: true
  dev:
    taskfile: ./taskfiles/dev/taskfile.yml
    flatten: true
  test:
    taskfile: ./taskfiles/test/taskfile.yml
    flatten: true
  install:
    taskfile: ./taskfiles/install/taskfile.yml
    flatten: true
  docker:
    taskfile: ./taskfiles/docker/taskfile.yml
    flatten: true
  hermes:
    taskfile: ./taskfiles/hermes/taskfile.yml
    flatten: true
  hindsight:
    taskfile: ./taskfiles/hindsight/taskfile.yml
    flatten: true
  mlflow:
    taskfile: ./taskfiles/mlflow/taskfile.yml
    flatten: true
  hooks:
    taskfile: ./taskfiles/hooks/taskfile.yml
    flatten: true

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list
