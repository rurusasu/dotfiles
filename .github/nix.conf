experimental-features = nix-command flakes
# CI resolves aliases only from explicit locked --inputs-from entries.
flake-registry =
# Prefer the official public cache, followed by upstream package caches.
substituters = https://cache.nixos.org?priority=10 https://cache.numtide.com?priority=50 https://hermes-agent.cachix.org
# Establish the base before appending: a later base assignment discards extras.
trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= hermes-agent.cachix.org-1:jN3pjR50Mxi4SESKC/FIMNM6/LCosvPk2VUwzVvebzU=
# Bound idle cache transfers so an unavailable cache cannot consume the job.
http2 = false
stalled-download-timeout = 60
download-attempts = 3
# Preserve normal source builds when an optional substitute is unavailable.
fallback = true
