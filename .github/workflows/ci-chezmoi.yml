name: Chezmoi CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  TESTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: ci-chezmoi / Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      nix: ${{ steps.detect.outputs.nix }}
      chezmoi: ${{ steps.detect.outputs.chezmoi }}
      other: ${{ steps.detect.outputs.other }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false
      - name: Detect changed job targets
        id: detect
        uses: ./.github/actions/detect-ci-changes
        with:
          base-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || github.sha }}
          head-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          run-all: ${{ github.event_name == 'workflow_dispatch' }}

  source:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.chezmoi == 'true') }}
    name: Chezmoi source
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Verify change detection
        if: ${{ needs.changes.result != 'success' }}
        shell: bash
        run: exit 1
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false
      - name: Install chezmoi
        uses: ./.github/actions/install-chezmoi
      - name: Verify the managed Windows targets
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'chezmoi'
          $data = '{"chezmoi":{"os":"windows","homeDir":"C:/Users/ci"}}'
          $managedFiles = @(& chezmoi --source $source --override-data $data managed --include files --path-style relative)
          if ($LASTEXITCODE -ne 0) { throw "chezmoi managed files failed with exit $LASTEXITCODE" }
          $expectedFiles = @(
            '.config/dotfiles/wslg-fontconfig.conf'
            '.config/git/config'
            '.taskrc.yml'
            '.wslgconfig'
            'AppData/Local/Microsoft/Windows Terminal/Fragments/dotfiles/catppuccin-mocha.json'
            'AppData/Local/Packages/Microsoft.WindowsTerminal_8wekyb3d8bbwe/LocalState/settings.json'
            'AppData/Local/superfile/config.toml'
            'Documents/PowerShell/Microsoft.PowerShell_profile.ps1'
          )
          if ($managedFiles.Count -ne $expectedFiles.Count -or
              @($expectedFiles | Where-Object { $_ -notin $managedFiles }).Count -gt 0) {
            throw "Unexpected managed files: $($managedFiles -join ', ')"
          }
          $managedScripts = @(& chezmoi --source $source --override-data $data managed --include scripts --path-style relative)
          if ($LASTEXITCODE -ne 0) { throw "chezmoi managed scripts failed with exit $LASTEXITCODE" }
          $expectedScripts = @(
            '.chezmoiscripts/deploy/keybindings/sync_wsl_keybindings.ps1'
            '.chezmoiscripts/deploy/terminals/install_udev_gothic_nf.ps1'
            '.chezmoiscripts/deploy/terminals/set_windows_terminal.ps1'
          )
          if ($managedScripts.Count -ne $expectedScripts.Count -or
              @($expectedScripts | Where-Object { $_ -notin $managedScripts }).Count -gt 0) {
            throw "Unexpected managed scripts: $($managedScripts -join ', ')"
          }
          foreach ($os in 'linux', 'darwin') {
            $unixData = @{ chezmoi = @{ os = $os; homeDir = '/home/ci' } } | ConvertTo-Json -Compress
            $unixTargets = @(& chezmoi --source $source --override-data $unixData managed --include files,scripts --path-style relative)
            if ($LASTEXITCODE -ne 0 -or $unixTargets.Count -ne 0) {
              throw "chezmoi must leave $os configuration to Nix: $($unixTargets -join ', ')"
            }
          }
          $wslgConfig = @(& chezmoi --source $source --override-data $data execute-template --file (Join-Path $source 'dot_wslgconfig.tmpl'))
          if ($LASTEXITCODE -ne 0) { throw "chezmoi WSLg configuration render failed with exit $LASTEXITCODE" }
          $expectedWslgConfig = "[system-distro-env]`nFONTCONFIG_FILE=/mnt/c/Users/ci/.config/dotfiles/wslg-fontconfig.conf"
          if ((($wslgConfig -join "`n") -replace "`r", '').TrimEnd() -cne $expectedWslgConfig) {
            throw 'WSLg fontconfig must point to the managed Windows-backed file'
          }
          $fontConfig = @(& chezmoi --source $source --override-data $data execute-template --file (Join-Path $source 'dot_config/dotfiles/wslg-fontconfig.conf.tmpl'))
          if ($LASTEXITCODE -ne 0) { throw "chezmoi fontconfig render failed with exit $LASTEXITCODE" }
          $renderedXml = (($fontConfig -join "`n") -replace "`r", '').TrimEnd()
          [xml]$parsedXml = $renderedXml
          if ($parsedXml.DocumentElement.Name -cne 'fontconfig') {
            throw 'The rendered fontconfig XML must have a fontconfig root'
          }
          $canonicalXml = [IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE 'nix/modules/fonts/wsl-fontconfig.conf'))
          if ($renderedXml -cne (($canonicalXml -replace "`r", '').TrimEnd())) {
            throw 'The rendered fontconfig XML differs from its Nix source'
          }
      - name: Check template files for BOM
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Recurse -Filter "*.tmpl" ./chezmoi
          foreach ($file in $files) {
            $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
            if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
              throw "UTF-8 BOM detected: $($file.FullName)"
            }
          }
