name: devcontainer CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: ci-devcontainer / Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      devcontainer: ${{ steps.detect.outputs.devcontainer }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed job targets
        id: detect
        uses: ./.github/actions/detect-ci-changes
        with:
          base-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || github.sha }}
          head-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          run-all: ${{ github.event_name == 'workflow_dispatch' }}
          manifest: ci/job-path-routing.json

  linux-nix:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.devcontainer == 'true') }}
    name: E2E (Linux + Nix CLI)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Verify change detection
        if: ${{ needs.changes.result != 'success' }}
        shell: bash
        run: exit 1
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install devcontainer CLI
        run: |
          for attempt in 1 2 3; do
            if nix profile install 'nixpkgs#devcontainer'; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "nix profile install devcontainer failed after $attempt attempts" >&2
              exit 1
            fi

            sleep_seconds=$((attempt * 10))
            echo "nix profile install devcontainer failed; retrying in ${sleep_seconds}s (${attempt}/3)" >&2
            sleep "$sleep_seconds"
          done
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

      - name: Start devcontainer
        run: |
          devcontainer up \
            --frozen-lockfile \
            --config .devcontainer/ci/devcontainer.json \
            --workspace-folder .

      - name: Smoke test
        run: |
          devcontainer exec \
            --config .devcontainer/ci/devcontainer.json \
            --workspace-folder . \
            -- bash .devcontainer/ci/smoke.sh

      - name: bats unit tests
        run: |
          devcontainer exec \
            --config .devcontainer/ci/devcontainer.json \
            --workspace-folder . \
            -- bash .devcontainer/ci/bats.sh

      - name: tmux + nvim headless E2E
        run: |
          devcontainer exec \
            --config .devcontainer/ci/devcontainer.json \
            --workspace-folder . \
            -- bash .devcontainer/ci/e2e.sh

  macos:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.devcontainer == 'true') }}
    name: E2E (macOS)
    runs-on: macos-15-intel
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Verify change detection
        if: ${{ needs.changes.result != 'success' }}
        shell: bash
        run: exit 1
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5.4.0

      - name: Install devcontainer CLI
        run: npm install --global --no-audit --no-fund @devcontainers/cli@0.88.0

      - name: Start devcontainer
        run: |
          devcontainer up \
            --frozen-lockfile \
            --config .devcontainer/ci/devcontainer.json \
            --workspace-folder .

      - name: Smoke test
        run: |
          devcontainer exec \
            --config .devcontainer/ci/devcontainer.json \
            --workspace-folder . \
            -- bash .devcontainer/ci/smoke.sh

      - name: bats unit tests
        run: |
          devcontainer exec \
            --config .devcontainer/ci/devcontainer.json \
            --workspace-folder . \
            -- bash .devcontainer/ci/bats.sh

      - name: tmux + nvim headless E2E
        run: |
          devcontainer exec \
            --config .devcontainer/ci/devcontainer.json \
            --workspace-folder . \
            -- bash .devcontainer/ci/e2e.sh

  windows:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.devcontainer == 'true') }}
    # Full devcontainer E2E requires Linux containers, which GitHub-hosted
    # Windows runners do not support (no Docker Desktop, no WSL2 Ubuntu
    # pre-installed). This job validates the devcontainer configuration and
    # bootstrap.sh syntax without starting a container.
    name: Config Validation (Windows)
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Verify change detection
        if: ${{ needs.changes.result != 'success' }}
        shell: bash
        run: exit 1
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install devcontainer CLI
        shell: pwsh
        run: npm install --global --no-audit --no-fund @devcontainers/cli@0.88.0

      - name: Validate devcontainer config
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          devcontainer read-configuration `
            --config .devcontainer/ci/devcontainer.json `
            --workspace-folder . | ConvertFrom-Json | Out-Null
          Write-Host "OK  devcontainer config is valid"
          exit 0
