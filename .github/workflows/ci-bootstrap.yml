name: Bootstrap CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "install.sh"
      - "install.cmd"
      - "nix/**"
      - "scripts/sh/**"
      - "scripts/powershell/ci/**"
      - "scripts/powershell/handlers/**"
      - "scripts/powershell/handlers/Handler.NixOSWSL.ps1"
      - "scripts/powershell/handlers/Handler.NixRebuild.ps1"
      - "scripts/powershell/lib/**"
      - "scripts/powershell/install.ps1"
      - "scripts/powershell/install.user.ps1"
      - "scripts/powershell/tests/**"
      - "windows/**"
      - "chezmoi/**"
      - "docker/hermes-agent/**"
      - "docker/hermes-service/**"
      - "docker/hermes-browser/**"
      - "docker/hermes-browser-mcp/**"
      - "docker/hermes-xapi-mcp/**"
      - "docker/hindsight/**"
      - "docker/local-ai-services/**"
      - "docker/mlflow/**"
      - "docs/mlflow/**"
      - ".github/e2e/**"
      - "tests/bash/install_linux.bats"
      - "tests/bash/install_macos.bats"
      - "ci/path-routing.json"
      - "ci/bootstrap-path-routing.json"
      - "ci/job-path-routing.json"
      - "tests/python/test_ci_job_routing.py"
      - "Taskfile.yml"
      - "taskfiles/**"
      - "scripts/python/detect_ci_changes.py"
      - "tests/python/test_detect_ci_changes.py"
      - "tests/python/test_ci_workflow_routing.py"
      - ".github/actions/detect-ci-changes/**"
      - ".github/workflows/ci-contract.yml"
      - ".github/workflows/ci-bootstrap.yml"
  pull_request:
    branches: [main]

concurrency:
  group: bootstrap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TESTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  DOTFILES_SKIP_FLAKE_UPDATE: "1"

jobs:
  changes:
    name: Bootstrap / Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed bootstrap targets
        id: detect
        uses: ./.github/actions/detect-ci-changes
        with:
          base-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || github.sha }}
          head-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          run-all: ${{ github.event_name == 'workflow_dispatch' }}
          manifest: ci/bootstrap-path-routing.json
    outputs:
      linux: ${{ steps.detect.outputs.linux }}
      darwin: ${{ steps.detect.outputs.darwin }}
      wsl: ${{ steps.detect.outputs.wsl }}
      windows: ${{ steps.detect.outputs.windows }}
      nix: ${{ steps.detect.outputs.nix }}
      platforms: ${{ steps.detect.outputs.linux == 'true' || steps.detect.outputs.darwin == 'true' || steps.detect.outputs.wsl == 'true' || steps.detect.outputs.windows == 'true' }}

  nix-lint:
    name: Bootstrap / Nix / Lint
    needs: changes
    if: ${{ needs.changes.outputs.nix == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run statix
        run: |
          # statix exits non-zero when findings exist; capture that separately from infra errors.
          # stderr is preserved so build/infra failures surface in logs.
          set +e
          nix shell nixpkgs#statix --command \
            statix check --format json . > statix.json || STATIX_EXIT=$?
          set -e
          statix_exit="${STATIX_EXIT:-0}"
          if (( statix_exit > 1 )); then
            echo "statix infrastructure failure (exit ${statix_exit})"
            exit "${statix_exit}"
          fi
          echo "statix_exit=${STATIX_EXIT:-0}" >> "$GITHUB_ENV"

      - name: Convert to SARIF
        run: |
          python3 - << 'PYEOF'
          import json, sys

          # statix --format json emits one JSON object per file on separate lines (NDJSON).
          SEV_MAP = {"Error": "error", "Warn": "warning", "Hint": "note"}
          data = []
          error_count = 0
          invalid_count = 0
          try:
              with open("statix.json") as f:
                  for line in f:
                      line = line.strip()
                      if not line:
                          continue
                      try:
                          data.append(json.loads(line))
                      except json.JSONDecodeError as e:
                          invalid_count += 1
                          print(f"Warning: skipping unparseable line: {e}", file=sys.stderr)
          except FileNotFoundError:
              print("Warning: statix.json not found — empty SARIF will be uploaded", file=sys.stderr)

          results = []
          for item in data:
              file_path = item.get("file", "")
              for check in item.get("report", []):
                  note = check.get("note", "")
                  severity = check.get("severity", "Warn")
                  level = SEV_MAP.get(severity, "warning")
                  for diag in check.get("diagnostics", []):
                      at = diag.get("at", {})
                      frm = at.get("from", {})
                      to = at.get("to", {})
                      if severity in ("Error", "Warn"):
                          error_count += 1
                      results.append({
                          "ruleId": "statix/lint",
                          "message": {"text": f"{note}: {diag.get('message', '')}".strip(": ")},
                          "level": level,
                          "locations": [{
                              "physicalLocation": {
                                  "artifactLocation": {
                                      "uri": file_path,
                                      "uriBaseId": "%SRCROOT%"
                                  },
                                  "region": {
                                      "startLine": max(1, frm.get("line", 1)),
                                      "startColumn": max(1, frm.get("column", 1)),
                                      "endLine": max(1, to.get("line", 1)),
                                      "endColumn": max(1, to.get("column", 1))
                                  }
                              }
                          }]
                      })

          sarif = {
              "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
              "version": "2.1.0",
              "runs": [{
                  "tool": {
                      "driver": {
                          "name": "statix",
                          "informationUri": "https://github.com/nerdypepper/statix",
                          "rules": []
                      }
                  },
                  "results": results
              }]
          }
          with open("statix.sarif", "w") as f:
              json.dump(sarif, f, indent=2)
          print(f"SARIF: {len(results)} finding(s), {error_count} error(s)")

          with open("statix_errors.txt", "w") as f:
              f.write(str(error_count))
          with open("statix_records.txt", "w") as f:
              f.write(str(len(data)))
          with open("statix_invalid.txt", "w") as f:
              f.write(str(invalid_count))
          PYEOF

      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          sarif_file: statix.sarif
          category: statix

      - name: Fail on statix errors
        run: |
          statix_exit=${STATIX_EXIT:-0}
          records=$(cat statix_records.txt 2>/dev/null || echo "0")
          invalid=$(cat statix_invalid.txt 2>/dev/null || echo "0")
          if (( statix_exit == 1 && (records == 0 || invalid > 0) )); then
            echo "statix produced no valid diagnostics; treating this as an infrastructure failure"
            exit 1
          fi
          errors=$(cat statix_errors.txt 2>/dev/null || echo "0")
          if [ "$errors" -gt 0 ]; then
            echo "statix: $errors error(s) found"
            exit 1
          fi

  nix-format:
    name: Bootstrap / Format / Style
    needs: [changes, nix-lint]
    if: ${{ needs.changes.outputs.nix == 'true' && needs.nix-lint.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache PSScriptAnalyzer
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.local/share/powershell/Modules/PSScriptAnalyzer
          key: ${{ runner.os }}-pssa-nix-format-1.22.0

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default
          }
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer | Where-Object Version -eq '1.22.0')) {
            Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.22.0 -Scope CurrentUser -Force -Repository PSGallery
          }

      - name: Check source formatting (style only)
        run: |
          if ! nix fmt -- --fail-on-change; then
            git diff -- .
            exit 1
          fi

  nix-test:
    name: Bootstrap / Test / Nix outputs
    # Formatting is an independent style gate. Semantic tests must still run
    # when formatting fails so the two failure classes remain distinguishable.
    needs: [changes, nix-lint]
    if: ${{ needs.changes.outputs.nix == 'true' && needs.nix-lint.result == 'success' }}
    runs-on: ubuntu-24.04
    # The full profile now builds the independently packaged Codex CLI. A cold
    # runner can legitimately need more than an hour for the Rust/V8 build.
    timeout-minutes: 120
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        extra-substituters = https://cache.numtide.com
        extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
    permissions:
      contents: read
    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Free runner disk space
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /opt/ghc \
            /opt/hostedtoolcache
          sudo docker image prune --all --force || true
          df -h /

      - name: Check flake evaluation
        run: |
          set -o pipefail
          nix flake check --no-build 2>&1 | tee /tmp/nix-check.txt
          if grep -q "evaluation warning" /tmp/nix-check.txt; then
            echo "ERROR: evaluation warnings found"
            exit 1
          fi

      - name: Run Nix-native configuration tests
        run: nix build .#checks.x86_64-linux.nix-unit --no-link --print-build-logs

      - name: Run Ghostty configuration deployment tests
        run: nix build .#checks.x86_64-linux.ghostty-config --no-link

      - name: Run Neovim native configuration tests
        run: nix build .#checks.x86_64-linux.neovim-native --no-link

      - name: Build package sets
        run: |
          nix build .#minimal
          nix build .#default
          nix build .#full
          nix build .#fonts

      - name: Build NixOS WSL system
        run: nix build .#nixosConfigurations.nixos.config.system.build.toplevel --no-link

      - name: Install full profile and smoke test tools
        run: |
          set -euo pipefail
          profile="$RUNNER_TEMP/dotfiles-full-profile"
          nix profile install --profile "$profile" .#full
          export PATH="$profile/bin:$PATH"

          check() {
            local name=$1; shift
            local out
            out=$("$name" "$@" 2>&1) || { echo "FAIL $name (exit $?)"; exit 1; }
            echo "OK  $name: $out"
          }

          echo "=== Smoke testing installed full profile tools ==="
          check chezmoi --version
          check git --version
          check gh --version
          check fd --version
          check rg --version
          check bat --version
          check jq --version
          check eza --version
          check zoxide --version
          check fzf --version
          check direnv --version
          check unzip -v
          check 7z
          check node --version
          check python --version
          check go version
          check make --version
          check cmake --version
          check ghq --version
          check uv --version
          check pnpm --version
          check task --version
          check devcontainer --version
          check lazygit --version
          check bats --version
          check magick --version
          check gs --version
          check pdftoppm -v
          check tmux -V
          check starship --version
          check wezterm --version
          check op --version
          check codex --version
          check gcloud version
          check kind version
          check kubectl version --client=true
          check helm version --short
          check kustomize version
          check stern --version
          check argocd version --client --short
          check sops --version
          check trivy --version
          check dive --version
          check nixd --version
          check ruff --version
          check yaml-language-server --version
          check taplo --version
          check bash-language-server --version
          check lua-language-server --version
          check stylua --version
          check marksman --version
          check gopls version
          check rust-analyzer --version
          echo "=== Installed full profile tools OK ==="

  linux-build:
    name: Bootstrap / Linux / Build
    needs: changes
    if: ${{ needs.changes.outputs.linux == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DOTFILES_USER: runner
      DOTFILES_HOME: /home/runner
      DOTFILES_UID: "1000"
      DOTFILES_GID: "1000"
      DOTFILES_GROUP: runner
      DOTFILES_SYSTEM: x86_64-linux
      DOTFILES_NIXOS_HARDWARE_CONFIG: ${{ github.workspace }}/nix/tests/hardware-configuration.nix
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        extra-substituters = https://cache.numtide.com
        extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Linux declarative outputs
        run: |
          set -euo pipefail
          nix build .#systemConfigs.ubuntu --impure --no-link
          nix build .#systemConfigs.debian --impure --no-link
          nix build .#nixosConfigurations.linux.config.system.build.toplevel --impure --no-link
          nix build .#homeConfigurations.x86_64-linux.activationPackage --impure --no-link
          nix build .#package-support-report --no-link --print-build-logs

  linux-ubuntu:
    name: Bootstrap / Linux / E2E / Ubuntu
    needs: [changes, linux-build]
    if: ${{ needs.changes.outputs.linux == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DOTFILES_CHECKOUT_TARGET: ${{ github.workspace }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: First one-command convergence
        run: |
          ./.github/e2e/run-bootstrap-acceptance.sh
          ./.github/e2e/start-bootstrap-runtime.sh
          export PATH="/run/system-manager/sw/bin:/etc/profiles/per-user/$USER/bin:$HOME/.nix-profile/bin:$PATH"
          . ./scripts/sh/install-common.sh
          export DOTFILES_USER="$USER"
          dotfiles_run_in_group docker ./scripts/sh/verify-environment.sh --runtime

      - name: Second idempotent convergence
        run: |
          ./.github/e2e/run-bootstrap-acceptance.sh
          ./.github/e2e/start-bootstrap-runtime.sh
          export PATH="/run/system-manager/sw/bin:/etc/profiles/per-user/$USER/bin:$HOME/.nix-profile/bin:$PATH"
          . ./scripts/sh/install-common.sh
          export DOTFILES_USER="$USER"
          dotfiles_run_in_group docker ./scripts/sh/verify-environment.sh --runtime

      - name: Write Ubuntu attestation
        if: always()
        run: |
          . ./scripts/sh/install-common.sh
          export DOTFILES_USER="$USER"
          {
            echo "sha=$TESTED_SHA"
            echo "system_manager=$(readlink -f /run/system-manager/system 2>/dev/null || true)"
            echo "docker=$(dotfiles_run_in_group docker docker version --format '{{.Server.Version}}' 2>/dev/null || true)"
            echo "support_report=$(nix build .#package-support-report --no-link --print-out-paths --print-build-logs | sha256sum | cut -d' ' -f1 || true)"
          } > ubuntu-attestation.txt

      - name: Upload Ubuntu attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: bootstrap-linux-ubuntu-${{ github.run_id }}-${{ github.run_attempt }}
          path: ubuntu-attestation.txt

  linux-debian:
    name: Bootstrap / Linux / E2E / Debian
    needs: [changes, linux-build]
    if: ${{ needs.changes.outputs.linux == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false

      - name: Install systemd-nspawn prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes debootstrap systemd-container

      - name: Run Debian bootstrap twice
        env:
          DEBIAN_ROOT: ${{ runner.temp }}/debian-root
          MACHINE_NAME: dotfiles-debian-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          sudo debootstrap --variant=minbase bookworm "$DEBIAN_ROOT" https://deb.debian.org/debian
          sudo systemd-nspawn -D "$DEBIAN_ROOT" /bin/bash -lc '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install --yes ca-certificates curl git sudo xz-utils systemd systemd-sysv dbus
            useradd --create-home --shell /bin/bash dotfiles
            printf "dotfiles ALL=(ALL) NOPASSWD: ALL\n" >/etc/sudoers.d/dotfiles
            chmod 0440 /etc/sudoers.d/dotfiles
          '

          {
            sudo systemd-nspawn \
              --directory="$DEBIAN_ROOT" \
              --machine="$MACHINE_NAME" \
              --boot \
              --capability=all \
              --bind="$GITHUB_WORKSPACE:/workspace"
          } >debian-nspawn.log 2>&1 &
          nspawn_pid=$!
          cleanup() {
            sudo machinectl terminate "$MACHINE_NAME" >/dev/null 2>&1 || true
            wait "$nspawn_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 60); do
            if [[ $(sudo machinectl show "$MACHINE_NAME" --property=State --value 2>/dev/null || true) == running ]]; then
              break
            fi
            sleep 2
          done
          [[ $(sudo machinectl show "$MACHINE_NAME" --property=State --value) == running ]]
          machine_ready=0
          for _ in $(seq 1 60); do
            if sudo machinectl shell --quiet "root@$MACHINE_NAME" /bin/bash -lc \
              'systemctl is-system-running | grep -E "^(running|degraded)$"' \
              >/dev/null 2>&1; then
              machine_ready=1
              break
            fi
            sleep 2
          done
          if ((machine_ready == 0)); then
            tail -200 debian-nspawn.log
            exit 1
          fi

          run_inside() {
            sudo machinectl shell --quiet "dotfiles@$MACHINE_NAME" /bin/bash -lc "$1"
          }

          # The variables below must expand inside the Debian machine.
          # shellcheck disable=SC2016
          bootstrap='export DOTFILES_SKIP_FLAKE_UPDATE=1; cd /workspace; ./.github/e2e/run-bootstrap-acceptance.sh'
          # shellcheck disable=SC2016
          verify='export PATH=/run/system-manager/sw/bin:/etc/profiles/per-user/dotfiles/bin:$HOME/.nix-profile/bin:$PATH; cd /workspace; ./scripts/sh/verify-environment.sh --runtime'
          run_inside "$bootstrap"
          run_inside "$verify"
          run_inside "$bootstrap"
          run_inside "$verify"

          {
            echo "sha=$TESTED_SHA"
            # shellcheck disable=SC2016
            run_inside 'echo system_manager=$(readlink -f /run/system-manager/system); echo docker=$(docker version --format "{{.Server.Version}}")'
          } >debian-attestation.txt

      - name: Upload Debian logs and attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: bootstrap-linux-debian-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            debian-attestation.txt
            debian-nspawn.log

  linux-nixos:
    name: Bootstrap / Linux / E2E / NixOS
    needs: [changes, linux-build]
    if: ${{ needs.changes.outputs.linux == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run idempotent NixOS VM test
        run: nix build .#checks.x86_64-linux.bootstrap-nixos-vm --no-link --print-build-logs

      - name: Write NixOS attestation
        if: always()
        run: printf 'sha=%s\ncheck=bootstrap-nixos-vm\n' "$TESTED_SHA" > nixos-attestation.txt

      - name: Upload NixOS attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: bootstrap-linux-nixos-${{ github.run_id }}-${{ github.run_attempt }}
          path: nixos-attestation.txt

  darwin:
    name: Bootstrap / Darwin
    needs: changes
    if: ${{ needs.changes.outputs.darwin == 'true' }}
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DOTFILES_USER: runner
      DOTFILES_HOME: /Users/runner
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      NUMTIDE_CACHE: https://cache.numtide.com
      NUMTIDE_CACHE_KEY: niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Bash, Bats, GNU coreutils, Lua, and Task
        run: |
          set -euo pipefail
          brew install bash coreutils go-task lua
          bats_version='1.13.0'
          bats_root="$RUNNER_TEMP/bats-core-$bats_version"
          bats_prefix="$RUNNER_TEMP/bats-prefix"
          curl -fsSL "https://github.com/bats-core/bats-core/archive/refs/tags/v$bats_version.tar.gz" |
            tar -xz -C "$RUNNER_TEMP"
          "$bats_root/install.sh" "$bats_prefix"
          echo "$bats_prefix/bin" >>"$GITHUB_PATH"
          "$bats_prefix/bin/bats" --version
          command -v lua
          command -v luac
          {
            echo "$(brew --prefix bash)/bin"
            echo "$(brew --prefix coreutils)/libexec/gnubin"
          } >> "$GITHUB_PATH"

      - name: Run POSIX and Hammerspoon adapter contracts
        run: |
          set -euo pipefail
          env -u DOTFILES_SKIP_FLAKE_UPDATE -u DOTFILES_USER -u DOTFILES_HOME -u SUDO_USER bats --print-output-on-failure tests/bash
          luac -p chezmoi/terminals/hammerspoon/init.lua
          lua tests/lua/hammerspoon_terminal_prefix_test.lua

      - name: Build macOS declarative output
        run: |
          nix build .#checks.aarch64-darwin.nix-unit --no-link \
            --option extra-substituters "$NUMTIDE_CACHE" \
            --option extra-trusted-public-keys "$NUMTIDE_CACHE_KEY"
          nix build .#checks.aarch64-darwin.ghostty-config --no-link \
            --option extra-substituters "$NUMTIDE_CACHE" \
            --option extra-trusted-public-keys "$NUMTIDE_CACHE_KEY"
          nix build .#checks.aarch64-darwin.neovim-native --no-link \
            --option extra-substituters "$NUMTIDE_CACHE" \
            --option extra-trusted-public-keys "$NUMTIDE_CACHE_KEY"
          nix build .#darwinConfigurations.macos.system --impure --no-link \
            --option extra-substituters "$NUMTIDE_CACHE" \
            --option extra-trusted-public-keys "$NUMTIDE_CACHE_KEY"

      - name: Verify provider coverage
        run: nix build .#package-support-report --no-link --print-build-logs

      - name: Write macOS contract attestation
        if: always()
        run: |
          {
            echo "sha=$TESTED_SHA"
            echo "runner_image=$ImageOS-$ImageVersion"
            echo "layer=darwin-bootstrap"
            echo "runtime=not-applicable-on-github-hosted-runner"
          } > darwin-contract-attestation.txt

      - name: Upload Darwin contract results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: bootstrap-darwin-${{ github.run_id }}-${{ github.run_attempt }}
          path: darwin-contract-attestation.txt

  wsl:
    name: Bootstrap / WSL
    needs: changes
    if: ${{ needs.changes.outputs.wsl == 'true' }}
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false

      - name: Prepare WSL2
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $env:WSL_UTF8 = "1"
          if (-not (Get-Command wsl.exe -ErrorAction SilentlyContinue)) {
            winget install --id Microsoft.WSL --exact --accept-source-agreements --accept-package-agreements --silent
          }

          wsl --version
          wsl --set-default-version 2
          wsl --status

      - name: Run isolated NixOS-WSL switch
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WSLENV: GITHUB_TOKEN/u
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $refName = $env:HEAD_REF
          if ([string]::IsNullOrWhiteSpace($refName)) {
            $refName = $env:REF_NAME
          }
          $safeRef = $refName -replace "[^A-Za-z0-9_.-]", "-"
          if ([string]::IsNullOrWhiteSpace($safeRef)) {
            $safeRef = "ref"
          }
          if ($safeRef.Length -gt 48) {
            $safeRef = $safeRef.Substring(0, 48).TrimEnd("-", ".", "_")
          }
          $sha256 = [System.Security.Cryptography.SHA256]::Create()
          try {
            $refHashBytes = $sha256.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($refName))
          }
          finally {
            $sha256.Dispose()
          }
          $refHash = (-join ($refHashBytes | ForEach-Object { $_.ToString("x2") })).Substring(0, 8)
          $distroName = "NixOS-CI-$safeRef-$refHash"
          $installDir = Join-Path $env:RUNNER_TEMP $distroName

          pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass `
            -File scripts/powershell/ci/Invoke-NixosWslE2E.ps1 `
            -DistroName $distroName `
            -InstallDir $installDir

  windows:
    name: Bootstrap / Windows (${{ matrix.runtime }})
    needs: changes
    if: ${{ needs.changes.outputs.windows == 'true' }}
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runtime: Windows PowerShell 5.1
            executable: powershell.exe
          - runtime: PowerShell 7
            executable: pwsh.exe
    env:
      WINDOWS_E2E_RUNTIME: ${{ matrix.runtime }}
      WINDOWS_E2E_EXECUTABLE: ${{ matrix.executable }}
    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false

      - name: Install chezmoi
        uses: ./.github/actions/install-chezmoi

      - name: Install and verify admin-required Visual Studio Build Tools through the installer
        shell: pwsh
        timeout-minutes: 60
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltinRole]::Administrator)) {
            throw 'Hosted Windows runner is not elevated; refusing to skip admin-required WinGet package coverage'
          }

          $options = @{
            SkipSetDefaultDistro = $true
            SkipVhdExpand = $true
            SkipWslInstall = $true
          }
          $optionsBase64 = [Convert]::ToBase64String(
            [Text.Encoding]::UTF8.GetBytes(($options | ConvertTo-Json -Compress))
          )
          $adminScript = Join-Path $env:GITHUB_WORKSPACE 'scripts/powershell/install.admin.ps1'
          $installerOutput = @(
            & $env:WINDOWS_E2E_EXECUTABLE `
              -NoLogo -NoProfile -ExecutionPolicy Bypass `
              -File $adminScript `
              '-AdminOnly:$true' `
              -OptionsBase64 $optionsBase64 `
              -NoPause 2>&1
          )
          $installerExitCode = $LASTEXITCODE
          $installerOutput | ForEach-Object { Write-Host ([string]$_) }
          if ($installerExitCode -ne 0) {
            throw "Admin-only installer phase failed (exit=$installerExitCode)"
          }

          $installerText = $installerOutput -join [Environment]::NewLine
          if ($installerText -notmatch '(?m)^\[WingetAdmin\]\s+インストール/更新中: AutoHotkey\.AutoHotkey\s*$') {
            throw 'Admin-only installer did not attempt AutoHotkey.AutoHotkey'
          }
          if ($installerText -match '(?m)^\[WingetAdmin\].*✗.*AutoHotkey\.AutoHotkey') {
            throw 'Admin-only installer reported an AutoHotkey package failure'
          }
          if ($installerText -notmatch '(?m)^\[WingetAdmin\]\s+インストール/更新中: Microsoft\.VisualStudio\.2022\.BuildTools\s*$') {
            throw 'Admin-only installer did not attempt Microsoft.VisualStudio.2022.BuildTools'
          }
          if ($installerText -match '(?m)^\[WingetAdmin\].*✗.*Microsoft\.VisualStudio\.2022\.BuildTools') {
            throw 'Admin-only installer reported a Visual Studio Build Tools package failure'
          }
          if ($installerText -notmatch '(?m)^Total:\s*\d+\s*\|\s*Success:\s*\d+\s*\|\s*Failure:\s*0\s*$') {
            throw 'Admin-only installer did not report a zero-failure setup summary'
          }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw "Visual Studio instance locator is missing: $vswhere"
          }
          $buildToolsPath = @(
            & $vswhere -products Microsoft.VisualStudio.Product.BuildTools `
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
              -property installationPath
          ) | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace([string]$buildToolsPath)) {
            throw 'No Visual Studio Build Tools instance with the required x86/x64 C++ component was found'
          }
          $compiler = @(
            Get-ChildItem -LiteralPath (Join-Path $buildToolsPath 'VC\Tools\MSVC') -Directory -ErrorAction Stop |
              ForEach-Object {
                Join-Path $_.FullName 'bin\Hostx64\x64\cl.exe'
              } |
              Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
              Select-Object -First 1
          ) | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace([string]$compiler)) {
            throw "Visual Studio Build Tools compiler executable was not found under $buildToolsPath"
          }
          Write-Output "CI_ADMIN_PACKAGE_SUCCESS: id=Microsoft.VisualStudio.2022.BuildTools executable=$compiler"

      - name: Verify admin-installed AutoHotkey v2
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $autoHotkey = "$env:ProgramFiles\AutoHotkey\v2\AutoHotkey64.exe"
          if (-not (Test-Path -LiteralPath $autoHotkey -PathType Leaf)) {
            throw "AutoHotkey v2 executable was not installed by the admin phase: $autoHotkey"
          }
          $uiAccess = "$env:ProgramFiles\AutoHotkey\v2\AutoHotkey64_UIA.exe"
          if (-not (Test-Path -LiteralPath $uiAccess -PathType Leaf)) {
            throw "AutoHotkey v2 UIAccess executable was not installed by the admin phase: $uiAccess"
          }
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE 'chezmoi\terminals\windows-terminal\terminal-keybindings.ahk'
          $LASTEXITCODE = 0
          & $uiAccess '/ErrorStdOut' $scriptPath '--check'
          $syntaxExitCode = $LASTEXITCODE
          if ($syntaxExitCode -ne 0) {
            throw "AutoHotkey v2 UIAccess syntax validation failed (exit $syntaxExitCode)"
          }
          $LASTEXITCODE = 0
          & $uiAccess '/ErrorStdOut' $scriptPath '--self-test'
          $selfTestExitCode = $LASTEXITCODE
          if ($selfTestExitCode -ne 0) {
            throw "AutoHotkey v2 UIAccess behavioral self-tests failed (exit $selfTestExitCode)"
          }

      - name: Install pinned Pester
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          & $env:WINDOWS_E2E_EXECUTABLE `
            -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -Command "Install-Module -Name Pester -RequiredVersion '5.6.1' -Scope CurrentUser -Force -SkipPublisherCheck -ErrorAction Stop"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not install pinned Pester under $env:WINDOWS_E2E_RUNTIME (exit $LASTEXITCODE)"
          }

      - name: Run Windows bootstrap contracts
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          & $env:WINDOWS_E2E_EXECUTABLE `
            -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File .\scripts\powershell\tests\Invoke-Tests.ps1 `
            -MinimumCoverage 0 `
            -OutputFile windows-contract-junit.xml
          if ($LASTEXITCODE -ne 0) {
            throw "Windows bootstrap contracts failed under $env:WINDOWS_E2E_RUNTIME (exit $LASTEXITCODE)"
          }

      - name: Write Windows contract attestation
        if: always()
        shell: pwsh
        run: |
          @(
            "sha=$env:TESTED_SHA"
            "runner_image=$env:ImageOS-$env:ImageVersion"
            "layer=windows-bootstrap"
            "runtime=${{ matrix.runtime }}"
          ) | Set-Content -LiteralPath windows-contract-attestation.txt -Encoding utf8

      - name: Upload Windows contract results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: bootstrap-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            windows-contract-attestation.txt
            windows-contract-junit.xml
          if-no-files-found: warn

  windows-installer:
    name: Bootstrap / Windows / Installer (${{ matrix.runtime }})
    needs: changes
    if: ${{ needs.changes.outputs.windows == 'true' }}
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runtime: Windows PowerShell 5.1
            version: "5.1"
            shell: powershell
          - runtime: PowerShell 7
            version: "7"
            shell: pwsh
    permissions:
      contents: read
    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false

      - name: Bootstrap winget
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          # Ensure winget is available on the runner
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            Write-Host "winget not found — installing Microsoft.WinGet.Client..."
            $ErrorActionPreference = 'Continue'
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -ErrorAction SilentlyContinue
            $ErrorActionPreference = 'Stop'
            Install-Module -Name Microsoft.WinGet.Client -RequiredVersion '1.29.280' -Scope CurrentUser -Force -Repository PSGallery
            Repair-WinGetPackageManager
          }
          function Invoke-WingetSourceUpdate {
            param([int]$Attempts = 3)

            for ($attempt = 1; $attempt -le $Attempts; $attempt++) {
              Write-Host "winget source update attempt $attempt/$Attempts"
              $ErrorActionPreference = 'Continue'
              $sourceOutput = winget source update 2>&1 | ForEach-Object {
                $line = [string]$_
                Write-Host $line
                $line
              }
              $sourceUpdateExit = $LASTEXITCODE
              $ErrorActionPreference = 'Stop'

              $sourceText = $sourceOutput -join [Environment]::NewLine
              if ($sourceUpdateExit -eq 0 -and $sourceText -notmatch '(?im)\bCancelled\b') {
                return
              }

              Write-Warning "winget source update did not complete cleanly (exit=$sourceUpdateExit). Retrying after source reset."
              $ErrorActionPreference = 'Continue'
              winget source reset --force
              $ErrorActionPreference = 'Stop'
              Start-Sleep -Seconds 5
            }

            throw "winget source update did not complete after $Attempts attempts"
          }

          # Validate winget sources before proceeding. A textual "Cancelled"
          # with exit 0 still leaves later winget install calls unable to resolve
          # packages, so detect it explicitly.
          Invoke-WingetSourceUpdate
          $wingetVersion = @(winget --version 2>&1)
          $wingetVersionExitCode = $LASTEXITCODE
          if ($wingetVersionExitCode -ne 0) {
            throw "winget --version failed (exit=$wingetVersionExitCode): $($wingetVersion -join ' ')"
          }
          $wingetSources = @(winget source list 2>&1)
          $wingetSourcesExitCode = $LASTEXITCODE
          if ($wingetSourcesExitCode -ne 0) {
            throw "winget source list failed (exit=$wingetSourcesExitCode): $($wingetSources -join ' ')"
          }

      - name: Run install.cmd strict user phase
        shell: ${{ matrix.shell }}
        timeout-minutes: 70
        env:
          DOTFILES_INSTALL_TIMEOUT_SECONDS: "900"
          DOTFILES_E2E_POWERSHELL_VERSION: ${{ matrix.version }}
        run: |
          $expectedRuntime = $env:DOTFILES_E2E_POWERSHELL_VERSION
          $runtimeCommand = if ($expectedRuntime -eq '5.1') { 'powershell.exe' } else { 'pwsh.exe' }
          $runtimeExecutable = Get-Command -Name $runtimeCommand -CommandType Application -ErrorAction Stop |
            Select-Object -First 1
          $runtimePath = [string]$runtimeExecutable.Source

          # The PowerShell 7 E2E host cannot safely update its own executable.
          # Windows PowerShell 5.1 runs the same full install and verifies this package.
          if ($expectedRuntime -eq '7') {
            $manifestPath = Join-Path $env:GITHUB_WORKSPACE 'windows\winget\packages.json'
            $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
            $powerShellPackages = @(
              $manifest.Sources | ForEach-Object { $_.Packages } |
                Where-Object { $_.PackageIdentifier -eq 'Microsoft.PowerShell' }
            )
            if ($powerShellPackages.Count -ne 1) {
              throw "Expected one Microsoft.PowerShell manifest entry; found $($powerShellPackages.Count)."
            }
            $powerShellPackages[0] | Add-Member -NotePropertyName ciSkipInstall -NotePropertyValue $true -Force
            $manifest | ConvertTo-Json -Depth 100 |
              Set-Content -LiteralPath $manifestPath -Encoding utf8
            Write-Host 'Microsoft.PowerShell self-update is covered by the Windows PowerShell 5.1 E2E job'
          }

          $installerE2EScript = @'
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $validationErrors = [System.Collections.Generic.List[string]]::new()
          function Invoke-WindowsE2EValidation {
            param(
              [Parameter(Mandatory)]
              [string]$Name,
              [Parameter(Mandatory)]
              [scriptblock]$Validation
            )

            try {
              & $Validation
            }
            catch {
              $validationError = "${Name}: $($_.Exception.Message)"
              $validationErrors.Add($validationError)
              Write-Host "Windows installer E2E validation failed: $validationError" -ForegroundColor Red
            }
          }

          try {
          $expectedVersion = $env:DOTFILES_E2E_POWERSHELL_VERSION
          $expectedMajorVersion = if ($expectedVersion -eq '5.1') { 5 } else { 7 }
          if ($PSVersionTable.PSVersion.Major -ne $expectedMajorVersion) {
            throw "Windows installer E2E must run under PowerShell $expectedVersion, got $($PSVersionTable.PSVersion)"
          }

          $originalPath = $env:PATH
          $originalPs7Dir = $env:DOTFILES_PS7_DIR
          $originalForceWindowsPowerShell = $env:DOTFILES_FORCE_WINDOWS_POWERSHELL
          $isWindowsPowerShell = $expectedVersion -eq '5.1'
          $pwshExecutable = (Get-Command -Name 'pwsh.exe' -CommandType Application -ErrorAction Stop).Source
          $env:DOTFILES_PS7_DIR = Split-Path -Parent $pwshExecutable
          if ($isWindowsPowerShell) {
            # Keep PowerShell 7 visible so WinGet verifies its installed package;
            # the explicit flag forces only install.cmd to use Windows PowerShell.
            $env:DOTFILES_FORCE_WINDOWS_POWERSHELL = '1'
          }
          else {
            Remove-Item Env:\DOTFILES_FORCE_WINDOWS_POWERSHELL -ErrorAction SilentlyContinue
          }

          # The hosted image can contain pnpm already. Hide only its executable
          # directory for the installer process so both shell jobs exercise the
          # actual npm/corepack bootstrap path reported as failing by users.
          $pnpmExecutableDirectories = @(
            Get-Command -Name 'pnpm' -CommandType Application -All -ErrorAction SilentlyContinue |
              ForEach-Object { Split-Path -Parent $_.Source } |
              Sort-Object -Unique
          )

          Push-Location $env:GITHUB_WORKSPACE
          try {
            if ($pnpmExecutableDirectories.Count -gt 0) {
              $env:PATH = @(
                $env:PATH -split ';' |
                  Where-Object { $_ -and $_ -notin $pnpmExecutableDirectories }
              ) -join ';'
            }
            if (Get-Command -Name 'pnpm' -CommandType Application -ErrorAction SilentlyContinue) {
              throw 'Could not isolate the preinstalled pnpm executable for the bootstrap E2E'
            }
            if (-not (Get-Command -Name 'npm' -CommandType Application -ErrorAction SilentlyContinue)) {
              throw 'Cannot exercise the pnpm bootstrap E2E because npm is unavailable after pnpm isolation'
            }

            $classicBefore = @(winget list --id 9NT1R1C2HH7J --exact --source msstore --accept-source-agreements --disable-interactivity 2>&1)
            $classicBeforeExitCode = $LASTEXITCODE
            $classicBeforeText = $classicBefore -join [Environment]::NewLine
            if ($classicBeforeExitCode -ne 0) {
              $classicBeforeExitCodeUnsigned = [BitConverter]::ToUInt32([BitConverter]::GetBytes([int]$classicBeforeExitCode), 0)
              if ($classicBeforeExitCodeUnsigned.ToString('X8') -ne '8A150014') {
                throw "Unable to inspect ChatGPT Classic E2E seed state (winget list exit=$($classicBeforeExitCodeUnsigned.ToString('X8'))): $classicBeforeText"
              }
            }
            if ($classicBeforeText -notmatch '(?im)^\s*.*\b9NT1R1C2HH7J\b') {
              $classicInstallOutput = @(winget install --id 9NT1R1C2HH7J --exact --source msstore --silent --accept-package-agreements --accept-source-agreements --disable-interactivity 2>&1)
              $classicInstallExitCode = $LASTEXITCODE
              if ($classicInstallExitCode -ne 0) {
                throw "Could not seed the ChatGPT Classic uninstall E2E (winget exit=$classicInstallExitCode): $($classicInstallOutput -join ' ')"
              }
              $classicInstalled = @(winget list --id 9NT1R1C2HH7J --exact --source msstore --accept-source-agreements --disable-interactivity 2>&1)
              $classicInstalledText = $classicInstalled -join [Environment]::NewLine
              if ($classicInstalledText -notmatch '(?im)^\s*.*\b9NT1R1C2HH7J\b') {
                throw "ChatGPT Classic E2E seed install did not become visible in WinGet: $classicInstalledText"
              }
            }

            if ($isWindowsPowerShell) {
              if ($env:DOTFILES_FORCE_WINDOWS_POWERSHELL -ne '1') {
                throw 'The Windows PowerShell 5.1 E2E did not force the install.cmd fallback'
              }
              if (-not (Get-Command -Name 'pwsh.exe' -CommandType Application -ErrorAction SilentlyContinue)) {
                throw 'PowerShell 7 must remain discoverable so WinGet can verify the installed package'
              }
            }
            else {
              if (-not (Test-Path -LiteralPath (Join-Path $env:DOTFILES_PS7_DIR 'pwsh.exe'))) {
                throw 'PowerShell 7 executable is missing from DOTFILES_PS7_DIR'
              }
            }

            # Reproduce a stale/oversized inherited PATH before the real install.
            # install.user.ps1 must normalize it before its first child process.
            $oversizedPathEntries = 1..500 | ForEach-Object { "C:\dotfiles-ci-stale-path-entry-$_" }
            $env:PATH = (@($env:PATH -split ';') + @($oversizedPathEntries)) -join ';'
            if ($env:PATH.Length -le 8191 -or $env:PATH.Length -ge 32767) {
              throw "Could not seed a valid oversized process PATH for the installer E2E: $($env:PATH.Length) characters"
            }

            $ErrorActionPreference = 'Continue'
            $output = & cmd.exe /d /c install.cmd -NoPause -UserPhaseOnly 2>&1 |
              ForEach-Object {
                $line = [string]$_
                Write-Host $line
                $line
              }
            $exitCode = $LASTEXITCODE
            $ErrorActionPreference = 'Stop'
          }
          finally {
            $env:PATH = $originalPath
            if ($null -eq $originalForceWindowsPowerShell) {
              Remove-Item Env:\DOTFILES_FORCE_WINDOWS_POWERSHELL -ErrorAction SilentlyContinue
            }
            else {
              $env:DOTFILES_FORCE_WINDOWS_POWERSHELL = $originalForceWindowsPowerShell
            }
            if ($null -eq $originalPs7Dir) {
              Remove-Item Env:\DOTFILES_PS7_DIR -ErrorAction SilentlyContinue
            }
            else {
              $env:DOTFILES_PS7_DIR = $originalPs7Dir
            }
            Pop-Location
          }

          $out = $output -join [Environment]::NewLine

          # install.cmd persists PATH and PNPM_HOME to the user environment in
          # its child process. Re-read those values so post-install probes use
          # the shims the installer just published, not only the runner PATH.
          $npmPrefixOutput = @(npm prefix --global 2>&1)
          $npmPrefixExitCode = $LASTEXITCODE
          $npmGlobalPrefix = if ($npmPrefixExitCode -eq 0) { [string]($npmPrefixOutput | Select-Object -Last 1) } else { '' }
          $runnerPnpmDirectories = @($pnpmExecutableDirectories | Where-Object {
            [string]::IsNullOrWhiteSpace($npmGlobalPrefix) -or
            -not [System.StringComparer]::OrdinalIgnoreCase.Equals(
              [System.IO.Path]::GetFullPath($_).TrimEnd('\'),
              [System.IO.Path]::GetFullPath($npmGlobalPrefix.Trim()).TrimEnd('\')
            )
          })
          . (Join-Path $env:GITHUB_WORKSPACE 'scripts/powershell/lib/Invoke-ExternalCommand.ps1')
          $env:PATH = $originalPath
          Update-ProcessEnvironmentPath -ExcludePath $runnerPnpmDirectories
          if ($env:PATH.Length -gt 8191) {
            throw "Post-install PATH exceeds the cmd.exe command environment limit: $($env:PATH.Length)"
          }
          $persistedPnpmHome = [Environment]::GetEnvironmentVariable('PNPM_HOME', 'User')
          if (-not [string]::IsNullOrWhiteSpace($persistedPnpmHome)) {
            $env:PNPM_HOME = $persistedPnpmHome
          }

          Invoke-WindowsE2EValidation -Name 'installer evidence' -Validation {
          . (Join-Path $env:GITHUB_WORKSPACE 'scripts/powershell/ci/Assert-WindowsInstallerSuccess.ps1')
          $npmManifest = Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'windows/npm/packages.json') -Raw | ConvertFrom-Json
          $pnpmManifest = Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'windows/pnpm/packages.json') -Raw | ConvertFrom-Json
          $requiredPackageManagerMarkers = @('[Pnpm] npm で pnpm をインストールしました')
          foreach ($package in $npmManifest.globalPackages) {
            $requiredPackageManagerMarkers += "[Npm] ✓ $($package.name)"
          }
          foreach ($package in $pnpmManifest.globalPackages) {
            $installFeature = $package.PSObject.Properties['installFeature']
            if ($null -eq $installFeature -or [string]::IsNullOrWhiteSpace([string]$installFeature.Value)) {
              $requiredPackageManagerMarkers += "[Pnpm] ✓ $($package.name)"
            }
          }
          Assert-WindowsInstallerSuccess `
            -Output $out `
            -ExitCode $exitCode `
            -CompletionMarker 'User Phase Complete!' `
            -RequiredOutputMarkers $requiredPackageManagerMarkers
          if ($isWindowsPowerShell -and $out -notmatch 'Using Windows PowerShell') {
            throw 'The full Windows installer E2E did not exercise the forced Windows PowerShell 5.1 path'
          }
          if (-not $isWindowsPowerShell -and $out -match '(Using Windows PowerShell|Falling back to Windows PowerShell)') {
            throw 'The PowerShell 7 installer E2E unexpectedly used the Windows PowerShell 5.1 path'
          }
          if ($out -notmatch '\[INFO\] Process PATH normalized: removed \d+ missing directories and omitted \d+ over-limit entries; final length \d+/8191\.') {
            throw 'The real installer E2E did not remove stale PATH entries before starting package commands'
          }
          }

          Invoke-WindowsE2EValidation -Name 'WinGet package inventory' -Validation {
          . (Join-Path $env:GITHUB_WORKSPACE 'scripts/powershell/ci/Assert-WingetInstallSuccess.ps1')
          $wingetManifest = Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'windows/winget/packages.json') -Raw | ConvertFrom-Json
          $wingetSource = @($wingetManifest.Sources | Where-Object { $_.SourceDetails.Name -eq 'winget' }) | Select-Object -First 1
          if ($null -eq $wingetSource) {
            throw 'Windows E2E manifest does not contain the winget source'
          }

          # This uses the normal install path, not WingetVerifyCommandOnly. Check
          # every package the user phase normally applies, including packages
          # marked ciSkipInstall for the separate verify-only CI mode.
          $expectedWindowsPackageIds = @(
            $wingetSource.Packages |
              Where-Object {
                $properties = $_.PSObject.Properties
                $requiresAdmin = $properties['requiresAdmin']
                $installFeature = $properties['installFeature']
                $skipInstall = $properties['skipInstall']
                $ciSkipInstall = $properties['ciSkipInstall']
                ($null -eq $requiresAdmin -or -not [bool]$requiresAdmin.Value) -and
                ($null -eq $installFeature -or [string]::IsNullOrWhiteSpace([string]$installFeature.Value)) -and
                ($null -eq $skipInstall -or -not [bool]$skipInstall.Value) -and
                ($null -eq $ciSkipInstall -or -not [bool]$ciSkipInstall.Value)
              } |
              ForEach-Object { [string]$_.PackageIdentifier } |
              Sort-Object -Unique
          )
          if ($expectedWindowsPackageIds.Count -eq 0) {
            throw 'Windows E2E manifest has no eligible packages to install and verify'
          }
          Assert-WingetInstallSuccess -Output $out -ExpectedPackageIds $expectedWindowsPackageIds
          }

          Invoke-WindowsE2EValidation -Name 'pnpm bootstrap' -Validation {
          $npmPrefixOutput = @(npm prefix --global 2>&1)
          $npmPrefixExitCode = $LASTEXITCODE
          $npmGlobalPrefix = if ($npmPrefixExitCode -eq 0) { [string]($npmPrefixOutput | Select-Object -Last 1) } else { '' }
          if ([string]::IsNullOrWhiteSpace($npmGlobalPrefix)) {
            throw "Unable to resolve the npm global prefix for the pnpm bootstrap (exit=$npmPrefixExitCode): $($npmPrefixOutput -join ' ')"
          }
          $npmGlobalPrefix = [System.IO.Path]::GetFullPath($npmGlobalPrefix.Trim())
          $npmPnpmShim = Join-Path $npmGlobalPrefix 'pnpm.cmd'
          if (-not (Test-Path -LiteralPath $npmPnpmShim -PathType Leaf)) {
            throw "npm did not install the pnpm command shim under its global prefix: $npmPnpmShim"
          }
          $npmPnpmOutput = @(& $npmPnpmShim --version 2>&1)
          $npmPnpmExitCode = $LASTEXITCODE
          if ($npmPnpmExitCode -ne 0 -or ($npmPnpmOutput -join ' ') -notmatch '\d+\.\d+') {
            throw "npm-installed pnpm shim failed its version probe (exit=$npmPnpmExitCode): $($npmPnpmOutput -join ' ')"
          }
          }

          Invoke-WindowsE2EValidation -Name 'ChatGPT Classic removal' -Validation {
          if ($out -notmatch '(?m)RETIRED_PACKAGE_CLEANUP: id=9NT1R1C2HH7J status=(removed|absent)') {
            throw 'ChatGPT Classic retired-package cleanup did not complete successfully'
          }

          $classicListOutput = @(winget list --id 9NT1R1C2HH7J --exact --source msstore --accept-source-agreements --disable-interactivity 2>&1)
          $classicListExitCode = $LASTEXITCODE
          $classicListText = $classicListOutput -join [Environment]::NewLine
          if ($classicListText -match '(?im)^\s*.*\b9NT1R1C2HH7J\b') {
            throw 'ChatGPT Classic is still installed after cleanup'
          }
          if ($classicListExitCode -ne 0) {
            $classicListExitCodeUnsigned = [BitConverter]::ToUInt32([BitConverter]::GetBytes([int]$classicListExitCode), 0)
            if ($classicListExitCodeUnsigned.ToString('X8') -ne '8A150014') {
              throw "Unable to verify ChatGPT Classic removal (winget list exit=$($classicListExitCodeUnsigned.ToString('X8'))): $classicListText"
            }
          }
          }

          Invoke-WindowsE2EValidation -Name 'Codex package structure' -Validation {
          $codexLinksPath = Join-Path $env:LOCALAPPDATA 'Microsoft\WinGet\Links'
          $codexShimPath = Join-Path $codexLinksPath 'codex.exe'
          if (-not (Test-Path -LiteralPath $codexShimPath -PathType Leaf)) {
            throw "Codex CLI shim is missing after installation: $codexShimPath"
          }
          $codexPathCommand = Get-Command -Name 'codex.exe' -CommandType Application -ErrorAction SilentlyContinue |
            Select-Object -First 1
          $codexPathCommandPath = Get-ExternalCommandPath -CommandInfo $codexPathCommand
          if (-not $codexPathCommand -or
            -not ([System.IO.Path]::GetFullPath($codexPathCommandPath)).Equals(
              [System.IO.Path]::GetFullPath($codexShimPath),
              [System.StringComparison]::OrdinalIgnoreCase
            )) {
            throw "Codex CLI shim is not the command exposed on PATH: expected=$codexShimPath actual=$codexPathCommandPath"
          }

          . (Join-Path $env:GITHUB_WORKSPACE 'scripts/powershell/lib/SetupHandler.ps1')
          . (Join-Path $env:GITHUB_WORKSPACE 'scripts/powershell/handlers/Handler.Codex.ps1')
          $codexPackageExecutablePath = Resolve-CodexPackageExecutablePath -LocalAppData $env:LOCALAPPDATA
          if (-not $codexPackageExecutablePath) {
            throw 'Codex executable with an adjacent code-mode host cannot be located in WinGet or Programs\Codex'
          }
          $codexShimHash = (Get-FileHash -LiteralPath $codexShimPath -Algorithm SHA256).Hash
          $codexPackageHash = (Get-FileHash -LiteralPath $codexPackageExecutablePath -Algorithm SHA256).Hash
          if (-not [System.StringComparer]::OrdinalIgnoreCase.Equals($codexShimHash, $codexPackageHash)) {
            throw "Codex PATH shim does not match the selected installed package executable: shim=$codexShimPath package=$codexPackageExecutablePath"
          }

          $codexShim = Get-Item -LiteralPath $codexShimPath
          $codexHostDirectory = $codexLinksPath
          if (($codexShim.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) {
            # Resolve the package from known install roots. This works in Windows
            # PowerShell 5.1, where FileInfo does not expose LinkType or Target.
            $codexHostDirectory = Split-Path -Parent $codexPackageExecutablePath
          }

          $codexHostPath = Join-Path $codexHostDirectory 'codex-code-mode-host.exe'
          if (-not (Test-Path -LiteralPath $codexHostPath -PathType Leaf)) {
            throw "Codex code-mode host is missing beside the selected Codex executable: $codexHostPath"
          }
          }

          Invoke-WindowsE2EValidation -Name 'required command smoke tests' -Validation {
          # A handler that cannot run its setup predicate is skipped, not failed.
          # Require the key npm/pnpm/1Password tools themselves so a green phase
          # cannot hide missing prerequisites or an unconfigured PATH.
          $onePasswordPackagesPath = Join-Path $env:LOCALAPPDATA 'Microsoft\WinGet\Packages'
          $persistedOnePasswordPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          $onePasswordUserPathEntries = @($persistedOnePasswordPath -split ';' | Where-Object { $_ } | ForEach-Object { [System.IO.Path]::GetFullPath($_.Trim()) })
          $onePasswordPackageRoot = [System.IO.Path]::GetFullPath($onePasswordPackagesPath).TrimEnd('\') + '\'
          $onePasswordPackageDirectory = $onePasswordUserPathEntries |
            Where-Object {
              $_.StartsWith($onePasswordPackageRoot, [System.StringComparison]::OrdinalIgnoreCase) -and
              (Split-Path -Leaf $_) -like 'AgileBits.1Password.CLI_*' -and
              (Test-Path -LiteralPath (Join-Path $_ 'op.exe') -PathType Leaf)
            } |
            Select-Object -First 1
          if (-not $onePasswordPackageDirectory) {
            throw 'Persisted user PATH does not identify an installed AgileBits.1Password.CLI package directory containing op.exe'
          }
          $onePasswordExecutablePath = Join-Path $onePasswordPackageDirectory 'op.exe'
          $resolvedOnePassword = Get-Command -Name 'op.exe' -CommandType Application -ErrorAction Stop | Select-Object -First 1
          $resolvedOnePasswordPath = Get-ExternalCommandPath -CommandInfo $resolvedOnePassword
          $installedOnePasswordHash = (Get-FileHash -LiteralPath $onePasswordExecutablePath -Algorithm SHA256).Hash
          $resolvedOnePasswordHash = (Get-FileHash -LiteralPath $resolvedOnePasswordPath -Algorithm SHA256).Hash
          if (-not [System.StringComparer]::OrdinalIgnoreCase.Equals($installedOnePasswordHash, $resolvedOnePasswordHash)) {
            throw "PATH-resolved op.exe does not match the configured WinGet package binary: resolved=$resolvedOnePasswordPath installed=$onePasswordExecutablePath"
          }
          $onePasswordVersion = @(& $resolvedOnePasswordPath --version 2>&1)
          $onePasswordExitCode = $LASTEXITCODE
          if ($onePasswordExitCode -ne 0) {
            throw "Installed 1Password CLI failed its version probe (exit=$onePasswordExitCode): $($onePasswordVersion -join ' ')"
          }
          $winGetLinksPath = [System.IO.Path]::GetFullPath((Join-Path $env:LOCALAPPDATA 'Microsoft\WinGet\Links'))
          if ($onePasswordUserPathEntries -contains $winGetLinksPath -and -not (Test-Path -LiteralPath (Join-Path $winGetLinksPath 'op.exe') -PathType Leaf)) {
            throw 'WinGet Links op.exe shim is missing after OnePasswordCli setup'
          }
          $nodeVersionOutput = @(node --version 2>&1)
          $nodeVersionExitCode = $LASTEXITCODE
          if ($nodeVersionExitCode -ne 0 -or $nodeVersionOutput.Count -eq 0) {
            throw "Cannot determine the active Node.js version required by agent-browser@0.38.1 (exit=$nodeVersionExitCode): $($nodeVersionOutput -join ' ')"
          }
          $nodeVersionText = ([string]($nodeVersionOutput | Select-Object -Last 1)).Trim() -replace '^v', ''
          $nodeVersion = $null
          if (-not [version]::TryParse($nodeVersionText, [ref]$nodeVersion) -or $nodeVersion -lt [version]'24.0.0') {
            throw "agent-browser@0.38.1 requires Node.js >=24.0.0; active Node.js version is '$nodeVersionText'"
          }

          $requiredCommands = @(
            @{ Name = 'npm'; Arguments = @('--version') }
            @{ Name = 'agent-browser'; Arguments = @('--version') }
            @{ Name = 'herdr'; Arguments = @('--version') }
            @{ Name = 'pnpm'; Arguments = @('--version') }
            @{ Name = 'gemini'; Arguments = @('--version') }
            @{ Name = 'op.exe'; Arguments = @('--version') }
          )
          foreach ($requiredCommand in $requiredCommands) {
            $resolvedCommand = Get-Command -Name $requiredCommand.Name -CommandType Application -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if (-not $resolvedCommand) {
              throw "Windows installer did not expose required command '$($requiredCommand.Name)'"
            }

            if ($requiredCommand.Name -eq 'pnpm') {
              $resolvedPnpmPath = [System.IO.Path]::GetFullPath((Get-ExternalCommandPath -CommandInfo $resolvedCommand))
              $expectedPnpmPath = [System.IO.Path]::GetFullPath($npmPnpmShim)
              if (-not [System.StringComparer]::OrdinalIgnoreCase.Equals($resolvedPnpmPath, $expectedPnpmPath)) {
                throw "PATH-resolved pnpm is not the npm-installed pnpm shim: resolved=$resolvedPnpmPath expected=$expectedPnpmPath"
              }
            }

            $commandArguments = @($requiredCommand.Arguments)
            $resolvedCommandPath = Get-ExternalCommandPath -CommandInfo $resolvedCommand
            $commandOutput = @(& $resolvedCommandPath @commandArguments 2>&1)
            $commandExitCode = $LASTEXITCODE
            if ($commandExitCode -ne 0) {
              throw "Windows installer command '$($requiredCommand.Name)' failed (exit=$commandExitCode): $($commandOutput -join ' ')"
            }
          }
          }
          }
          catch {
            $validationErrors.Add("Windows installer E2E setup: $($_.Exception.Message)")
          }
          finally {
            try {
              $codexShimPath = Join-Path (Join-Path $env:LOCALAPPDATA 'Microsoft\WinGet\Links') 'codex.exe'
              if (-not (Test-Path -LiteralPath $codexShimPath -PathType Leaf)) {
                throw "Codex CLI shim is missing: $codexShimPath"
              }
              $codexCliOutput = @(& $codexShimPath --help 2>&1)
              $codexCliExitCode = $LASTEXITCODE
              if ($codexCliExitCode -ne 0) {
                throw "Codex CLI --help failed (exit=$codexCliExitCode): $($codexCliOutput -join ' ')"
              }
              Write-Host 'Codex CLI launch probe passed'
            }
            catch {
              $validationErrors.Add("Codex CLI launch probe: $($_.Exception.Message)")
            }

            try {
              . (Join-Path $env:GITHUB_WORKSPACE 'scripts/powershell/lib/SetupHandler.ps1')
              . (Join-Path $env:GITHUB_WORKSPACE 'scripts/powershell/handlers/Handler.Codex.ps1')
              $codexPackageExecutablePath = Resolve-CodexPackageExecutablePath -LocalAppData $env:LOCALAPPDATA
              if (-not $codexPackageExecutablePath) {
                throw 'Codex executable with an adjacent code-mode host cannot be located in WinGet, Programs\Codex, or OpenAI\Codex'
              }

              $codexLinksPath = Join-Path $env:LOCALAPPDATA 'Microsoft\WinGet\Links'
              $codexShimPath = Join-Path $codexLinksPath 'codex.exe'
              $codexHostDirectory = $codexLinksPath
              if (Test-Path -LiteralPath $codexShimPath -PathType Leaf) {
                $codexShim = Get-Item -LiteralPath $codexShimPath
                if (($codexShim.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) {
                  $codexHostDirectory = Split-Path -Parent $codexPackageExecutablePath
                }
              }

              $codexHostPath = Join-Path $codexHostDirectory 'codex-code-mode-host.exe'
              if (-not (Test-Path -LiteralPath $codexHostPath -PathType Leaf)) {
                throw "Codex code-mode host is missing beside the selected Codex executable: $codexHostPath"
              }
              $codexHostOutput = @(& $codexHostPath --help 2>&1)
              $codexHostExitCode = $LASTEXITCODE
              if ($codexHostExitCode -ne 0) {
                throw "Codex code-mode host --help failed (exit=$codexHostExitCode): $($codexHostOutput -join ' ')"
              }
              Write-Host 'Codex code-mode host launch probe passed'
            }
            catch {
              $validationErrors.Add("Codex code-mode host launch probe: $($_.Exception.Message)")
            }
          }

          if ($validationErrors.Count -gt 0) {
            $failureSummary = "Windows installer E2E validation failed:`n - $($validationErrors -join "`n - ")"
            Write-Host $failureSummary -ForegroundColor Red
            throw $failureSummary
          }
          '@
          $installerE2EScriptPath = Join-Path $env:RUNNER_TEMP "windows-installer-e2e-$expectedRuntime-$PID.ps1"
          [System.IO.File]::WriteAllText($installerE2EScriptPath, $installerE2EScript, [System.Text.Encoding]::Unicode)
          Write-Host "Running the complete Windows installer E2E under $expectedRuntime ($($runtimeExecutable.Source))"
          try {
            & $runtimePath -NoLogo -NoProfile -ExecutionPolicy Bypass -File $installerE2EScriptPath
            $installerE2EExitCode = $LASTEXITCODE
          }
          finally {
            Remove-Item -LiteralPath $installerE2EScriptPath -Force -ErrorAction SilentlyContinue
          }
          if ($installerE2EExitCode -ne 0) {
            exit $installerE2EExitCode
          }

  complete:
    name: Bootstrap / Complete
    if: ${{ always() }}
    needs:
      [
        changes,
        nix-lint,
        nix-format,
        nix-test,
        linux-build,
        linux-ubuntu,
        linux-debian,
        linux-nixos,
        darwin,
        wsl,
        windows,
        windows-installer,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      PLATFORM_REQUIRED: ${{ needs.changes.outputs.platforms }}
      LINUX_REQUIRED: ${{ needs.changes.outputs.linux }}
      DARWIN_REQUIRED: ${{ needs.changes.outputs.darwin }}
      WSL_REQUIRED: ${{ needs.changes.outputs.wsl }}
      WINDOWS_REQUIRED: ${{ needs.changes.outputs.windows }}
      NIX_REQUIRED: ${{ needs.changes.outputs.nix }}
      LINUX_BUILD_RESULT: ${{ needs.linux-build.result }}
      LINUX_UBUNTU_RESULT: ${{ needs.linux-ubuntu.result }}
      LINUX_DEBIAN_RESULT: ${{ needs.linux-debian.result }}
      LINUX_NIXOS_RESULT: ${{ needs.linux-nixos.result }}
      DARWIN_RESULT: ${{ needs.darwin.result }}
      WSL_RESULT: ${{ needs.wsl.result }}
      WINDOWS_RESULT: ${{ needs.windows.result }}
      NIX_LINT_RESULT: ${{ needs.nix-lint.result }}
      NIX_FORMAT_RESULT: ${{ needs.nix-format.result }}
      NIX_TEST_RESULT: ${{ needs.nix-test.result }}
      WINDOWS_INSTALLER_RESULT: ${{ needs.windows-installer.result }}
    steps:
      - name: Verify routed job results
        run: |
          set -euo pipefail

          if [[ "${CHANGES_RESULT}" != "success" ]]; then
            echo "CI change detection did not complete successfully: ${CHANGES_RESULT}"
            exit 1
          fi

          if [[ "${PLATFORM_REQUIRED}" != "true" ]]; then
            echo "No bootstrap runtime changes; verifying that platform jobs were skipped."
          fi

          check_platform() {
            local name="$1"
            local required="$2"
            local result="$3"

            if [[ "${required}" == "true" && "${result}" != "success" ]]; then
              echo "Required Bootstrap platform job ${name} did not succeed: ${result}"
              return 1
            fi
            if [[ "${required}" != "true" && "${result}" != "skipped" ]]; then
              echo "Unselected Bootstrap platform job ${name} ran unexpectedly: ${result}"
              return 1
            fi
          }

          check_required_job() {
            local name="$1"
            local required="$2"
            local result="$3"

            if [[ "${required}" == "true" && "${result}" != "success" ]]; then
              echo "Required Bootstrap job ${name} did not succeed: ${result}"
              return 1
            fi
            if [[ "${required}" != "true" && "${result}" != "skipped" ]]; then
              echo "Unselected Bootstrap job ${name} ran unexpectedly: ${result}"
              return 1
            fi
          }

          check_required_job "Nix / Lint" "${NIX_REQUIRED}" "${NIX_LINT_RESULT}"
          check_required_job "Nix / Format" "${NIX_REQUIRED}" "${NIX_FORMAT_RESULT}"
          check_required_job "Nix / Test" "${NIX_REQUIRED}" "${NIX_TEST_RESULT}"
          check_required_job "Windows / Installer" "${WINDOWS_REQUIRED}" "${WINDOWS_INSTALLER_RESULT}"

          check_platform "Linux / Build" "${LINUX_REQUIRED}" "${LINUX_BUILD_RESULT}"
          check_platform "Linux / E2E / Ubuntu" "${LINUX_REQUIRED}" "${LINUX_UBUNTU_RESULT}"
          check_platform "Linux / E2E / Debian" "${LINUX_REQUIRED}" "${LINUX_DEBIAN_RESULT}"
          check_platform "Linux / E2E / NixOS" "${LINUX_REQUIRED}" "${LINUX_NIXOS_RESULT}"
          check_platform "Darwin" "${DARWIN_REQUIRED}" "${DARWIN_RESULT}"
          check_platform "WSL" "${WSL_REQUIRED}" "${WSL_RESULT}"
          check_platform "Windows" "${WINDOWS_REQUIRED}" "${WINDOWS_RESULT}"

          echo "All required bootstrap platform jobs completed successfully."
