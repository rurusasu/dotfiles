name: Temporary install lock refresh

on:
  push:
    branches: [feat/install-progress]
    paths: [.github/workflows/install-lock-refresh.yml]

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Refresh all inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          NIX_CONFIG="access-tokens = github.com=$GITHUB_TOKEN" nix flake update
          sha256sum flake.lock
          printf '%s\n' "$GITHUB_SHA" > lock-refresh-commit.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: install-lock-refresh
          path: |
            flake.lock
            lock-refresh-commit.txt
          retention-days: 1
