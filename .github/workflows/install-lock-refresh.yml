name: Temporary install lock refresh

on:
  push:
    branches: [feat/install-progress]
    paths: [.github/workflows/install-lock-refresh.yml]

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Refresh and validate all inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          export NIX_CONFIG="access-tokens = github.com=$GITHUB_TOKEN"
          nix flake update
          nix flake check --no-build --all-systems
          nix profile install --inputs-from . nixpkgs#go-task nixpkgs#chezmoi nixpkgs#pre-commit
      - name: Commit the final diff through Task
        env:
          SKIP: hermes-bootstrap-tests
        run: |
          export PATH="$HOME/.nix-profile/bin:$PATH"
          mkdir -p "$HOME/.local/share"
          ln -s "$GITHUB_WORKSPACE/chezmoi" "$HOME/.local/share/chezmoi"
          chezmoi apply --exclude scripts "$HOME/.agents/skills"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/install-lock-refresh.yml
          task commit -- 'chore: refresh flake inputs and remove temporary workflow'
          nix fmt -- --fail-on-change
          git diff --exit-code
          git bundle create install-refresh.bundle HEAD "^$GITHUB_SHA"
          sha256sum flake.lock install-refresh.bundle
          printf '%s\n' "$GITHUB_SHA" > lock-refresh-commit.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: install-lock-refresh
          path: |
            flake.lock
            install-refresh.bundle
            lock-refresh-commit.txt
          retention-days: 1
