name: PowerShell CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: ci-powershell / Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      powershell_lint: ${{ steps.detect.outputs.powershell_lint }}
      powershell_test: ${{ steps.detect.outputs.powershell_test }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed job targets
        id: detect
        uses: ./.github/actions/detect-ci-changes
        with:
          base-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || github.sha }}
          head-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          run-all: ${{ github.event_name == 'workflow_dispatch' }}
          manifest: ci/job-path-routing.json

  lint:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.powershell_lint == 'true') }}
    name: Lint (PSScriptAnalyzer)
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Verify change detection
        if: ${{ needs.changes.result != 'success' }}
        shell: bash
        run: exit 1
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Cache PSScriptAnalyzer
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~\Documents\PowerShell\Modules\PSScriptAnalyzer
          key: ${{ runner.os }}-pssa-lint-1.22.0

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          function Invoke-WithRetry {
            param([scriptblock]$Script, [int]$Max = 3)
            for ($i = 1; $i -le $Max; $i++) {
              try { & $Script; return } catch {
                if ($i -eq $Max) { throw }
                Write-Warning "Attempt $i failed: $_. Retrying in $($i * 5)s..."
                Start-Sleep -Seconds ($i * 5)
              }
            }
          }

          $moduleRoot = Join-Path $HOME 'Documents\PowerShell\Modules'
          if ($env:PSModulePath -notlike "*$moduleRoot*") {
            $env:PSModulePath = "$moduleRoot;$env:PSModulePath"
          }

          function Install-GalleryModuleArchive {
            param([string]$Name, [string]$Version)

            $modulePath = Join-Path $moduleRoot "$Name\$Version"
            if (-not (Test-Path -LiteralPath (Join-Path $modulePath "$Name.psd1"))) {
              $packagePath = Join-Path $env:RUNNER_TEMP "$Name.$Version.zip"
              if (Test-Path -LiteralPath $modulePath) {
                Remove-Item -LiteralPath $modulePath -Recurse -Force
              }
              New-Item -ItemType Directory -Force -Path $modulePath | Out-Null
              $downloadParams = @{
                Uri             = "https://www.powershellgallery.com/api/v2/package/$Name/$Version"
                OutFile         = $packagePath
                UseBasicParsing = $true
              }
              Invoke-WithRetry {
                Invoke-WebRequest @downloadParams
              }
              Expand-Archive -LiteralPath $packagePath -DestinationPath $modulePath -Force
            }

            Import-Module -Name $Name -RequiredVersion $Version -Force
          }

          Install-GalleryModuleArchive -Name PSScriptAnalyzer -Version '1.22.0'

      - name: Run PSScriptAnalyzer and generate SARIF
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $settings = Join-Path $env:GITHUB_WORKSPACE 'scripts/powershell/PSScriptAnalyzerSettings.psd1'
          $findings = Invoke-ScriptAnalyzer -Path scripts/powershell -Recurse -Settings $settings |
            Where-Object { $_.RuleName -ne 'TypeNotFound' }

          $sevMap = @{ Error = 'error'; ParseError = 'error'; Warning = 'warning'; Information = 'note' }
          $results = [object[]]@(
            $findings | ForEach-Object {
              $uri = [System.IO.Path]::GetRelativePath($env:GITHUB_WORKSPACE, $_.ScriptPath).Replace('\', '/')
              @{
                ruleId    = $_.RuleName
                message   = @{ text = $_.Message }
                level     = $sevMap[$_.Severity.ToString()]
                locations = @(@{
                  physicalLocation = @{
                    artifactLocation = @{ uri = $uri; uriBaseId = '%SRCROOT%' }
                    region           = @{
                      startLine   = [Math]::Max(1, [int]$_.Line)
                      startColumn = [Math]::Max(1, [int]$_.Column)
                    }
                  }
                })
              }
            }
          )
          $sarif = @{
            '$schema' = 'https://json.schemastore.org/sarif-2.1.0.json'
            version   = '2.1.0'
            runs      = @(@{
              tool    = @{
                driver = @{
                  name           = 'PSScriptAnalyzer'
                  informationUri = 'https://github.com/PowerShell/PSScriptAnalyzer'
                  rules          = @()
                }
              }
              results = $results
            })
          }
          $sarif | ConvertTo-Json -Depth 10 | Set-Content pssa.sarif -Encoding UTF8
          Write-Host "SARIF: $(@($findings).Count) finding(s)"

          $errors = @($findings | Where-Object { $_.Severity -in 'Error','ParseError' }).Count
          Set-Content pssa_errors.txt $errors

      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          sarif_file: pssa.sarif
          category: PSScriptAnalyzer

      - name: Fail on PSScriptAnalyzer errors
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path pssa_errors.txt)) {
            Write-Error "pssa_errors.txt not found — SARIF generation step likely failed"
            exit 1
          }
          $errors = [int](Get-Content pssa_errors.txt -Raw).Trim()
          if ($errors -gt 0) {
            Write-Error "PSScriptAnalyzer: $errors error(s) found"
            exit 1
          }

  test:
    needs: [changes, lint]
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.powershell_test == 'true') }}
    name: Test (Pester + Codecov / ${{ matrix.runtime }})
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runtime: Windows PowerShell 5.1
            shell: powershell
            module_path: ~\Documents\WindowsPowerShell\Modules
          - runtime: PowerShell 7
            shell: pwsh
            module_path: ~\Documents\PowerShell\Modules
    permissions:
      contents: read
    steps:
      - name: Verify change detection
        if: ${{ needs.changes.result != 'success' || (needs.lint.result != 'success' && needs.lint.result != 'skipped') }}
        shell: bash
        run: exit 1
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install chezmoi
        uses: ./.github/actions/install-chezmoi

      - name: Install and validate AutoHotkey v2
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          winget install --id AutoHotkey.AutoHotkey --exact --source winget --scope machine --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) {
            throw "winget failed to install AutoHotkey v2 (exit $LASTEXITCODE)"
          }
          $autoHotkey = "$env:ProgramFiles\AutoHotkey\v2\AutoHotkey64.exe"
          if (-not (Test-Path -LiteralPath $autoHotkey -PathType Leaf)) {
            throw "AutoHotkey v2 executable was not found after installation: $autoHotkey"
          }
          $uiAccess = "$env:ProgramFiles\AutoHotkey\v2\AutoHotkey64_UIA.exe"
          if (-not (Test-Path -LiteralPath $uiAccess -PathType Leaf)) {
            throw "AutoHotkey v2 UIAccess executable was not found after machine installation: $uiAccess"
          }
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE 'chezmoi\terminals\windows-terminal\terminal-keybindings.ahk'
          & $uiAccess '/ErrorStdOut' $scriptPath '--check'
          if ($LASTEXITCODE -ne 0) {
            throw "AutoHotkey v2 UIAccess syntax validation failed (exit $LASTEXITCODE)"
          }
          & $uiAccess '/ErrorStdOut' $scriptPath '--self-test'
          if ($LASTEXITCODE -ne 0) {
            throw "AutoHotkey v2 UIAccess behavioral self-tests failed (exit $LASTEXITCODE)"
          }

      - name: Cache PowerShell modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ${{ matrix.module_path }}
          key: ${{ runner.os }}-${{ matrix.runtime }}-psmodules-pester-5.6.1-pssa-1.22.0

      - name: Install PowerShell modules
        shell: ${{ matrix.shell }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          function Invoke-WithRetry {
            param([scriptblock]$Script, [int]$Max = 3)
            for ($i = 1; $i -le $Max; $i++) {
              try { & $Script; return } catch {
                if ($i -eq $Max) { throw }
                Write-Warning "Attempt $i failed: $_. Retrying in $($i * 5)s..."
                Start-Sleep -Seconds ($i * 5)
              }
            }
          }

          $moduleDirectory = if ($PSVersionTable.PSVersion.Major -eq 5) {
            'Documents\WindowsPowerShell\Modules'
          }
          else {
            'Documents\PowerShell\Modules'
          }
          $moduleRoot = Join-Path $HOME $moduleDirectory
          if ($env:PSModulePath -notlike "*$moduleRoot*") {
            $env:PSModulePath = "$moduleRoot;$env:PSModulePath"
          }

          function Install-GalleryModuleArchive {
            param([string]$Name, [string]$Version)

            $modulePath = Join-Path $moduleRoot "$Name\$Version"
            if (-not (Test-Path -LiteralPath (Join-Path $modulePath "$Name.psd1"))) {
              $packagePath = Join-Path $env:RUNNER_TEMP "$Name.$Version.zip"
              if (Test-Path -LiteralPath $modulePath) {
                Remove-Item -LiteralPath $modulePath -Recurse -Force
              }
              New-Item -ItemType Directory -Force -Path $modulePath | Out-Null
              $downloadParams = @{
                Uri             = "https://www.powershellgallery.com/api/v2/package/$Name/$Version"
                OutFile         = $packagePath
                UseBasicParsing = $true
              }
              Invoke-WithRetry {
                Invoke-WebRequest @downloadParams
              }
              Expand-Archive -LiteralPath $packagePath -DestinationPath $modulePath -Force
            }

            Import-Module -Name $Name -RequiredVersion $Version -Force
          }

          Install-GalleryModuleArchive -Name Pester -Version '5.6.1'
          Install-GalleryModuleArchive -Name PSScriptAnalyzer -Version '1.22.0'

      - name: Run tests
        shell: ${{ matrix.shell }}
        working-directory: scripts/powershell
        run: |
          .\tests\Invoke-Tests.ps1 `
            -MinimumCoverage 0 `
            -OutputFile test-results.xml `
            -CoverageOutputFile coverage.xml

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: test-results-${{ matrix.runtime }}
          path: |
            scripts/powershell/test-results.xml
            scripts/powershell/coverage.xml
          retention-days: 30
          if-no-files-found: warn

  test-windows-powershell:
    needs: [changes, lint]
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.powershell_test == 'true') }}
    name: Test (Windows PowerShell 5.1 compatibility)
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Verify change detection
        if: ${{ needs.changes.result != 'success' || (needs.lint.result != 'success' && needs.lint.result != 'skipped') }}
        shell: bash
        run: exit 1
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Cache Windows PowerShell modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~\Documents\WindowsPowerShell\Modules
          key: ${{ runner.os }}-windows-powershell-pester-5.6.1

      - name: Install Pester for Windows PowerShell
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          function Invoke-WithRetry {
            param([scriptblock]$Script, [int]$Max = 3)
            for ($i = 1; $i -le $Max; $i++) {
              try { & $Script; return } catch {
                if ($i -eq $Max) { throw }
                Write-Warning "Attempt $i failed: $_. Retrying in $($i * 5)s..."
                Start-Sleep -Seconds ($i * 5)
              }
            }
          }

          [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12

          $moduleRoot = Join-Path $HOME 'Documents\WindowsPowerShell\Modules'
          if ($env:PSModulePath -notlike "*$moduleRoot*") {
            $env:PSModulePath = "$moduleRoot;$env:PSModulePath"
          }

          $pesterVersion = '5.6.1'
          $pesterPath = Join-Path $moduleRoot "Pester\$pesterVersion"
          if (-not (Test-Path -LiteralPath (Join-Path $pesterPath 'Pester.psd1'))) {
            $packagePath = Join-Path $env:RUNNER_TEMP "Pester.$pesterVersion.zip"
            if (Test-Path -LiteralPath $pesterPath) {
              Remove-Item -LiteralPath $pesterPath -Recurse -Force
            }
            New-Item -ItemType Directory -Force -Path $pesterPath | Out-Null
            $downloadParams = @{
              Uri             = "https://www.powershellgallery.com/api/v2/package/Pester/$pesterVersion"
              OutFile         = $packagePath
              UseBasicParsing = $true
            }
            Invoke-WithRetry {
              Invoke-WebRequest @downloadParams
            }
            Expand-Archive -LiteralPath $packagePath -DestinationPath $pesterPath -Force
          }

          Import-Module Pester -RequiredVersion $pesterVersion -Force

      - name: Run Invoke-ExternalCommand tests on Windows PowerShell
        shell: powershell
        working-directory: scripts/powershell/tests
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $runner = [scriptblock]::Create((Get-Content -LiteralPath .\Invoke-Tests.ps1 -Raw -Encoding UTF8))
          & $runner -Path .\lib\Invoke-ExternalCommand.Tests.ps1 -MinimumCoverage 0

      - name: Load Hermes bootstrap library on Windows PowerShell
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          . .\scripts\powershell\lib\HermesBootstrap.ps1
          if (-not ("HermesBootstrapBoundedDrain" -as [type])) {
            throw 'Hermes bootstrap drain type did not load'
          }
          if ([HermesBootstrapProcessArgument]::Quote('argument with spaces') -ne '"argument with spaces"') {
            throw 'Hermes bootstrap argument quoting is invalid'
          }
          $startInfo = New-HermesBootstrapProcessStartInfo `
            -Executable 'docker.exe' `
            -Arguments @('compose', '-f', 'C:\path with spaces\compose.yml') `
            -DataDir 'C:\Users\runner\.hermes'
          if ($startInfo.Arguments -ne 'compose -f "C:\path with spaces\compose.yml"') {
            throw "Hermes bootstrap Windows PowerShell arguments are invalid: $($startInfo.Arguments)"
          }
          if ($startInfo.EnvironmentVariables['HERMES_DATA_DIR'] -ne 'C:\Users\runner\.hermes') {
            throw 'Hermes bootstrap data directory environment is invalid'
          }
          $parsed = ConvertFrom-HermesBootstrapJson -Json '{"value":1}' -Depth 8
          if ($parsed.value -ne 1) {
            throw 'Hermes bootstrap JSON compatibility helper is invalid'
          }

      - name: Verify real bootstrap encoding on Windows PowerShell
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "ANSI codepage: $([Text.Encoding]::Default.CodePage)"
          & .\scripts\powershell\tests\Invoke-Tests.ps1 `
            -Path .\scripts\powershell\tests\WindowsPowerShell.Encoding.Tests.ps1 `
            -MinimumCoverage 0

      - name: Run install.cmd fallback without pwsh
        shell: powershell
        timeout-minutes: 5
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $workDir = Join-Path $env:RUNNER_TEMP 'install-cmd-fallback'
          $scriptDir = Join-Path $workDir 'scripts\powershell'
          if (Test-Path -LiteralPath $workDir) {
            Remove-Item -LiteralPath $workDir -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $scriptDir | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $scriptDir 'lib') | Out-Null
          Copy-Item -LiteralPath install.cmd -Destination (Join-Path $workDir 'install.cmd')

          Copy-Item -LiteralPath .\scripts\powershell\install.ps1 -Destination (Join-Path $scriptDir 'install.ps1')
          Copy-Item -LiteralPath .\scripts\powershell\Test-Environment.ps1 -Destination (Join-Path $scriptDir 'Test-Environment.ps1')
          foreach ($library in 'WindowsEnvironment.ps1', 'InstallProfiles.ps1', 'Invoke-ExternalCommand.ps1') {
            Copy-Item -LiteralPath (Join-Path .\scripts\powershell\lib $library) -Destination (Join-Path $scriptDir "lib\$library")
          }
          Set-Content -LiteralPath (Join-Path $scriptDir 'install.user.ps1') -Value @'
          [CmdletBinding()]
          param(
            [string]$DistroName,
            [string]$InstallDir,
            [string]$ReleaseTag,
            [string]$PostInstallScript,
            [string]$StateVersion,
            [hashtable]$Options = @{},
            [string]$SyncMode,
            [string]$SyncBack
          )
          Write-Host 'STUB_USER_PHASE_COMPLETE'
          exit 0
          '@ -Encoding UTF8
          Set-Content -LiteralPath (Join-Path $scriptDir 'install.admin.ps1') -Value @'
          [CmdletBinding()]
          param()
          exit 0
          '@ -Encoding UTF8

          $oldDotfilesPs7Dir = $env:DOTFILES_PS7_DIR
          $oldPath = $env:PATH
          $missingPs7Dir = Join-Path $env:RUNNER_TEMP 'NoPowerShell7Dir'
          New-Item -ItemType Directory -Force -Path $missingPs7Dir | Out-Null

          try {
            $env:DOTFILES_PS7_DIR = $missingPs7Dir
            $env:PATH = @(
              Join-Path $env:SystemRoot 'System32'
              Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0'
              $env:SystemRoot
            ) -join ';'

            Push-Location $workDir
            try {
              $output = & cmd.exe /d /c install.cmd -NoPause -UserPhaseOnly 2>&1 | ForEach-Object {
                $line = [string]$_
                Write-Host $line
                $line
              }
              $exitCode = $LASTEXITCODE
            }
            finally {
              Pop-Location
            }
          }
          finally {
            if ($null -eq $oldDotfilesPs7Dir) {
              Remove-Item Env:\DOTFILES_PS7_DIR -ErrorAction SilentlyContinue
            }
            else {
              $env:DOTFILES_PS7_DIR = $oldDotfilesPs7Dir
            }
            $env:PATH = $oldPath
          }

          $out = $output -join [Environment]::NewLine
          if ($exitCode -ne 0) {
            throw "install.cmd fallback failed with exit code $exitCode"
          }
          if ($out -notmatch 'Falling back to Windows PowerShell') {
            throw 'install.cmd did not exercise the Windows PowerShell fallback path'
          }
          if ($out -notmatch 'STUB_USER_PHASE_COMPLETE') {
            throw 'install.cmd fallback did not execute the real install orchestrator'
          }
          if ($out -notmatch 'User Phase Complete!') {
            throw 'install.cmd fallback did not reach the user phase completion marker'
          }
