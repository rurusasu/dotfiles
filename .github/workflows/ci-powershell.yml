name: PowerShell CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: ci-powershell / Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      powershell_lint: ${{ steps.detect.outputs.powershell_lint }}
      powershell_test: ${{ steps.detect.outputs.powershell_test }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed job targets
        id: detect
        uses: ./.github/actions/detect-ci-changes
        with:
          base-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || github.sha }}
          head-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          run-all: ${{ github.event_name == 'workflow_dispatch' }}
          manifest: ci/job-path-routing.json

  lint:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.powershell_lint == 'true') }}
    name: Lint (PSScriptAnalyzer)
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Verify change detection
        if: ${{ needs.changes.result != 'success' }}
        shell: bash
        run: exit 1
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Cache PSScriptAnalyzer
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~\Documents\PowerShell\Modules\PSScriptAnalyzer
          key: ${{ runner.os }}-pssa-lint-1.22.0

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          function Invoke-WithRetry {
            param([scriptblock]$Script, [int]$Max = 3)
            for ($i = 1; $i -le $Max; $i++) {
              try { & $Script; return } catch {
                if ($i -eq $Max) { throw }
                Write-Warning "Attempt $i failed: $_. Retrying in $($i * 5)s..."
                Start-Sleep -Seconds ($i * 5)
              }
            }
          }

          $moduleRoot = Join-Path $HOME 'Documents\PowerShell\Modules'
          if ($env:PSModulePath -notlike "*$moduleRoot*") {
            $env:PSModulePath = "$moduleRoot;$env:PSModulePath"
          }

          function Install-GalleryModuleArchive {
            param([string]$Name, [string]$Version)

            $modulePath = Join-Path $moduleRoot "$Name\$Version"
            if (-not (Test-Path -LiteralPath (Join-Path $modulePath "$Name.psd1"))) {
              $packagePath = Join-Path $env:RUNNER_TEMP "$Name.$Version.zip"
              if (Test-Path -LiteralPath $modulePath) {
                Remove-Item -LiteralPath $modulePath -Recurse -Force
              }
              New-Item -ItemType Directory -Force -Path $modulePath | Out-Null
              $downloadParams = @{
                Uri             = "https://www.powershellgallery.com/api/v2/package/$Name/$Version"
                OutFile         = $packagePath
                UseBasicParsing = $true
              }
              Invoke-WithRetry {
                Invoke-WebRequest @downloadParams
              }
              Expand-Archive -LiteralPath $packagePath -DestinationPath $modulePath -Force
            }

            Import-Module -Name $Name -RequiredVersion $Version -Force
          }

          Install-GalleryModuleArchive -Name PSScriptAnalyzer -Version '1.22.0'

      - name: Run PSScriptAnalyzer and generate SARIF
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $settings = Join-Path $env:GITHUB_WORKSPACE 'scripts/powershell/PSScriptAnalyzerSettings.psd1'
          $findings = Invoke-ScriptAnalyzer -Path scripts/powershell -Recurse -Settings $settings |
            Where-Object { $_.RuleName -ne 'TypeNotFound' }

          $sevMap = @{ Error = 'error'; ParseError = 'error'; Warning = 'warning'; Information = 'note' }
          $results = [object[]]@(
            $findings | ForEach-Object {
              $uri = [System.IO.Path]::GetRelativePath($env:GITHUB_WORKSPACE, $_.ScriptPath).Replace('\', '/')
              @{
                ruleId    = $_.RuleName
                message   = @{ text = $_.Message }
                level     = $sevMap[$_.Severity.ToString()]
                locations = @(@{
                  physicalLocation = @{
                    artifactLocation = @{ uri = $uri; uriBaseId = '%SRCROOT%' }
                    region           = @{
                      startLine   = [Math]::Max(1, [int]$_.Line)
                      startColumn = [Math]::Max(1, [int]$_.Column)
                    }
                  }
                })
              }
            }
          )
          $sarif = @{
            '$schema' = 'https://json.schemastore.org/sarif-2.1.0.json'
            version   = '2.1.0'
            runs      = @(@{
              tool    = @{
                driver = @{
                  name           = 'PSScriptAnalyzer'
                  informationUri = 'https://github.com/PowerShell/PSScriptAnalyzer'
                  rules          = @()
                }
              }
              results = $results
            })
          }
          $sarif | ConvertTo-Json -Depth 10 | Set-Content pssa.sarif -Encoding UTF8
          Write-Host "SARIF: $(@($findings).Count) finding(s)"

          $errors = @($findings | Where-Object { $_.Severity -in 'Error','ParseError' }).Count
          Set-Content pssa_errors.txt $errors

      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          sarif_file: pssa.sarif
          category: PSScriptAnalyzer

      - name: Fail on PSScriptAnalyzer errors
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path pssa_errors.txt)) {
            Write-Error "pssa_errors.txt not found — SARIF generation step likely failed"
            exit 1
          }
          $errors = [int](Get-Content pssa_errors.txt -Raw).Trim()
          if ($errors -gt 0) {
            Write-Error "PSScriptAnalyzer: $errors error(s) found"
            exit 1
          }

  test:
    needs: [changes, lint]
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.powershell_test == 'true') }}
    name: Test (Pester + Codecov / ${{ matrix.runtime }})
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runtime: Windows PowerShell 5.1
            executable: powershell.exe
            module_directory: WindowsPowerShell
            module_path: ~\Documents\WindowsPowerShell\Modules
          - runtime: PowerShell 7
            executable: pwsh.exe
            module_directory: PowerShell
            module_path: ~\Documents\PowerShell\Modules
    permissions:
      contents: read
    steps:
      - name: Verify change detection
        if: ${{ needs.changes.result != 'success' || (needs.lint.result != 'success' && needs.lint.result != 'skipped') }}
        shell: bash
        run: exit 1
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install chezmoi
        uses: ./.github/actions/install-chezmoi

      - name: Install and validate AutoHotkey v2
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          winget install --id AutoHotkey.AutoHotkey --exact --source winget --scope machine --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) {
            throw "winget failed to install AutoHotkey v2 (exit $LASTEXITCODE)"
          }
          $autoHotkey = "$env:ProgramFiles\AutoHotkey\v2\AutoHotkey64.exe"
          if (-not (Test-Path -LiteralPath $autoHotkey -PathType Leaf)) {
            throw "AutoHotkey v2 executable was not found after installation: $autoHotkey"
          }
          $uiAccess = "$env:ProgramFiles\AutoHotkey\v2\AutoHotkey64_UIA.exe"
          if (-not (Test-Path -LiteralPath $uiAccess -PathType Leaf)) {
            throw "AutoHotkey v2 UIAccess executable was not found after machine installation: $uiAccess"
          }
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE 'chezmoi\terminals\windows-terminal\terminal-keybindings.ahk'
          & $uiAccess '/ErrorStdOut' $scriptPath '--check'
          if ($LASTEXITCODE -ne 0) {
            throw "AutoHotkey v2 UIAccess syntax validation failed (exit $LASTEXITCODE)"
          }
          & $uiAccess '/ErrorStdOut' $scriptPath '--self-test'
          if ($LASTEXITCODE -ne 0) {
            throw "AutoHotkey v2 UIAccess behavioral self-tests failed (exit $LASTEXITCODE)"
          }

      - name: Cache PowerShell modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ${{ matrix.module_path }}
          key: ${{ runner.os }}-${{ matrix.runtime }}-psmodules-pester-5.6.1-pssa-1.22.0

      - name: Install PowerShell modules
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          function Invoke-WithRetry {
            param([scriptblock]$Script, [int]$Max = 3)
            for ($i = 1; $i -le $Max; $i++) {
              try { & $Script; return } catch {
                if ($i -eq $Max) { throw }
                Write-Warning "Attempt $i failed: $_. Retrying in $($i * 5)s..."
                Start-Sleep -Seconds ($i * 5)
              }
            }
          }

          $moduleRoot = Join-Path $HOME "Documents\$env:PS_MODULE_DIRECTORY\Modules"
          if ($env:PSModulePath -notlike "*$moduleRoot*") {
            $env:PSModulePath = "$moduleRoot;$env:PSModulePath"
          }

          function Install-GalleryModuleArchive {
            param([string]$Name, [string]$Version)

            $modulePath = Join-Path $moduleRoot "$Name\$Version"
            if (-not (Test-Path -LiteralPath (Join-Path $modulePath "$Name.psd1"))) {
              $packagePath = Join-Path $env:RUNNER_TEMP "$Name.$Version.zip"
              if (Test-Path -LiteralPath $modulePath) {
                Remove-Item -LiteralPath $modulePath -Recurse -Force
              }
              New-Item -ItemType Directory -Force -Path $modulePath | Out-Null
              $downloadParams = @{
                Uri             = "https://www.powershellgallery.com/api/v2/package/$Name/$Version"
                OutFile         = $packagePath
                UseBasicParsing = $true
              }
              Invoke-WithRetry {
                Invoke-WebRequest @downloadParams
              }
              Expand-Archive -LiteralPath $packagePath -DestinationPath $modulePath -Force
            }

            Import-Module -Name $Name -RequiredVersion $Version -Force
          }

          Install-GalleryModuleArchive -Name Pester -Version '5.6.1'
          Install-GalleryModuleArchive -Name PSScriptAnalyzer -Version '1.22.0'
        env:
          PS_MODULE_DIRECTORY: ${{ matrix.module_directory }}

      - name: Run tests
        shell: pwsh
        working-directory: scripts/powershell
        run: |
          & $env:PS_TEST_EXECUTABLE -NoProfile -File .\tests\Invoke-Tests.ps1 `
            -MinimumCoverage 0 `
            -OutputFile test-results.xml `
            -CoverageOutputFile coverage.xml
        env:
          PS_TEST_EXECUTABLE: ${{ matrix.executable }}

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: test-results-${{ matrix.runtime }}
          path: |
            scripts/powershell/test-results.xml
            scripts/powershell/coverage.xml
          retention-days: 30
          if-no-files-found: warn
