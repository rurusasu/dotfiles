name: Hermes Profile Provenance

on:
  push:
    branches: [main]
    paths:
      - "docker/hermes-agent/**"
      - "docker/hermes-browser/**"
      - "docker/hermes-browser-mcp/**"
      - "docker/hermes-xapi-mcp/**"
      - "scripts/sh/hermes-agent.sh"
      - "scripts/powershell/handlers/Handler.HermesAgent.ps1"
      - "tests/python/test_xapi_image_contract.py"
      - "taskfiles/hermes/taskfile.yml"
      - ".github/workflows/ci-hermes-bootstrap.yml"
      - ".github/workflows/ci-hermes-provenance.yml"
      - ".pre-commit-config.yaml"
      - "Taskfile.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hermes-profile-provenance:
    name: Hermes Profile Provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify profile-sync provenance
        env:
          HERMES_HOME_READ_TOKEN: ${{ secrets.HERMES_HOME_READ_TOKEN }}
        run: python3 docker/hermes-agent/bootstrap/tests/verify_profile_sync_provenance.py verify --dotfiles-repository . --source-url "https://github.com/rurusasu/hermes-home.git"
