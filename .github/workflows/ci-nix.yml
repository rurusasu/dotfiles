name: Bootstrap CI
on:
  workflow_dispatch: null
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
concurrency:
  group: bootstrap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  TESTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
jobs:
  changes:
    name: Bootstrap / Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TESTED_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed bootstrap targets
        id: detect
        uses: ./.github/actions/detect-ci-changes
        with:
          base-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || github.sha }}
          head-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          run-all: ${{ github.event_name == 'workflow_dispatch' }}
    outputs:
      nix: ${{ steps.detect.outputs.nix }}
      chezmoi: ${{ steps.detect.outputs.chezmoi }}
      other: ${{ steps.detect.outputs.other }}
      linux: ${{ steps.detect.outputs.linux }}
      darwin: ${{ steps.detect.outputs.darwin }}
      wsl: ${{ steps.detect.outputs.wsl }}
      windows: ${{ steps.detect.outputs.windows }}
  # Shared linux/amd64 runtime: Nix, Node, Task, jq, Python and statix.
  # Bash tests, Nix lint, Linux builds and Linux E2E consume this image; the
  # Linux producer also builds the WSL system. Dotfiles outputs are built later.
  # Reuse GHCR by tool-definition hash. Changed definitions are built, checked
  # for working tools/Nix sandbox, then published; consumers use the image digest.
  ci-tools:
    needs: changes
    if: ${{ needs.changes.outputs.nix == 'true' || needs.changes.outputs.chezmoi == 'true' || needs.changes.outputs.other == 'true' }}
    name: Bootstrap / Tools image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Authenticate to the repository image registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select image for the tool definition
        id: select
        env:
          DEFINITION_HASH: ${{ hashFiles('docker/bootstrap-ci-tools/Dockerfile', 'docker/bootstrap-ci-tools/nix.conf', 'docker/bootstrap-ci-tools/check.sh', 'docker/bootstrap-ci-tools/profile.sh') }}
          CAN_PUBLISH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          [[ "$DEFINITION_HASH" =~ ^[0-9a-f]{64}$ ]]
          image="ghcr.io/${GITHUB_REPOSITORY,,}/bootstrap-ci-tools:${DEFINITION_HASH}"
          echo "tag=$image" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$image"; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          elif [[ "$CAN_PUBLISH" == "true" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::This tool definition has no published image. A maintainer must build it on a repository branch before a fork can use it."
            exit 1
          fi
      - name: Build the tools image
        if: ${{ steps.select.outputs.build == 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: docker/bootstrap-ci-tools
          platforms: linux/amd64
          load: true
          tags: ${{ steps.select.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.TESTED_SHA }}
          cache-from: type=gha,scope=bootstrap-ci-tools
          cache-to: type=gha,scope=bootstrap-ci-tools,mode=max
      - name: Verify runtime tools and Nix sandbox before publishing
        if: ${{ steps.select.outputs.build == 'true' }}
        env:
          IMAGE: ${{ steps.select.outputs.tag }}
        run: |
          docker run --rm --privileged "$IMAGE" \
            bash /usr/local/libexec/check-bootstrap-ci-tools.sh --sandbox
      - name: Publish the verified image
        if: ${{ steps.select.outputs.build == 'true' }}
        env:
          IMAGE: ${{ steps.select.outputs.tag }}
        run: docker push "$IMAGE"
      - name: Resolve immutable image reference
        id: resolve
        env:
          IMAGE: ${{ steps.select.outputs.tag }}
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image=${IMAGE%:*}@$digest" >> "$GITHUB_OUTPUT"
  bash-test:
    name: Bootstrap / Bash tests
    needs:
      - changes
      - ci-tools
    if: ${{ needs.changes.outputs.nix == 'true' || needs.changes.outputs.chezmoi == 'true' || needs.changes.outputs.other == 'true' }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.ci-tools.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --privileged
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false
      - name: Configure Nix authentication
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/sh/configure-bootstrap-ci-nix.sh
      - name: Run Bash tests
        run: task test:bash
  nix:
    name: Bootstrap / Nix / Lint
    needs:
      - changes
      - ci-tools
    if: ${{ needs.changes.outputs.nix == 'true' }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.ci-tools.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --privileged
    defaults:
      run:
        shell: bash
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false
      - name: Configure Nix authentication
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/sh/configure-bootstrap-ci-nix.sh
      - name: Run statix
        timeout-minutes: 15
        run: statix check .
  linux-build:
    name: Bootstrap / Linux / Build
    needs:
      - changes
      - ci-tools
    if: ${{ needs.changes.outputs.nix == 'true' || needs.changes.outputs.chezmoi == 'true' }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.ci-tools.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --privileged
    defaults:
      run:
        shell: bash
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read
    env:
      CI_LINUX_REQUIRED: ${{ needs.changes.outputs.linux == 'true' }}
      CI_WSL_REQUIRED: ${{ needs.changes.outputs.windows == 'true' || needs.changes.outputs.wsl == 'true' }}
    outputs:
      linux-artifact-id: ${{ steps.upload-linux.outputs.artifact-id }}
      wsl-artifact-id: ${{ steps.upload-wsl.outputs.artifact-id }}
    steps:
      - name: Prepare CI state
        shell: bash
        run: |
          # This job uses the image/Nix tools; the hosted SDK cache is unused.
          # /__t is the runner tool-cache bind mount, separate from Actions /__e.
          df -h "$RUNNER_TEMP"
          rm -rf -- /__t/*
          df -h "$RUNNER_TEMP"
          printf 'CI_STATE=%s/bootstrap-ci\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false
      - name: Configure Nix authentication
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DOTFILES_CI_BINARY_CACHE="$RUNNER_TEMP/nix-binary-cache" \
            bash scripts/sh/configure-bootstrap-ci-nix.sh
      - name: Restore Nix cache
        uses: ./.github/actions/cache-nix
        continue-on-error: true
        with:
          name: linux-build
      - name: Build Linux checks and selected platform outputs
        # Leave time to preserve completed outputs when the build step fails.
        timeout-minutes: 150
        run: task ci:build TARGET=linux
      - name: Upload linux producer artifact
        id: upload-linux
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bootstrap-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CI_STATE }}/artifacts/linux
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
        if: ${{ needs.changes.outputs.linux == 'true' }}
      - name: Upload wsl producer artifact
        id: upload-wsl
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bootstrap-wsl-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CI_STATE }}/artifacts/wsl
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
        if: ${{ needs.changes.outputs.windows == 'true' || needs.changes.outputs.wsl == 'true' }}
      - name: Save Nix cache
        uses: ./.github/actions/cache-nix
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        continue-on-error: true
        with:
          name: linux-build
          phase: save
          max-size: "4294967296"
  # macOS builds run natively and install Nix/Task on their own runner.
  # They only need change detection, so run alongside the Linux tools image job.
  darwin-build:
    name: Bootstrap / Darwin / Build
    needs: changes
    if: ${{ needs.changes.outputs.darwin == 'true' }}
    runs-on: macos-15
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    outputs:
      darwin-artifact-id: ${{ steps.upload-darwin.outputs.artifact-id }}
    steps:
      - name: Prepare CI state
        shell: bash
        run: |
          printf 'CI_STATE=%s/bootstrap-ci\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout exact tested SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false
      - name: Free runner disk space
        run: |
          set -euo pipefail
          df -h /
          default_xcode="$(xcode-select -p)"
          default_xcode="${default_xcode%/Contents/Developer}"
          for app in /Applications/Xcode_*.app; do
            [[ "$app" == "$default_xcode" ]] && continue
            sudo rm -rf "$app"
          done
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes
          rm -rf "$HOME/Library/Developer/CoreSimulator/Devices"
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"
          rm -rf "$HOME/Library/Android/sdk"
          df -h /
      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure shared Nix caches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Task uses the runner's Nix client; activation needs matching root settings.
          DOTFILES_CI_BINARY_CACHE="$RUNNER_TEMP/nix-binary-cache" \
            bash scripts/sh/configure-bootstrap-ci-nix.sh
          sudo -H env -u XDG_CONFIG_HOME -u NIX_USER_CONF_FILES \
            PATH="$PATH" GITHUB_TOKEN="$GITHUB_TOKEN" \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            DOTFILES_CI_BINARY_CACHE="$RUNNER_TEMP/nix-binary-cache" \
            bash scripts/sh/configure-bootstrap-ci-nix.sh
          nix config show substituters | grep -Fq 'https://hermes-agent.cachix.org'
          nix config show substituters | grep -Fq "file://$RUNNER_TEMP/nix-binary-cache"
      - name: Prepare Task runner
        run: |
          set -euo pipefail
          task_path=$(nix build --inputs-from . nixpkgs#go-task --out-link "$RUNNER_TEMP/ci-task" --print-out-paths --option max-jobs 0 --option builders '')
          echo "$task_path/bin" >> "$GITHUB_PATH"
      - name: Restore Nix cache
        uses: ./.github/actions/cache-nix
        continue-on-error: true
        with:
          name: darwin
      - name: Build Darwin checks and deployment
        timeout-minutes: 200
        run: task ci:build TARGET=darwin
      - name: Upload darwin producer artifact
        id: upload-darwin
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bootstrap-darwin-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CI_STATE }}/artifacts/darwin
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
      - name: Save Nix cache
        uses: ./.github/actions/cache-nix
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        continue-on-error: true
        with:
          name: darwin
          phase: save
          max-size: "4294967296"
  windows-build:
    name: Bootstrap / Windows / Plan
    needs: changes
    if: ${{ needs.changes.outputs.windows == 'true' || needs.changes.outputs.wsl == 'true' }}
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      windows-artifact-id: ${{ steps.upload-windows.outputs.artifact-id }}
    steps:
      - name: Prepare CI state
        shell: powershell
        run: |
          "CI_STATE=$env:RUNNER_TEMP/bootstrap-ci" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding UTF8
      - name: Checkout exact tested SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false
      - name: Prepare Windows Store prerequisites
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
          $policy = $null
          try { $policy = Get-ItemProperty -LiteralPath $path -ErrorAction Stop }
          catch [Management.Automation.ItemNotFoundException] { }
          foreach ($name in @('DoNotConnectToWindowsUpdateInternetLocations', 'DisableWindowsUpdateAccess')) {
            if ($policy -and $policy.PSObject.Properties[$name]) {
              Remove-ItemProperty -LiteralPath $path -Name $name -ErrorAction Stop
            }
          }
          $service = Get-Service -Name wuauserv -ErrorAction Stop
          if ($service.StartType -eq 'Disabled') { Set-Service -Name wuauserv -StartupType Manual -ErrorAction Stop }
          if ($service.Status -ne 'Running') {
            $service.Start()
            $service.WaitForStatus([ServiceProcess.ServiceControllerStatus]::Running, [TimeSpan]::FromSeconds(30))
            $service.Refresh()
            if ($service.Status -ne 'Running') { throw 'wuauserv did not reach Running within 30 seconds.' }
          }
      - name: Bootstrap winget
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command winget -CommandType Application -ErrorAction SilentlyContinue)) {
            Install-PSResource -Name Microsoft.WinGet.Client -Scope CurrentUser -Repository PSGallery -TrustRepository
            Repair-WinGetPackageManager
          }
      - name: Prepare Task runner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          . .\scripts\powershell\lib\Invoke-ExternalCommand.ps1
          if (-not (Get-Command task -CommandType Application -ErrorAction SilentlyContinue)) {
            Invoke-NativeCommand -Command winget -Arguments @('install', '--id', 'Task.Task', '--exact', '--source', 'winget', '--accept-source-agreements', '--accept-package-agreements', '--silent') | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "Task bootstrap failed (exit=$LASTEXITCODE)." }
            Update-ProcessEnvironmentPath
          }
          $task = Get-Command task -CommandType Application -ErrorAction Stop
          Split-Path -Parent $task.Source | Add-Content -LiteralPath $env:GITHUB_PATH -Encoding UTF8
      - name: Freeze Windows installation plan
        shell: powershell
        run: task ci:build TARGET=windows
      - name: Upload windows producer artifact
        id: upload-windows
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bootstrap-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CI_STATE }}/artifacts/windows
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
  linux:
    name: Bootstrap / Linux / E2E
    needs:
      - changes
      - ci-tools
      - linux-build
    if: ${{ needs.changes.outputs.linux == 'true' }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.ci-tools.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --privileged
    defaults:
      run:
        shell: bash
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - name: Prepare CI state
        shell: bash
        run: |
          # Leave space for the imported closure and native VM disk.
          df -h "$RUNNER_TEMP"
          rm -rf -- /__t/*
          df -h "$RUNNER_TEMP"
          printf 'CI_STATE=%s/bootstrap-ci\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false
      - name: Configure Nix authentication
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DOTFILES_CI_BINARY_CACHE="$RUNNER_TEMP/nix-binary-cache" \
            bash scripts/sh/configure-bootstrap-ci-nix.sh
      - name: Require exact linux producer artifact
        shell: bash
        env:
          PRODUCER_ARTIFACT_ID: ${{ needs.linux-build.outputs.linux-artifact-id }}
        run: |
          if [[ ! $PRODUCER_ARTIFACT_ID =~ ^[1-9][0-9]*$ ]]; then
            echo 'Producer artifact ID is missing or invalid.' >&2
            exit 1
          fi
      - name: Download exact linux producer artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.linux-build.outputs.linux-artifact-id }}
          path: ${{ env.CI_STATE }}/artifacts/linux
      - name: Apply, restart and verify native Linux
        run: task ci:e2e TARGET=linux
  darwin:
    name: Bootstrap / Darwin / E2E
    needs:
      - changes
      - darwin-build
    if: ${{ needs.changes.outputs.darwin == 'true' }}
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - name: Prepare CI state
        shell: bash
        run: |
          printf 'CI_STATE=%s/bootstrap-ci\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout exact tested SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false
      - name: Free runner disk space
        run: |
          set -euo pipefail
          df -h /
          default_xcode="$(xcode-select -p)"
          default_xcode="${default_xcode%/Contents/Developer}"
          for app in /Applications/Xcode_*.app; do
            [[ "$app" == "$default_xcode" ]] && continue
            sudo rm -rf "$app"
          done
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes
          rm -rf "$HOME/Library/Developer/CoreSimulator/Devices"
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"
          rm -rf "$HOME/Library/Android/sdk"
          df -h /
      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure shared Nix caches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Task uses the runner's Nix client; activation needs matching root settings.
          DOTFILES_CI_BINARY_CACHE="$RUNNER_TEMP/nix-binary-cache" \
            bash scripts/sh/configure-bootstrap-ci-nix.sh
          sudo -H env -u XDG_CONFIG_HOME -u NIX_USER_CONF_FILES \
            PATH="$PATH" GITHUB_TOKEN="$GITHUB_TOKEN" \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            DOTFILES_CI_BINARY_CACHE="$RUNNER_TEMP/nix-binary-cache" \
            bash scripts/sh/configure-bootstrap-ci-nix.sh
          nix config show substituters | grep -Fq 'https://hermes-agent.cachix.org'
          nix config show substituters | grep -Fq "file://$RUNNER_TEMP/nix-binary-cache"
      - name: Prepare Task runner
        run: |
          set -euo pipefail
          task_path=$(nix build --inputs-from . nixpkgs#go-task --out-link "$RUNNER_TEMP/ci-task" --print-out-paths --option max-jobs 0 --option builders '')
          echo "$task_path/bin" >> "$GITHUB_PATH"
      - name: Require exact darwin producer artifact
        shell: bash
        env:
          PRODUCER_ARTIFACT_ID: ${{ needs.darwin-build.outputs.darwin-artifact-id }}
        run: |
          if [[ ! $PRODUCER_ARTIFACT_ID =~ ^[1-9][0-9]*$ ]]; then
            echo 'Producer artifact ID is missing or invalid.' >&2
            exit 1
          fi
      - name: Download exact darwin producer artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.darwin-build.outputs.darwin-artifact-id }}
          path: ${{ env.CI_STATE }}/artifacts/darwin
      - name: Preserve installer files before nix-darwin takes ownership
        run: |
          sudo -H env -u XDG_CONFIG_HOME -u NIX_USER_CONF_FILES PATH="$PATH" bash <<'SCRIPT'
          set -euo pipefail

          for path in /etc/nix/nix.conf /etc/bashrc /etc/zshrc; do
            if [[ -e "$path" ]]; then
              backup="${path}.before-nix-darwin"
              if [[ -e "$backup" ]]; then
                echo "Refusing to overwrite existing backup: $backup" >&2
                exit 1
              fi
              mv -- "$path" "$backup"
            fi
          done

          # The Nix installer owns /etc/nix/nix.conf before first activation.
          # Confirm root's persistent settings still expose the shared caches
          # after moving that file aside.
          nix --extra-experimental-features nix-command config show substituters \
            | grep -Fq 'https://hermes-agent.cachix.org'
          nix --extra-experimental-features nix-command config show trusted-public-keys \
            | grep -Fq 'hermes-agent.cachix.org-1:'
          SCRIPT
      - name: Apply, restart and verify Darwin
        run: task ci:e2e TARGET=darwin
  windows-installer:
    needs:
      - changes
      - linux-build
      - windows-build
    if: ${{ needs.changes.outputs.windows == 'true' || needs.changes.outputs.wsl == 'true' }}
    runs-on: windows-2025
    timeout-minutes: 210
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runtime: Windows PowerShell 5.1
            version: "5.1"
          - runtime: PowerShell 7
            version: "7"
    permissions:
      contents: read
    steps:
      - name: Prepare CI state
        shell: powershell
        run: |
          "CI_STATE=$env:RUNNER_TEMP/bootstrap-ci" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding UTF8
      - name: Checkout exact tested SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false
      - name: Install PowerShell test modules
        shell: pwsh
        env:
          PS_MODULE_DIRECTORY: ${{ matrix.version == '5.1' && 'WindowsPowerShell' || 'PowerShell' }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $moduleRoot = Join-Path $HOME "Documents\$env:PS_MODULE_DIRECTORY\Modules"
          New-Item -ItemType Directory -Force -Path $moduleRoot | Out-Null
          $env:PSModulePath = "$moduleRoot;$env:PSModulePath"
          # Avoid the IsLatestVersion query that PSGallery intermittently rejects.
          Save-Module -Name Pester,PSScriptAnalyzer -Repository PSGallery -Path $moduleRoot -Force -AcceptLicense
          . .\scripts\powershell\tests\support\Resolve-TestModule.ps1
          Resolve-TestModule -Name Pester | Out-Null
          Resolve-TestModule -Name PSScriptAnalyzer | Out-Null
      - name: Prepare Windows Store prerequisites
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
          $policy = $null
          try { $policy = Get-ItemProperty -LiteralPath $path -ErrorAction Stop }
          catch [Management.Automation.ItemNotFoundException] { }
          foreach ($name in @('DoNotConnectToWindowsUpdateInternetLocations', 'DisableWindowsUpdateAccess')) {
            if ($policy -and $policy.PSObject.Properties[$name]) {
              Remove-ItemProperty -LiteralPath $path -Name $name -ErrorAction Stop
            }
          }
          $service = Get-Service -Name wuauserv -ErrorAction Stop
          if ($service.StartType -eq 'Disabled') { Set-Service -Name wuauserv -StartupType Manual -ErrorAction Stop }
          if ($service.Status -ne 'Running') {
            $service.Start()
            $service.WaitForStatus([ServiceProcess.ServiceControllerStatus]::Running, [TimeSpan]::FromSeconds(30))
            $service.Refresh()
            if ($service.Status -ne 'Running') { throw 'wuauserv did not reach Running within 30 seconds.' }
          }
      - name: Bootstrap winget
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command winget -CommandType Application -ErrorAction SilentlyContinue)) {
            Install-PSResource -Name Microsoft.WinGet.Client -Scope CurrentUser -Repository PSGallery -TrustRepository
            Repair-WinGetPackageManager
          }
      - name: Prepare Task runner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          . .\scripts\powershell\lib\Invoke-ExternalCommand.ps1
          if (-not (Get-Command task -CommandType Application -ErrorAction SilentlyContinue)) {
            Invoke-NativeCommand -Command winget -Arguments @('install', '--id', 'Task.Task', '--exact', '--source', 'winget', '--accept-source-agreements', '--accept-package-agreements', '--silent') | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "Task bootstrap failed (exit=$LASTEXITCODE)." }
            Update-ProcessEnvironmentPath
          }
          $task = Get-Command task -CommandType Application -ErrorAction Stop
          Split-Path -Parent $task.Source | Add-Content -LiteralPath $env:GITHUB_PATH -Encoding UTF8
      - name: Require exact wsl producer artifact
        shell: bash
        env:
          PRODUCER_ARTIFACT_ID: ${{ needs.linux-build.outputs.wsl-artifact-id }}
        run: |
          if [[ ! $PRODUCER_ARTIFACT_ID =~ ^[1-9][0-9]*$ ]]; then
            echo 'Producer artifact ID is missing or invalid.' >&2
            exit 1
          fi
      - name: Download exact wsl producer artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.linux-build.outputs.wsl-artifact-id }}
          path: ${{ env.CI_STATE }}/artifacts/wsl
      - name: Require exact windows producer artifact
        shell: bash
        env:
          PRODUCER_ARTIFACT_ID: ${{ needs.windows-build.outputs.windows-artifact-id }}
        run: |
          if [[ ! $PRODUCER_ARTIFACT_ID =~ ^[1-9][0-9]*$ ]]; then
            echo 'Producer artifact ID is missing or invalid.' >&2
            exit 1
          fi
      - name: Download exact windows producer artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.windows-build.outputs.windows-artifact-id }}
          path: ${{ env.CI_STATE }}/artifacts/windows
      - name: Apply, restart and verify Windows and WSL
        shell: powershell
        timeout-minutes: 180
        run: task ci:e2e TARGET=windows
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install chezmoi for rendering tests
        uses: ./.github/actions/install-chezmoi
      - name: Run PowerShell test suite
        shell: pwsh
        working-directory: scripts/powershell
        env:
          PS_MODULE_DIRECTORY: ${{ matrix.version == '5.1' && 'WindowsPowerShell' || 'PowerShell' }}
          PS_TEST_EXECUTABLE: ${{ matrix.version == '5.1' && 'powershell.exe' || 'pwsh.exe' }}
        run: |
          $moduleRoot = Join-Path $HOME "Documents\$env:PS_MODULE_DIRECTORY\Modules"
          if ($env:PSModulePath -notlike "*$moduleRoot*") {
            $env:PSModulePath = "$moduleRoot;$env:PSModulePath"
          }
          & $env:PS_TEST_EXECUTABLE -NoProfile -File .\tests\Invoke-Tests.ps1
    env:
      PS_VERSION: ${{ matrix.version }}
  check:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || (needs.changes.outputs.nix == 'true' || needs.changes.outputs.chezmoi == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Verify change detection
        if: ${{ needs.changes.result != 'success' }}
        shell: bash
        run: exit 1
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false
      - name: Run actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml
      - name: Validate Windows package manifests
        shell: bash
        run: |
          jq -e '
            def nonempty_string: type == "string" and length > 0;
            def only_keys($allowed): (keys - $allowed | length) == 0;
            type == "object"
            and only_keys(["$schema", "Sources", "WinGetVersion", "CreationDate"])
            and ."$schema" == "https://aka.ms/winget-packages.schema.2.0.json"
            and (if has("WinGetVersion") then (.WinGetVersion | nonempty_string) else true end)
            and (if has("CreationDate") then (.CreationDate | nonempty_string) else true end)
            and (.Sources | type == "array" and length > 0)
            and all(.Sources[];
              type == "object" and only_keys(["SourceDetails", "Packages"])
              and (.SourceDetails | type == "object"
                and only_keys(["Name", "Identifier", "Argument", "Type"])
                and all(.Name, .Identifier, .Argument, .Type; nonempty_string))
              and (.Packages | type == "array" and length > 0)
              and all(.Packages[];
                type == "object"
                and only_keys(["PackageIdentifier", "Version", "Channel", "Scope", "InitialOverrideArguments", "InitialCustomSwitches"])
                and (.PackageIdentifier | nonempty_string)
                and (if has("Scope") then (.Scope == "user" or .Scope == "machine") else true end)
                and all(to_entries[] | select(.key != "Scope"); .value | nonempty_string)))
            and ([.Sources[].Packages[].PackageIdentifier] as $ids
              | ($ids | length) == ($ids | unique | length))
          ' windows/winget/packages.json
  complete:
    name: Bootstrap / Complete
    if: ${{ always() }}
    needs:
      - changes
      - ci-tools
      - bash-test
      - nix
      - linux-build
      - darwin-build
      - windows-build
      - linux
      - darwin
      - windows-installer
      - check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      TOOLS_REQUIRED: ${{ needs.changes.outputs.nix == 'true' || needs.changes.outputs.chezmoi == 'true' || needs.changes.outputs.other == 'true' }}
      TOOLS_RESULT: ${{ needs.ci-tools.result }}
      BASH_REQUIRED: ${{ needs.changes.outputs.nix == 'true' || needs.changes.outputs.chezmoi == 'true' || needs.changes.outputs.other == 'true' }}
      BASH_RESULT: ${{ needs.bash-test.result }}
      NIX_REQUIRED: ${{ needs.changes.outputs.nix == 'true' }}
      NIX_RESULT: ${{ needs.nix.result }}
      LINUX_BUILD_REQUIRED: ${{ needs.changes.outputs.nix == 'true' || needs.changes.outputs.chezmoi == 'true' }}
      LINUX_BUILD_RESULT: ${{ needs.linux-build.result }}
      DARWIN_BUILD_REQUIRED: ${{ needs.changes.outputs.darwin == 'true' }}
      DARWIN_BUILD_RESULT: ${{ needs.darwin-build.result }}
      WINDOWS_BUILD_REQUIRED: ${{ needs.changes.outputs.windows == 'true' || needs.changes.outputs.wsl == 'true' }}
      WINDOWS_BUILD_RESULT: ${{ needs.windows-build.result }}
      LINUX_REQUIRED: ${{ needs.changes.outputs.linux == 'true' }}
      LINUX_RESULT: ${{ needs.linux.result }}
      DARWIN_REQUIRED: ${{ needs.changes.outputs.darwin == 'true' }}
      DARWIN_RESULT: ${{ needs.darwin.result }}
      WINDOWS_INSTALLER_REQUIRED: ${{ needs.changes.outputs.windows == 'true' || needs.changes.outputs.wsl == 'true' }}
      WINDOWS_INSTALLER_RESULT: ${{ needs.windows-installer.result }}
      CHECKS_REQUIRED: ${{ needs.changes.outputs.nix == 'true' || needs.changes.outputs.chezmoi == 'true' }}
      CHECKS_RESULT: ${{ needs.check.result }}
    steps:
      - name: Verify routed job results
        run: |
          set -euo pipefail
          if [[ "$CHANGES_RESULT" != success ]]; then
            echo "CI change detection did not succeed: $CHANGES_RESULT"
            exit 1
          fi
          check_required_job() {
            local name="$1" required="$2" result="$3"
            if [[ $required == true && $result != success ]]; then
              echo "Required Bootstrap job $name did not succeed: $result"
              return 1
            fi
            if [[ $required != true && $result != skipped ]]; then
              echo "Unselected Bootstrap job $name ran unexpectedly: $result"
              return 1
            fi
          }
          check_required_job "ci-tools" "${TOOLS_REQUIRED}" "${TOOLS_RESULT}"
          check_required_job "bash-test" "${BASH_REQUIRED}" "${BASH_RESULT}"
          check_required_job "nix" "${NIX_REQUIRED}" "${NIX_RESULT}"
          check_required_job "linux-build" "${LINUX_BUILD_REQUIRED}" "${LINUX_BUILD_RESULT}"
          check_required_job "darwin-build" "${DARWIN_BUILD_REQUIRED}" "${DARWIN_BUILD_RESULT}"
          check_required_job "windows-build" "${WINDOWS_BUILD_REQUIRED}" "${WINDOWS_BUILD_RESULT}"
          check_required_job "linux" "${LINUX_REQUIRED}" "${LINUX_RESULT}"
          check_required_job "darwin" "${DARWIN_REQUIRED}" "${DARWIN_RESULT}"
          check_required_job "windows-installer" "${WINDOWS_INSTALLER_REQUIRED}" "${WINDOWS_INSTALLER_RESULT}"
          check_required_job "check" "${CHECKS_REQUIRED}" "${CHECKS_RESULT}"
          echo "All required Bootstrap producers and runtime consumers succeeded."
