name: Bootstrap CI
on:
  workflow_dispatch: null
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
concurrency:
  group: bootstrap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  TESTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TESTED_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed bootstrap targets
        id: detect
        uses: ./.github/actions/detect-ci-changes
        with:
          base-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || github.sha }}
          head-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          run-all: ${{ github.event_name == 'workflow_dispatch' }}
    outputs:
      nix: ${{ steps.detect.outputs.nix }}
      chezmoi: ${{ steps.detect.outputs.chezmoi }}
      other: ${{ steps.detect.outputs.other }}
      linux: ${{ steps.detect.outputs.linux }}
      darwin: ${{ steps.detect.outputs.darwin }}
      wsl: ${{ steps.detect.outputs.wsl }}
      windows: ${{ steps.detect.outputs.windows }}
  # Lint gates every producer and runtime test. Each E2E imports only its
  # matching producer artifacts; Changes is used by routing and Complete.
  lint:
    name: Lint
    needs: changes
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false
      - name: Set up native Nix and Task
        uses: ./.github/actions/setup-ci-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run shared static checks
        run: nix develop --no-update-lock-file path:.#ci --command task lint:ci
  bash-test:
    name: Bash tests
    needs:
      - changes
      - lint
    if: ${{ needs.changes.outputs.nix == 'true' || needs.changes.outputs.chezmoi == 'true' || needs.changes.outputs.other == 'true' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false
      - name: Set up native Nix and Task
        uses: ./.github/actions/setup-ci-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Bash tests
        run: task test:bash
  linux-build:
    name: Linux build
    needs:
      - changes
      - lint
    if: ${{ needs.changes.outputs.nix == 'true' || needs.changes.outputs.chezmoi == 'true' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      CI_LINUX_REQUIRED: ${{ needs.changes.outputs.linux == 'true' }}
    outputs:
      linux-artifact-id: ${{ steps.upload-linux.outputs.artifact-id }}
    steps:
      - name: Prepare CI state
        shell: bash
        run: |
          printf 'CI_STATE=%s/bootstrap-ci\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false
      - name: Set up native Nix and Task
        uses: ./.github/actions/setup-ci-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          clean-disk: "true"
      - name: Restore Nix cache
        uses: ./.github/actions/cache-nix
        continue-on-error: true
        with:
          name: linux-build
      - name: Build Linux checks and deployment
        # Leave time to preserve completed outputs when the build step fails.
        timeout-minutes: 150
        run: nix develop --no-update-lock-file path:.#ci --command task ci:build TARGET=linux
      - name: Upload linux producer artifact
        id: upload-linux
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bootstrap-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CI_STATE }}/artifacts/linux
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
        if: ${{ needs.changes.outputs.linux == 'true' }}
      - name: Save Nix cache
        uses: ./.github/actions/cache-nix
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        continue-on-error: true
        with:
          name: linux-build
          phase: save
          max-size: "4294967296"
  wsl-build:
    name: WSL build
    needs:
      - changes
      - lint
    if: ${{ needs.changes.outputs.windows == 'true' || needs.changes.outputs.wsl == 'true' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    timeout-minutes: 180
    outputs:
      wsl-artifact-id: ${{ steps.upload-wsl.outputs.artifact-id }}
    steps:
      - name: Prepare CI state
        run: |
          printf 'CI_STATE=%s/bootstrap-ci\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout exact tested SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false
      - name: Set up native Nix and Task
        uses: ./.github/actions/setup-ci-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          clean-disk: "true"
      # Reuse common Linux dependencies without adding another cache writer.
      - name: Restore Nix cache
        uses: ./.github/actions/cache-nix
        continue-on-error: true
        with:
          name: linux-build
      - name: Build WSL deployment
        timeout-minutes: 150
        run: nix develop --no-update-lock-file path:.#ci --command task ci:build TARGET=wsl
      - name: Upload wsl producer artifact
        id: upload-wsl
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bootstrap-wsl-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CI_STATE }}/artifacts/wsl
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
  darwin-build:
    name: macOS build
    needs:
      - changes
      - lint
    if: ${{ needs.changes.outputs.darwin == 'true' }}
    runs-on: macos-15
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    outputs:
      darwin-artifact-id: ${{ steps.upload-darwin.outputs.artifact-id }}
    steps:
      - name: Prepare CI state
        shell: bash
        run: |
          printf 'CI_STATE=%s/bootstrap-ci\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout exact tested SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false
      - name: Free runner disk space
        run: |
          set -euo pipefail
          df -h / "$RUNNER_TEMP"
          df -i / "$RUNNER_TEMP"
          default_xcode="$(xcode-select -p)"
          default_xcode="${default_xcode%/Contents/Developer}"
          for app in /Applications/Xcode_*.app; do
            [[ "$app" == "$default_xcode" ]] && continue
            sudo rm -rf "$app"
          done
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes
          rm -rf "$HOME/Library/Developer/CoreSimulator/Devices"
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"
          rm -rf "$HOME/Library/Android/sdk"
          df -h / "$RUNNER_TEMP"
          df -i / "$RUNNER_TEMP"
      - name: Set up native Nix and Task
        uses: ./.github/actions/setup-ci-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore Nix cache
        uses: ./.github/actions/cache-nix
        continue-on-error: true
        with:
          name: darwin
      - name: Build macOS checks and deployment
        timeout-minutes: 200
        run: nix develop --no-update-lock-file path:.#ci --command task ci:build TARGET=darwin
      - name: Upload darwin producer artifact
        id: upload-darwin
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bootstrap-darwin-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CI_STATE }}/artifacts/darwin
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
      - name: Save Nix cache
        uses: ./.github/actions/cache-nix
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        continue-on-error: true
        with:
          name: darwin
          phase: save
          max-size: "4294967296"
  windows-build:
    name: Windows plan
    needs:
      - changes
      - lint
    if: ${{ needs.changes.outputs.windows == 'true' || needs.changes.outputs.wsl == 'true' }}
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      windows-artifact-id: ${{ steps.upload-windows.outputs.artifact-id }}
    steps:
      - name: Prepare CI state
        shell: powershell
        run: |
          "CI_STATE=$env:RUNNER_TEMP/bootstrap-ci" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding UTF8
      - name: Checkout exact tested SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false
      - name: Prepare Windows Store prerequisites
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
          $policy = $null
          try { $policy = Get-ItemProperty -LiteralPath $path -ErrorAction Stop }
          catch [Management.Automation.ItemNotFoundException] { }
          foreach ($name in @('DoNotConnectToWindowsUpdateInternetLocations', 'DisableWindowsUpdateAccess')) {
            if ($policy -and $policy.PSObject.Properties[$name]) {
              Remove-ItemProperty -LiteralPath $path -Name $name -ErrorAction Stop
            }
          }
          $service = Get-Service -Name wuauserv -ErrorAction Stop
          if ($service.StartType -eq 'Disabled') { Set-Service -Name wuauserv -StartupType Manual -ErrorAction Stop }
          if ($service.Status -ne 'Running') {
            $service.Start()
            $service.WaitForStatus([ServiceProcess.ServiceControllerStatus]::Running, [TimeSpan]::FromSeconds(30))
            $service.Refresh()
            if ($service.Status -ne 'Running') { throw 'wuauserv did not reach Running within 30 seconds.' }
          }
      - name: Bootstrap winget
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command winget -CommandType Application -ErrorAction SilentlyContinue)) {
            Install-PSResource -Name Microsoft.WinGet.Client -Scope CurrentUser -Repository PSGallery -TrustRepository
            Repair-WinGetPackageManager
          }
      - name: Prepare Task runner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          . .\scripts\powershell\lib\Invoke-ExternalCommand.ps1
          if (-not (Get-Command task -CommandType Application -ErrorAction SilentlyContinue)) {
            Invoke-NativeCommand -Command winget -Arguments @('install', '--id', 'Task.Task', '--exact', '--source', 'winget', '--accept-source-agreements', '--accept-package-agreements', '--silent') | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "Task bootstrap failed (exit=$LASTEXITCODE)." }
            Update-ProcessEnvironmentPath
          }
          $task = Get-Command task -CommandType Application -ErrorAction Stop
          Split-Path -Parent $task.Source | Add-Content -LiteralPath $env:GITHUB_PATH -Encoding UTF8
      - name: Freeze Windows installation plan
        shell: powershell
        run: task ci:build TARGET=windows
      - name: Upload windows producer artifact
        id: upload-windows
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bootstrap-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CI_STATE }}/artifacts/windows
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
  linux:
    name: Linux E2E
    needs: linux-build
    if: ${{ needs.linux-build.outputs.linux-artifact-id != '' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Prepare CI state
        shell: bash
        run: |
          printf 'CI_STATE=%s/bootstrap-ci\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false
      - name: Set up native Nix and Task
        uses: ./.github/actions/setup-ci-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          clean-disk: "true"
      - name: Require exact linux producer artifact
        shell: bash
        env:
          PRODUCER_ARTIFACT_ID: ${{ needs.linux-build.outputs.linux-artifact-id }}
        run: |
          if [[ ! $PRODUCER_ARTIFACT_ID =~ ^[1-9][0-9]*$ ]]; then
            echo 'Producer artifact ID is missing or invalid.' >&2
            exit 1
          fi
      - name: Download exact linux producer artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.linux-build.outputs.linux-artifact-id }}
          path: ${{ env.CI_STATE }}/artifacts/linux
      - name: Apply, restart and verify native Linux
        run: task ci:e2e TARGET=linux
  darwin:
    name: macOS E2E
    needs: darwin-build
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - name: Prepare CI state
        shell: bash
        run: |
          printf 'CI_STATE=%s/bootstrap-ci\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout exact tested SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false
      - name: Free runner disk space
        run: |
          set -euo pipefail
          df -h / "$RUNNER_TEMP"
          df -i / "$RUNNER_TEMP"
          default_xcode="$(xcode-select -p)"
          default_xcode="${default_xcode%/Contents/Developer}"
          for app in /Applications/Xcode_*.app; do
            [[ "$app" == "$default_xcode" ]] && continue
            sudo rm -rf "$app"
          done
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes
          rm -rf "$HOME/Library/Developer/CoreSimulator/Devices"
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"
          rm -rf "$HOME/Library/Android/sdk"
          df -h / "$RUNNER_TEMP"
          df -i / "$RUNNER_TEMP"
      - name: Set up native Nix and Task
        uses: ./.github/actions/setup-ci-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Require exact darwin producer artifact
        shell: bash
        env:
          PRODUCER_ARTIFACT_ID: ${{ needs.darwin-build.outputs.darwin-artifact-id }}
        run: |
          if [[ ! $PRODUCER_ARTIFACT_ID =~ ^[1-9][0-9]*$ ]]; then
            echo 'Producer artifact ID is missing or invalid.' >&2
            exit 1
          fi
      - name: Download exact darwin producer artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.darwin-build.outputs.darwin-artifact-id }}
          path: ${{ env.CI_STATE }}/artifacts/darwin
      - name: Preserve installer files before nix-darwin takes ownership
        run: |
          sudo -H env -u XDG_CONFIG_HOME -u NIX_USER_CONF_FILES PATH="$PATH" bash <<'SCRIPT'
          set -euo pipefail

          for path in /etc/nix/nix.conf /etc/bashrc /etc/zshrc; do
            if [[ -e "$path" ]]; then
              backup="${path}.before-nix-darwin"
              if [[ -e "$backup" ]]; then
                echo "Refusing to overwrite existing backup: $backup" >&2
                exit 1
              fi
              mv -- "$path" "$backup"
            fi
          done

          # The Nix installer owns /etc/nix/nix.conf before first activation.
          # Confirm root's persistent settings still expose the shared caches
          # after moving that file aside.
          nix --extra-experimental-features nix-command config show substituters \
            | grep -Fq 'https://hermes-agent.cachix.org'
          nix --extra-experimental-features nix-command config show trusted-public-keys \
            | grep -Fq 'hermes-agent.cachix.org-1:'
          SCRIPT
      - name: Apply, restart and verify macOS
        run: task ci:e2e TARGET=darwin
  windows-installer:
    name: Windows+WSL E2E (PS${{ matrix.version }})
    needs:
      - wsl-build
      - windows-build
    runs-on: windows-2025
    timeout-minutes: 210
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        version: ["5.1", "7"]
    permissions:
      contents: read
    steps:
      - name: Prepare CI state
        shell: powershell
        run: |
          "CI_STATE=$env:RUNNER_TEMP/bootstrap-ci" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding UTF8
      - name: Checkout exact tested SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false
      - name: Install PowerShell test modules
        shell: pwsh
        env:
          PS_MODULE_DIRECTORY: ${{ matrix.version == '5.1' && 'WindowsPowerShell' || 'PowerShell' }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $moduleRoot = Join-Path $HOME "Documents\$env:PS_MODULE_DIRECTORY\Modules"
          New-Item -ItemType Directory -Force -Path $moduleRoot | Out-Null
          $env:PSModulePath = "$moduleRoot;$env:PSModulePath"
          # Construct download URLs from the repository, avoiding bad metadata URIs.
          Save-PSResource -Name Pester -Repository PSGallery -Path $moduleRoot -TrustRepository -AcceptLicense
          . .\scripts\powershell\tests\support\Resolve-TestModule.ps1
          Resolve-TestModule -Name Pester | Out-Null
      - name: Prepare Windows Store prerequisites
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
          $policy = $null
          try { $policy = Get-ItemProperty -LiteralPath $path -ErrorAction Stop }
          catch [Management.Automation.ItemNotFoundException] { }
          foreach ($name in @('DoNotConnectToWindowsUpdateInternetLocations', 'DisableWindowsUpdateAccess')) {
            if ($policy -and $policy.PSObject.Properties[$name]) {
              Remove-ItemProperty -LiteralPath $path -Name $name -ErrorAction Stop
            }
          }
          $service = Get-Service -Name wuauserv -ErrorAction Stop
          if ($service.StartType -eq 'Disabled') { Set-Service -Name wuauserv -StartupType Manual -ErrorAction Stop }
          if ($service.Status -ne 'Running') {
            $service.Start()
            $service.WaitForStatus([ServiceProcess.ServiceControllerStatus]::Running, [TimeSpan]::FromSeconds(30))
            $service.Refresh()
            if ($service.Status -ne 'Running') { throw 'wuauserv did not reach Running within 30 seconds.' }
          }
      - name: Bootstrap winget
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command winget -CommandType Application -ErrorAction SilentlyContinue)) {
            Install-PSResource -Name Microsoft.WinGet.Client -Scope CurrentUser -Repository PSGallery -TrustRepository
            Repair-WinGetPackageManager
          }
      - name: Prepare Task runner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          . .\scripts\powershell\lib\Invoke-ExternalCommand.ps1
          if (-not (Get-Command task -CommandType Application -ErrorAction SilentlyContinue)) {
            Invoke-NativeCommand -Command winget -Arguments @('install', '--id', 'Task.Task', '--exact', '--source', 'winget', '--accept-source-agreements', '--accept-package-agreements', '--silent') | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "Task bootstrap failed (exit=$LASTEXITCODE)." }
            Update-ProcessEnvironmentPath
          }
          $task = Get-Command task -CommandType Application -ErrorAction Stop
          Split-Path -Parent $task.Source | Add-Content -LiteralPath $env:GITHUB_PATH -Encoding UTF8
      - name: Require exact wsl producer artifact
        shell: bash
        env:
          PRODUCER_ARTIFACT_ID: ${{ needs.wsl-build.outputs.wsl-artifact-id }}
        run: |
          if [[ ! $PRODUCER_ARTIFACT_ID =~ ^[1-9][0-9]*$ ]]; then
            echo 'Producer artifact ID is missing or invalid.' >&2
            exit 1
          fi
      - name: Download exact wsl producer artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.wsl-build.outputs.wsl-artifact-id }}
          path: ${{ env.CI_STATE }}/artifacts/wsl
      - name: Require exact windows producer artifact
        shell: bash
        env:
          PRODUCER_ARTIFACT_ID: ${{ needs.windows-build.outputs.windows-artifact-id }}
        run: |
          if [[ ! $PRODUCER_ARTIFACT_ID =~ ^[1-9][0-9]*$ ]]; then
            echo 'Producer artifact ID is missing or invalid.' >&2
            exit 1
          fi
      - name: Download exact windows producer artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.windows-build.outputs.windows-artifact-id }}
          path: ${{ env.CI_STATE }}/artifacts/windows
      - name: Apply, restart and verify Windows and WSL
        shell: powershell
        timeout-minutes: 180
        run: task ci:e2e TARGET=windows
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install chezmoi for rendering tests
        uses: ./.github/actions/install-chezmoi
      - name: Run PowerShell test suite
        shell: pwsh
        working-directory: scripts/powershell
        env:
          PS_MODULE_DIRECTORY: ${{ matrix.version == '5.1' && 'WindowsPowerShell' || 'PowerShell' }}
          PS_TEST_EXECUTABLE: ${{ matrix.version == '5.1' && 'powershell.exe' || 'pwsh.exe' }}
        run: |
          $moduleRoot = Join-Path $HOME "Documents\$env:PS_MODULE_DIRECTORY\Modules"
          if ($env:PSModulePath -notlike "*$moduleRoot*") {
            $env:PSModulePath = "$moduleRoot;$env:PSModulePath"
          }
          & $env:PS_TEST_EXECUTABLE -NoProfile -File .\tests\Invoke-Tests.ps1
    env:
      PS_VERSION: ${{ matrix.version }}
  complete:
    name: Complete
    if: ${{ always() }}
    needs:
      - changes
      - bash-test
      - lint
      - linux-build
      - wsl-build
      - darwin-build
      - windows-build
      - linux
      - darwin
      - windows-installer
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      BASH_REQUIRED: ${{ needs.changes.outputs.nix == 'true' || needs.changes.outputs.chezmoi == 'true' || needs.changes.outputs.other == 'true' }}
      BASH_RESULT: ${{ needs.bash-test.result }}
      LINT_RESULT: ${{ needs.lint.result }}
      LINUX_BUILD_REQUIRED: ${{ needs.changes.outputs.nix == 'true' || needs.changes.outputs.chezmoi == 'true' }}
      LINUX_BUILD_RESULT: ${{ needs.linux-build.result }}
      WSL_BUILD_REQUIRED: ${{ needs.changes.outputs.windows == 'true' || needs.changes.outputs.wsl == 'true' }}
      WSL_BUILD_RESULT: ${{ needs.wsl-build.result }}
      DARWIN_BUILD_REQUIRED: ${{ needs.changes.outputs.darwin == 'true' }}
      DARWIN_BUILD_RESULT: ${{ needs.darwin-build.result }}
      WINDOWS_BUILD_REQUIRED: ${{ needs.changes.outputs.windows == 'true' || needs.changes.outputs.wsl == 'true' }}
      WINDOWS_BUILD_RESULT: ${{ needs.windows-build.result }}
      LINUX_REQUIRED: ${{ needs.changes.outputs.linux == 'true' }}
      LINUX_RESULT: ${{ needs.linux.result }}
      DARWIN_REQUIRED: ${{ needs.changes.outputs.darwin == 'true' }}
      DARWIN_RESULT: ${{ needs.darwin.result }}
      WINDOWS_INSTALLER_REQUIRED: ${{ needs.changes.outputs.windows == 'true' || needs.changes.outputs.wsl == 'true' }}
      WINDOWS_INSTALLER_RESULT: ${{ needs.windows-installer.result }}
    steps:
      - name: Verify routed job results
        run: |
          set -euo pipefail
          if [[ "$CHANGES_RESULT" != success ]]; then
            echo "CI change detection did not succeed: $CHANGES_RESULT"
            exit 1
          fi
          check_required_job() {
            local name="$1" required="$2" result="$3"
            if [[ $required == true && $result != success ]]; then
              echo "Required CI job $name did not succeed: $result"
              return 1
            fi
            if [[ $required != true && $result != skipped ]]; then
              echo "Unselected CI job $name ran unexpectedly: $result"
              return 1
            fi
          }
          check_required_job "bash-test" "${BASH_REQUIRED}" "${BASH_RESULT}"
          check_required_job "lint" true "${LINT_RESULT}"
          check_required_job "linux-build" "${LINUX_BUILD_REQUIRED}" "${LINUX_BUILD_RESULT}"
          check_required_job "wsl-build" "${WSL_BUILD_REQUIRED}" "${WSL_BUILD_RESULT}"
          check_required_job "darwin-build" "${DARWIN_BUILD_REQUIRED}" "${DARWIN_BUILD_RESULT}"
          check_required_job "windows-build" "${WINDOWS_BUILD_REQUIRED}" "${WINDOWS_BUILD_RESULT}"
          check_required_job "linux" "${LINUX_REQUIRED}" "${LINUX_RESULT}"
          check_required_job "darwin" "${DARWIN_REQUIRED}" "${DARWIN_RESULT}"
          check_required_job "windows-installer" "${WINDOWS_INSTALLER_REQUIRED}" "${WINDOWS_INSTALLER_RESULT}"
          echo "All required CI checks, producers and runtime consumers succeeded."
