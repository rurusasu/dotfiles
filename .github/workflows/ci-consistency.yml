name: Package Consistency

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: ci-consistency / Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      package_catalog: ${{ steps.detect.outputs.package_catalog }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed job targets
        id: detect
        uses: ./.github/actions/detect-ci-changes
        with:
          base-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || github.sha }}
          head-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          run-all: ${{ github.event_name == 'workflow_dispatch' }}
          manifest: ci/job-path-routing.json

  check:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.package_catalog == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Verify change detection
        if: ${{ needs.changes.result != 'success' }}
        shell: bash
        run: exit 1
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24

      - name: Run Nix-native package tests
        run: nix build .#checks.x86_64-linux.nix-unit --no-link

      - name: Build repository custom package derivations
        run: nix build .#checks.x86_64-linux.custom-package-builds --no-link

      - name: Install and verify Codex npm package
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/codex-npm"
          nix shell nixpkgs#nodejs --command bash -euo pipefail -c \
            "npm install --global --prefix '$prefix' --no-audit --no-fund @openai/codex@latest && '$prefix/bin/codex' --version && npm list --global --prefix '$prefix' --depth=0 @openai/codex"

      - name: Verify package provider coverage
        run: |
          nix build .#package-support-report --print-build-logs -o /tmp/package-support-report
          jq -e 'length == 0' /tmp/package-support-report/errors.json

      - name: Build winget-export from SSOT
        run: nix build .#winget-export -o /tmp/winget-export

      - name: Verify winget packages.json is in sync
        shell: bash
        run: |
          normalize='
            .Sources |= sort_by(.SourceDetails.Name)
            | .Sources |= map(.Packages |= sort_by(.PackageIdentifier))
          '
          diff \
            <(jq -S "$normalize" /tmp/winget-export/winget/packages.json) \
            <(jq -S "$normalize" windows/winget/packages.json)

      - name: Verify npm packages.json is in sync
        shell: bash
        run: diff <(jq -S . /tmp/winget-export/npm/packages.json) <(jq -S . windows/npm/packages.json)

      - name: Verify pnpm packages.json is in sync
        shell: bash
        run: diff <(jq -S . /tmp/winget-export/pnpm/packages.json) <(jq -S . windows/pnpm/packages.json)
