name: Debug winget export

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  winget-export-diff:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - name: Show generated winget diff
        run: |
          set -euo pipefail
          nix build .#winget-export
          diff -u windows/winget/packages.json result/winget/packages.json || true
