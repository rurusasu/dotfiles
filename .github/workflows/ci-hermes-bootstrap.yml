name: Hermes Bootstrap Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TESTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  changes:
    name: ci-hermes-bootstrap / Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      hermes: ${{ steps.detect.outputs.hermes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TESTED_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed job targets
        id: detect
        uses: ./.github/actions/detect-ci-changes
        with:
          base-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || github.sha }}
          head-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          run-all: ${{ github.event_name == 'workflow_dispatch' }}
          manifest: ci/job-path-routing.json

  hermes-bootstrap-tests:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.hermes == 'true') }}
    name: Hermes Bootstrap Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Verify change detection
        if: ${{ needs.changes.result != 'success' }}
        shell: bash
        run: exit 1
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify provenance gate wiring
        run: python3 tests/python/hermes_bootstrap_test/profile_sync_provenance_gate_contract.py

      - name: Run native Hermes bootstrap tests
        run: nix build .#checks.x86_64-linux.hermes-bootstrap-tests --no-link --print-build-logs

      - name: Run native secret transport contract
        run: nix shell nixpkgs#bats --command bats tests/bash/hermes_native_bootstrap.bats

      - name: Run X API image contract
        run: python3 -m unittest tests/python/test_xapi_image_contract.py -v

      - name: Run Hermes browser runtime contracts
        run: docker/hermes-browser/tests/test_runtime_contract.sh
