name: Hermes Bootstrap Tests

on:
  push:
    branches: [main]
    paths:
      - "docker/hermes-agent/**"
      - "docker/hermes-browser/**"
      - "docker/hermes-browser-mcp/**"
      - "docker/hermes-xapi-mcp/**"
      - "scripts/sh/hermes-agent.sh"
      - "scripts/powershell/handlers/Handler.HermesAgent.ps1"
      - "tests/python/test_xapi_image_contract.py"
      - "taskfiles/hermes/taskfile.yml"
      - ".github/workflows/ci-hermes-bootstrap.yml"
      - ".github/workflows/ci-hermes-provenance.yml"
      - ".pre-commit-config.yaml"
      - "Taskfile.yml"
  pull_request:
    branches: [main]
    paths:
      - "docker/hermes-agent/**"
      - "docker/hermes-browser/**"
      - "docker/hermes-browser-mcp/**"
      - "docker/hermes-xapi-mcp/**"
      - "scripts/sh/hermes-agent.sh"
      - "scripts/powershell/handlers/Handler.HermesAgent.ps1"
      - "tests/python/test_xapi_image_contract.py"
      - "taskfiles/hermes/taskfile.yml"
      - ".github/workflows/ci-hermes-bootstrap.yml"
      - ".github/workflows/ci-hermes-provenance.yml"
      - ".pre-commit-config.yaml"
      - "Taskfile.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hermes-bootstrap-tests:
    name: Hermes Bootstrap Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify provenance gate wiring
        run: python3 docker/hermes-agent/bootstrap/tests/profile_sync_provenance_gate_contract.py

      - name: Run X API image contract
        run: python3 -m unittest tests/python/test_xapi_image_contract.py -v

      - name: Run the pinned container suite
        run: docker build --target hermes-bootstrap-test -t local/hermes-bootstrap-test -f docker/hermes-agent/Dockerfile docker

      - name: Run Hermes browser runtime contracts
        run: docker/hermes-browser/tests/test_runtime_contract.sh

      - name: Run the gh wrapper security suite
        run: docker/hermes-agent/bootstrap/tests/test_gh_wrapper.sh
