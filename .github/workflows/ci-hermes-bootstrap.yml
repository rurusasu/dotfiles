name: Hermes Bootstrap Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: ci-hermes-bootstrap / Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      hermes: ${{ steps.detect.outputs.hermes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed job targets
        id: detect
        uses: ./.github/actions/detect-ci-changes
        with:
          base-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || github.sha }}
          head-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          run-all: ${{ github.event_name == 'workflow_dispatch' }}
          manifest: ci/job-path-routing.json

  hermes-bootstrap-tests:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.hermes == 'true') }}
    name: Hermes Bootstrap Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Verify change detection
        if: ${{ needs.changes.result != 'success' }}
        shell: bash
        run: exit 1
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify provenance gate wiring
        run: python3 docker/hermes-agent/bootstrap/tests/profile_sync_provenance_gate_contract.py

      - name: Run X API image contract
        run: python3 -m unittest tests/python/test_xapi_image_contract.py -v

      - name: Run the pinned container suite
        run: docker build --target hermes-bootstrap-test -t local/hermes-bootstrap-test -f docker/hermes-agent/Dockerfile docker

      - name: Build the Hermes storage integration image
        run: docker build --target hermes-bootstrap-runtime -t local/hermes-agent-gh:latest -f docker/hermes-agent/Dockerfile docker

      - name: Run the Hermes storage volume integration
        run: docker/hermes-agent/tests/test_storage_volume_integration.sh

      - name: Run Hermes browser runtime contracts
        run: docker/hermes-browser/tests/test_runtime_contract.sh

      - name: Run the gh wrapper security suite
        run: docker/hermes-agent/bootstrap/tests/test_gh_wrapper.sh
