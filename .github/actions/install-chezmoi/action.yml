name: Install chezmoi
description: Install the latest chezmoi release without depending on the WinGet source
runs:
  using: composite
  steps:
    - name: Install latest chezmoi release (Windows)
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      run: |
        Set-StrictMode -Version Latest
        $ErrorActionPreference = 'Stop'
        $binDir = Join-Path $env:RUNNER_TEMP 'chezmoi-bin'
        $installer = [Text.Encoding]::UTF8.GetString(
          (Invoke-WebRequest -UseBasicParsing https://get.chezmoi.io/ps1).Content
        )
        & ([scriptblock]::Create($installer)) -BinDir $binDir -Tag latest
        $chezmoi = Join-Path $binDir 'chezmoi.exe'
        if (-not (Test-Path -LiteralPath $chezmoi -PathType Leaf)) {
          throw "chezmoi was not installed by the official installer: $chezmoi"
        }
        Add-Content -LiteralPath $env:GITHUB_PATH -Value $binDir -Encoding utf8
        & $chezmoi --version
    - name: Install latest chezmoi release (Unix)
      if: ${{ runner.os != 'Windows' }}
      shell: bash
      run: |
        set -euo pipefail
        bin_dir="${RUNNER_TEMP}/chezmoi-bin"
        sh -c "$(curl -fsLS https://get.chezmoi.io)" -- -b "${bin_dir}"
        "${bin_dir}/chezmoi" --version
        printf '%s\n' "${bin_dir}" >> "${GITHUB_PATH}"
