name: Detect CI changes
description: Select shared checks and platform builds from Git changes.

inputs:
  base-sha:
    description: Base commit for the changed-path diff.
    required: true
  head-sha:
    description: Head commit for the changed-path diff.
    required: true
  run-all:
    description: Enable every category for a manual run.
    required: false
    default: "false"

outputs:
  nix:
    description: Whether Nix configuration and build checks are required.
    value: ${{ steps.detect.outputs.nix }}
  chezmoi:
    description: Whether Windows configuration and chezmoi checks are required.
    value: ${{ steps.detect.outputs.chezmoi }}
  other:
    description: Whether shared tooling and other checks are required.
    value: ${{ steps.detect.outputs.other }}
  linux:
    description: Whether native Linux builds are required.
    value: ${{ steps.detect.outputs.linux }}
  darwin:
    description: Whether macOS activation is required.
    value: ${{ steps.detect.outputs.darwin }}
  wsl:
    description: Whether NixOS-WSL prebuild and activation are required.
    value: ${{ steps.detect.outputs.wsl }}
  windows:
    description: Whether Windows installer tests are required.
    value: ${{ steps.detect.outputs.windows }}

runs:
  using: composite
  steps:
    - name: Classify changed paths
      id: detect
      shell: bash
      env:
        BASE_SHA: ${{ inputs.base-sha }}
        HEAD_SHA: ${{ inputs.head-sha }}
        RUN_ALL: ${{ inputs.run-all }}
      run: |
        set -euo pipefail
        nix=false
        chezmoi=false
        other=false
        linux=false
        darwin=false
        wsl=false
        windows=false

        case "${RUN_ALL}" in
          true)
            nix=true
            chezmoi=true
            other=true
            linux=true
            darwin=true
            wsl=true
            windows=true
            ;;
          false)
            head="$(git rev-parse --verify --end-of-options "${HEAD_SHA}^{commit}")"
            if [[ "${BASE_SHA}" =~ ^0+$ && "${GITHUB_EVENT_NAME:-}" == "push" ]]; then
              base="$(git hash-object -t tree /dev/null)"
            else
              base="$(git rev-parse --verify --end-of-options "${BASE_SHA}^{commit}")"
              if [[ "${GITHUB_EVENT_NAME:-}" == "pull_request" ]]; then
                base="$(git merge-base "${base}" "${head}")"
              fi
            fi

            # NUL delimiters preserve unusual filenames; --no-renames includes
            # both the old and new path, as well as deletions and type changes.
            paths_file="${RUNNER_TEMP}/ci-changed-paths"
            git diff --name-only --no-renames -z "${base}" "${head}" > "${paths_file}"
            while IFS= read -r -d '' path; do
              case "${path}" in
                # These Markdown files are distributed settings, not repo docs.
                chezmoi/dot_*/*)
                  chezmoi=true
                  windows=true
                  ;;
                # These documents are also generated runtime help files.
                docs/chezmoi/omarchy-macos.md)
                  nix=true
                  darwin=true
                  ;;
                docs/chezmoi/omarchy.md)
                  nix=true
                  linux=true
                  ;;
                docs/*|README*|AGENTS.md|CLAUDE.md|*/README*|*/AGENTS.md|LICENSE*)
                  ;;
                # Windows manifests are edited directly and validated by both
                # platform workflows.
                windows/*)
                  nix=true
                  chezmoi=true
                  windows=true
                  ;;
                flake.nix|flake.lock)
                  nix=true
                  chezmoi=true
                  linux=true
                  darwin=true
                  wsl=true
                  windows=true
                  ;;
                # Windows consumes the committed shortcuts through chezmoi.
                nix/defaults.nix|nix/home/keybindings/bindings.nix|nix/home/keybindings/generated.json|nix/modules/terminals/ghostty/ghostty.nix|nix/modules/terminals/ghostty/ghostty-renderer.nix|nix/modules/terminals/ghostty/ghostty-windows.nix|nix/modules/editors/nvim/neovim.nix)
                  nix=true
                  chezmoi=true
                  linux=true
                  darwin=true
                  wsl=true
                  windows=true
                  ;;
                nix/modules/aerospace/*)
                  nix=true
                  darwin=true
                  ;;
                # Windows chezmoi also distributes the WSLg fontconfig source.
                nix/modules/fonts/wsl-fontconfig.conf)
                  nix=true
                  chezmoi=true
                  wsl=true
                  windows=true
                  ;;
                nix/modules/hyprland/*)
                  nix=true
                  linux=true
                  ;;
                nix/modules/1password/op-ssh-sign-wsl|nix/modules/fcitx5.nix|nix/modules/gnome-keyring/*|nix/modules/editors/vscode.nix|nix/modules/nvidia.nix)
                  nix=true
                  wsl=true
                  ;;
                nix/*|*.nix)
                  nix=true
                  linux=true
                  darwin=true
                  wsl=true
                  ;;
                chezmoi/*)
                  chezmoi=true
                  windows=true
                  ;;
                # These entrypoints and fixtures span Nix, Windows and templates.
                .github/*|scripts/*|taskfiles/*|Taskfile.yml|install.*|bootstrap.*|docker/*|.devcontainer/*|tests/*|.pre-commit-config.yaml|.gitattributes|.editorconfig)
                  nix=true
                  chezmoi=true
                  other=true
                  linux=true
                  darwin=true
                  wsl=true
                  windows=true
                  ;;
                *)
                  other=true
                  ;;
              esac
            done < "${paths_file}"
            ;;
          *)
            echo "run-all must be true or false" >&2
            exit 1
            ;;
        esac

        printf 'nix=%s\nchezmoi=%s\nother=%s\n' "${nix}" "${chezmoi}" "${other}" >> "${GITHUB_OUTPUT}"
        printf 'linux=%s\ndarwin=%s\nwsl=%s\nwindows=%s\n' "${linux}" "${darwin}" "${wsl}" "${windows}" >> "${GITHUB_OUTPUT}"
