name: Detect CI changes
description: Route changed repository paths to the CI outputs selected by the local detector.

inputs:
  base-sha:
    description: Base commit for the changed-path diff.
    required: true
  head-sha:
    description: Head commit for the changed-path diff.
    required: true
  run-all:
    description: Enable every CI output instead of calculating changed paths.
    required: false
    default: "false"
  manifest:
    description: Routing manifest path relative to the repository root.
    required: false
    default: ci/path-routing.json

outputs:
  python:
    description: Whether Python contracts are required.
    value: ${{ steps.detect.outputs.python }}
  bash:
    description: Whether Bash contracts are required.
    value: ${{ steps.detect.outputs.bash }}
  actionlint:
    description: Whether workflow lint is required.
    value: ${{ steps.detect.outputs.actionlint }}
  powershell_lint:
    description: Whether PowerShell source lint is required.
    value: ${{ steps.detect.outputs.powershell_lint }}
  powershell_test:
    description: Whether PowerShell contracts are required.
    value: ${{ steps.detect.outputs.powershell_test }}
  chezmoi_lint:
    description: Whether chezmoi contracts are required.
    value: ${{ steps.detect.outputs.chezmoi_lint }}
  templates:
    description: Whether template validation is required.
    value: ${{ steps.detect.outputs.templates }}
  fonts:
    description: Whether font installer validation is required.
    value: ${{ steps.detect.outputs.fonts }}
  linux:
    description: Whether Linux CI is required.
    value: ${{ steps.detect.outputs.linux }}
  darwin:
    description: Whether macOS CI is required.
    value: ${{ steps.detect.outputs.darwin }}
  wsl:
    description: Whether WSL CI is required.
    value: ${{ steps.detect.outputs.wsl }}
  windows:
    description: Whether Windows CI is required.
    value: ${{ steps.detect.outputs.windows }}
  contract:
    description: Whether CI contract checks are required.
    value: ${{ steps.detect.outputs.contract }}
  nix:
    description: Whether Nix CI is required.
    value: ${{ steps.detect.outputs.nix }}
  chezmoi:
    description: Whether chezmoi CI is required.
    value: ${{ steps.detect.outputs.chezmoi }}
  hermes:
    description: Whether Hermes CI is required.
    value: ${{ steps.detect.outputs.hermes }}
  devcontainer:
    description: Whether devcontainer CI is required.
    value: ${{ steps.detect.outputs.devcontainer }}
  package_catalog:
    description: Whether package catalog CI is required.
    value: ${{ steps.detect.outputs.package_catalog }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: "3.14"
    - name: Detect changed CI targets
      id: detect
      shell: bash
      env:
        BASE_SHA: ${{ inputs.base-sha }}
        HEAD_SHA: ${{ inputs.head-sha }}
        RUN_ALL: ${{ inputs.run-all }}
        MANIFEST_PATH: ${{ inputs.manifest }}
      run: |
        set -euo pipefail
        if [[ -z "${MANIFEST_PATH:-}" ]]; then
          MANIFEST_PATH="ci/path-routing.json"
        fi

        if [[ "${RUN_ALL}" == "true" ]]; then
          python scripts/python/detect_ci_changes.py \
            --manifest "${MANIFEST_PATH}" \
            --all \
            --github-output "${GITHUB_OUTPUT}"
        else
          paths_file="${RUNNER_TEMP}/ci-changed-paths.txt"
          if [[ "${GITHUB_EVENT_NAME:-}" == "pull_request" ]]; then
            BASE_SHA="$(git merge-base "${BASE_SHA}" "${HEAD_SHA}")"
          fi
          git diff --name-only --no-renames "${BASE_SHA}" "${HEAD_SHA}" > "${paths_file}"
          python scripts/python/detect_ci_changes.py \
            --manifest "${MANIFEST_PATH}" \
            --paths-file "${paths_file}" \
            --github-output "${GITHUB_OUTPUT}"
        fi
