name: hindsight-acceptance

services:
  hindsight:
    image: nginx:1.29-alpine
    container_name: hindsight
    command:
      - /bin/sh
      - -c
      - |
        if [ -x /bin/httpd ]; then
          exec /bin/httpd -f -p 80 -h /www
        fi
        exec nginx -g 'daemon off;'
    ports:
      - "127.0.0.1:8888:80"
    volumes:
      - ./hindsight-health.json:/usr/share/nginx/html/health:ro
      - ./hindsight-health.json:/www/health:ro
    networks:
      - memory

networks:
  memory:
    name: dotfiles-memory
    driver: bridge
