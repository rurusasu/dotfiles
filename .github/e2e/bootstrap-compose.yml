services:
  hermes:
    image: nginx:1.29-alpine
    depends_on:
      acceptance:
        condition: service_started
    command:
      - /bin/sh
      - -c
      - |
        printf '#!/bin/sh\nexit 0\n' >/usr/local/bin/hermes-gateway-converge
        chmod 0755 /usr/local/bin/hermes-gateway-converge
        mkdir -p /www
        if [ -x /bin/httpd ]; then
          exec /bin/httpd -f -p 80 -h /www
        fi
        exec nginx -g 'daemon off;'

  xapi-mcp:
    image: nginx:1.29-alpine

  chromium:
    image: nginx:1.29-alpine

  browser-mcp:
    image: nginx:1.29-alpine

  hindsight:
    image: nginx:1.29-alpine
    command:
      - /bin/sh
      - -c
      - |
        if [ -x /bin/httpd ]; then
          exec /bin/httpd -f -p 80 -h /www
        fi
        exec nginx -g 'daemon off;'
    ports:
      - "127.0.0.1:8888:80"
    volumes:
      - ./hindsight-health.json:/usr/share/nginx/html/health:ro
      - ./hindsight-health.json:/www/health:ro

  acceptance:
    image: nginx:1.29-alpine
    command:
      - /bin/sh
      - -c
      - |
        if [ -x /bin/httpd ]; then
          exec /bin/httpd -f -p 80 -h /www
        fi
        exec nginx -g 'daemon off;'
    ports:
      - "127.0.0.1:8642:80"
      - "127.0.0.1:9119:80"
      - "127.0.0.1:6080:80"
    volumes:
      - ./hermes-bootstrap-fixture.sh:/usr/share/nginx/html/health:ro
      - ./hermes-bootstrap-fixture.sh:/www/health:ro

  hermes-bootstrap:
    image: nginx:1.29-alpine
    profiles:
      - bootstrap
    entrypoint:
      - /bin/sh
      - /fixture/hermes-bootstrap.sh
    volumes:
      - ./hermes-bootstrap-fixture.sh:/fixture/hermes-bootstrap.sh:ro
