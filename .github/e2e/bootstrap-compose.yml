services:
  xapi-mcp:
    image: nginx:1.29-alpine
    working_dir: /
    volumes:
      - ./xurl-fixture.sh:/node_modules/.bin/xurl:ro

  chromium:
    image: nginx:1.29-alpine

  browser-mcp:
    image: nginx:1.29-alpine

  acceptance:
    image: nginx:1.29-alpine
    command:
      - /bin/sh
      - -c
      - |
        mkdir -p /www/api /usr/share/nginx/html/api
        cp /fixture/health /www/health
        cp /fixture/health /www/api/health
        cp /fixture/health /usr/share/nginx/html/health
        cp /fixture/health /usr/share/nginx/html/api/health
        if [ -x /bin/httpd ]; then
          exec /bin/httpd -f -p 80 -h /www
        fi
        exec nginx -g 'daemon off;'
    ports:
      - "127.0.0.1:8642:80"
      - "127.0.0.1:9119:80"
      - "127.0.0.1:6080:80"
    volumes:
      - ./acceptance-health.json:/fixture/health:ro

networks:
  local-ai-services:
    name: local-ai-services
    external: true
