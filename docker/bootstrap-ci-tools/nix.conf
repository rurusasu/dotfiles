experimental-features = nix-command flakes
# Prefer the official public cache; retain the mirror as a fallback.
substituters = https://cache.nixos.org?priority=10 https://cache.numtide.com?priority=50 https://hermes-agent.cachix.org
extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= hermes-agent.cachix.org-1:jN3pjR50Mxi4SESKC/FIMNM6/LCosvPk2VUwzVvebzU=
# HTTP/2 cache streams have stalled for hours on hosted runners. Use HTTP/1.1
# and bound idle waits/retries so an unavailable cache cannot consume the job.
http2 = false
stalled-download-timeout = 60
download-attempts = 3
# Binary caches are optional; failed substitutes must not prevent building the
# same pinned derivation from source with its normal hash checks.
fallback = true
build-users-group =
sandbox = true
trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
