endpoints:
  - name: ollama-chat-default
    provider: ollama
    model_name: qwen3.6:35b
    api_base: http://host.docker.internal:11434/v1
    capability: chat
    usage_tracking: true
  - name: ollama-embedding-default
    provider: ollama
    model_name: qwen3-embedding:0.6b
    api_base: http://host.docker.internal:11434/v1
    capability: embeddings
    usage_tracking: true
