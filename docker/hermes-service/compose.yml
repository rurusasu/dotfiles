name: hermes-service

services:
  hermes-bootstrap:
    build:
      context: ..
      dockerfile: hermes-agent/Dockerfile
    image: local/hermes-agent-gh:latest
    profiles:
      - bootstrap
    entrypoint: /usr/local/bin/hermes-bootstrap
    command: apply
    user: "10000:10000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - path: ${HERMES_DATA_DIR:-${USERPROFILE:-${HOME}}/.hermes}/.op.env
        required: false
    volumes:
      - type: volume
        source: hermes-data
        target: /opt/data
    environment:
      HERMES_HOME: /opt/data
      HOME: /opt/data

  chromium:
    build:
      context: ../hermes-browser
      dockerfile: Dockerfile
    image: local/hermes-browser:latest
    container_name: hermes-chromium
    restart: unless-stopped
    shm_size: 2g
    security_opt:
      - seccomp=unconfined
    ports:
      - "127.0.0.1:${HERMES_BROWSER_VIEW_PORT:-6080}:6080"
    volumes:
      - type: bind
        source: ${HERMES_BROWSER_DATA_DIR:-${USERPROFILE:-${HOME}}/.hermes/.browser}
        target: /data
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - hermes-browser

  browser-mcp:
    build:
      context: ../hermes-browser-mcp
      dockerfile: Dockerfile
    image: local/hermes-browser-mcp:latest
    container_name: hermes-browser-mcp
    restart: unless-stopped
    command:
      - node_modules/.bin/mcp-proxy
      - --server
      - stream
      - --requestTimeout
      - "120000"
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --
      - node_modules/.bin/chrome-devtools-mcp
      - --browser-url=http://chromium:9222
      - --experimentalPageIdRouting
      - --no-usage-statistics
    depends_on:
      chromium:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >
          node -e "const net=require('node:net');const s=net.connect({host:'127.0.0.1',port:8080},()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),3000);"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - hermes-browser

  xapi-mcp:
    build:
      context: ../hermes-xapi-mcp
      dockerfile: Dockerfile
    image: local/hermes-xapi-mcp:latest
    container_name: hermes-xapi-mcp
    restart: unless-stopped
    command:
      - node_modules/.bin/mcp-proxy
      - --server
      - stream
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --
      - /usr/local/bin/hermes-xapi-mcp
    environment:
      X_API_CLIENT_ID: "${X_API_CLIENT_ID:-}"
      X_API_CLIENT_SECRET: "${X_API_CLIENT_SECRET:-}"
    volumes:
      - type: bind
        source: ${HERMES_DATA_DIR:-${USERPROFILE:-${HOME}}/.hermes}/.xurl
        target: /root/.xurl
    healthcheck:
      test:
        - CMD-SHELL
        - >
          node -e "const net=require('node:net');const s=net.connect({host:'127.0.0.1',port:8080},()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),3000);"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - hermes-browser

networks:
  hermes-browser:
    name: hermes-browser
    driver: bridge

volumes:
  hermes-data:
    name: ${HERMES_DATA_VOLUME:-hermes-data}
