version: "3"

tasks:
  install:windows:
    desc: Install Windows apps, configure NixOS-WSL, and apply dotfiles
    platforms: [windows]
    vars:
      INSTALL_POWERSHELL: '{{.DOTFILES_INSTALL_POWERSHELL | default "pwsh"}}'
    cmds:
      - '"{{.INSTALL_POWERSHELL}}" -NoProfile -ExecutionPolicy Bypass -File scripts/powershell/Invoke-WindowsInstallPhase.ps1 -Phase Gui'
      - '"{{.INSTALL_POWERSHELL}}" -NoProfile -ExecutionPolicy Bypass -File scripts/powershell/Invoke-WindowsInstallPhase.ps1 -Phase Wsl'

  install:windows:post:
    desc: Rebuild NixOS and apply Windows dotfiles after initial setup
    platforms: [windows]
    cmds:
      - task: nrs
      - task: chezmoi

  tart:prepare:
    desc: Download and clone the optional macOS Tart VM image
    cmds:
      - cmd: ./scripts/sh/install-tart-vm.sh
        platforms: [darwin]

  tart:run:
    desc: Start Tart and sync the latest dotfiles
    cmds:
      - cmd: ./scripts/sh/run-tart-vm.sh
        platforms: [darwin]

  install:
    desc: Run Windows installer
    cmds:
      - pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/powershell/install.ps1

  chezmoi:
    desc: Apply Windows dotfiles
    platforms: [windows]
    vars:
      INSTALL_POWERSHELL: '{{.DOTFILES_INSTALL_POWERSHELL | default "pwsh"}}'
    cmds:
      - '"{{.INSTALL_POWERSHELL}}" -NoProfile -ExecutionPolicy Bypass -File scripts/powershell/Invoke-WindowsInstallPhase.ps1 -Phase Chezmoi'
