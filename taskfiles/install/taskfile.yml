version: "3"

tasks:
  tart:prepare:
    desc: Download and clone the optional macOS Tart VM image
    cmds:
      - cmd: ./scripts/sh/install-tart-vm.sh
        platforms: [darwin]

  tart:run:
    desc: Start Tart, sync the latest dotfiles, and share host Hindsight
    cmds:
      - cmd: |
          if ! task hindsight:up; then
            printf '%s\n' 'tart-run: continuing without shared Hindsight; Docker, Ollama, or Hindsight is unavailable.' >&2
          fi
        platforms: [darwin]
      - cmd: ./scripts/sh/run-tart-vm.sh
        platforms: [darwin]

  install:
    desc: Run Windows installer
    cmds:
      - pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/powershell/install.ps1

  chezmoi:
    desc: Apply chezmoi dotfiles (NixOS + Windows)
    cmds:
      - cmd: pwsh -NoProfile -File scripts/powershell/Invoke-OptionalWslChezmoiApply.ps1 -Distro {{.DISTRO}}
        platforms: [windows]
      - cmd: pwsh -NoProfile -File scripts/powershell/Invoke-ChezmoiApplyWithOnePasswordPrefetch.ps1
        platforms: [windows]
      - cmd: chezmoi apply --force
        platforms: [linux, darwin]
