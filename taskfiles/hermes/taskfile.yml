version: "3"

tasks:
  hermes:sync:
    desc: Restart the Nix-managed Hermes Gateway service
    cmds:
      - task: hermes:restart

  hermes:profiles:sync:
    desc: Update one installed profile and replace its distribution configuration
    vars:
      PROFILE: '{{.PROFILE | default ""}}'
    preconditions:
      - sh: test -n {{.PROFILE | shellQuote}}
        msg: "Set PROFILE to an installed distribution profile name."
    cmds:
      - cmd: hermes profile update {{.PROFILE | shellQuote}} --force-config --yes
        platforms: [linux, darwin]
      - cmd: '{{.WSL}}bash -lc "hermes profile update {{.PROFILE | shellQuote}} --force-config --yes"'
        platforms: [windows]

  hermes:repository:sync:
    desc: Pull and push shared lifelog commits without committing working changes
    cmds:
      - cmd: |-
          set -eu
          repository="${HERMES_HOME:-${HOME:?HOME is not set}/.hermes}/shared/lifelog"
          git -C "$repository" pull --ff-only origin main
          git -C "$repository" push origin main
        platforms: [linux, darwin]
      - cmd: '{{.WSL}}bash -lc "cd {{.DOTFILES_PATH}} && task hermes:repository:sync"'
        platforms: [windows]

  hermes:bootstrap:
    desc: Apply the Nix-managed Hermes Agent profile and gateway service
    cmds:
      - cmd: |-
          set -eu
          nix flake update
          if [ -e /etc/NIXOS ]; then
            sudo nixos-rebuild switch --flake . --impure
          else
            system="$(nix eval --raw --impure --expr 'builtins.currentSystem')"
            home-manager switch --flake ".#${system}" --impure
          fi
          task hermes:sync
        platforms: [linux]
      - cmd: '{{.WSL}}bash -lc "cd {{.DOTFILES_PATH}} && nix flake update && sudo nixos-rebuild switch --flake . --impure && task hermes:sync"'
        platforms: [windows]
      - cmd: task darwin:install && task hermes:sync
        platforms: [darwin]

  hermes:xapi:auth:
    desc: Authenticate the X MCP bridge with the headless OAuth flow
    interactive: true
    cmds:
      - cmd: |-
          set -eu
          systemctl --user stop mcp-xapi.service
          hermes-xapi auth
        platforms: [linux]
      - cmd: |-
          set -eu
          target="gui/$(id -u)/org.nix-community.home.mcp-xapi"
          if launchctl print "$target" >/dev/null 2>&1; then
            launchctl bootout "$target"
          fi
          hermes-xapi auth
        platforms: [darwin]
      - cmd: '{{.WSL}}bash -lc "cd {{.DOTFILES_PATH}} && task hermes:xapi:auth"'
        platforms: [windows]

  hermes:xapi:setup:
    desc: Authenticate and sync the X API refresh token for native MCP sessions
    interactive: true
    cmds:
      - task: hermes:xapi:auth
      - task: hermes:xapi:sync-token

  hermes:xapi:sync-token:
    desc: Sync the local xurl refresh token into the shared 1Password item
    cmds:
      - cmd: |-
          set -eu
          hermes-xapi sync-token
          systemctl --user restart mcp-xapi.service
        platforms: [linux]
      - cmd: |-
          set -eu
          hermes-xapi sync-token
          domain="gui/$(id -u)"
          target="$domain/org.nix-community.home.mcp-xapi"
          if launchctl print "$target" >/dev/null 2>&1; then
            launchctl kickstart -k "$target"
          else
            launchctl bootstrap "$domain" "$HOME/Library/LaunchAgents/org.nix-community.home.mcp-xapi.plist"
          fi
        platforms: [darwin]
      - cmd: '{{.WSL}}bash -lc "cd {{.DOTFILES_PATH}} && task hermes:xapi:sync-token"'
        platforms: [windows]

  hermes:up:
    desc: Start the Nix-managed native Hermes Gateway service
    cmds:
      - cmd: systemctl --user start hermes-agent.service
        platforms: [linux]
      - cmd: |-
          set -eu
          domain="gui/$(id -u)"
          target="$domain/org.nix-community.home.hermes-agent"
          if launchctl print "$target" >/dev/null 2>&1; then
            launchctl kickstart "$target"
          else
            launchctl bootstrap "$domain" "$HOME/Library/LaunchAgents/org.nix-community.home.hermes-agent.plist"
          fi
        platforms: [darwin]
      - cmd: '{{.WSL}}bash -lc "systemctl --user start hermes-agent.service"'
        platforms: [windows]

  hermes:desktop:
    desc: Launch the Home Manager Hermes Desktop application
    cmds:
      - cmd: hermes-desktop
        platforms: [darwin, linux]
      - cmd: '{{.WSL}}bash -lc "hermes-desktop"'
        platforms: [windows]

  hermes:cli:
    desc: Run the Nix-managed native Hermes CLI
    interactive: true
    cmds:
      - cmd: hermes {{range .CLI_ARGS_LIST}}{{. | shellQuote}} {{end}}
        platforms: [darwin, linux]
      - cmd: '{{.WSL}}bash -lc "hermes {{range .CLI_ARGS_LIST}}{{. | shellQuote}} {{end}}"'
        platforms: [windows]

  hermes:profile:status:
    desc: Show a Hermes profile status in the Nix-managed gateway
    vars:
      PROFILE: '{{.PROFILE | default ""}}'
    preconditions:
      - sh: test -n {{.PROFILE | shellQuote}}
        msg: "Set PROFILE to an installed Hermes profile name."
    cmds:
      - cmd: hermes -p {{.PROFILE | shellQuote}} gateway status
        platforms: [darwin, linux]
      - cmd: '{{.WSL}}bash -lc "hermes -p {{.PROFILE | shellQuote}} gateway status"'
        platforms: [windows]

  hermes:down:
    desc: Stop the Nix-managed native Hermes Gateway service
    cmds:
      - cmd: systemctl --user stop hermes-agent.service
        platforms: [linux]
      - cmd: |-
          set -eu
          target="gui/$(id -u)/org.nix-community.home.hermes-agent"
          if launchctl print "$target" >/dev/null 2>&1; then
            launchctl bootout "$target"
          fi
        platforms: [darwin]
      - cmd: '{{.WSL}}bash -lc "systemctl --user stop hermes-agent.service"'
        platforms: [windows]

  hermes:restart:
    desc: Restart the Nix-managed native Hermes Gateway service
    cmds:
      - cmd: systemctl --user restart hermes-agent.service
        platforms: [linux]
      - cmd: |-
          set -eu
          domain="gui/$(id -u)"
          target="$domain/org.nix-community.home.hermes-agent"
          if launchctl print "$target" >/dev/null 2>&1; then
            launchctl kickstart -k "$target"
          else
            launchctl bootstrap "$domain" "$HOME/Library/LaunchAgents/org.nix-community.home.hermes-agent.plist"
          fi
        platforms: [darwin]
      - cmd: '{{.WSL}}bash -lc "systemctl --user restart hermes-agent.service"'
        platforms: [windows]

  hermes:logs:
    desc: Follow native Hermes Gateway logs
    interactive: true
    cmds:
      - cmd: hermes logs -f
        platforms: [darwin, linux]
      - cmd: '{{.WSL}}bash -lc "hermes logs -f"'
        platforms: [windows]

  hermes:ps:
    desc: Show the native Hermes Gateway status
    cmds:
      - cmd: hermes gateway status
        platforms: [linux, darwin]
      - cmd: '{{.WSL}}bash -lc "hermes gateway status"'
        platforms: [windows]

  hermes:upgrade:
    desc: Update the Hermes flake input and activate the Nix-managed Hermes Agent
    cmds:
      - cmd: task hermes:bootstrap
        platforms: [linux, darwin]
      - cmd: '{{.WSL}}bash -lc "cd {{.DOTFILES_PATH}} && task hermes:bootstrap"'
        platforms: [windows]
