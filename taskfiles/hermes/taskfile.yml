version: "3"

tasks:
  hermes:setup:
    desc: Run the native Hermes setup wizard
    interactive: true
    deps:
      - task: hindsight:up
    cmds:
      - cmd: hermes setup
        platforms: [linux, darwin]
      - cmd: '{{.WSL}}bash -lc "hermes setup"'
        platforms: [windows]

  hermes:docker:bootstrap:
    desc: Compatibility alias for the Nix-managed Hermes activation
    cmds:
      - task: hermes:bootstrap

  hermes:bootstrap:
    desc: Apply the Nix-managed Hermes Agent profile and gateway service
    cmds:
      - cmd: '{{.WSL}}bash -lc "cd {{.DOTFILES_PATH}} && DOTFILES_WITH_HERMES=1 scripts/sh/nixos-rebuild-with-user.sh switch --flake . --impure"'
        platforms: [windows, linux]
      - cmd: DOTFILES_WITH_OLLAMA=0 DOTFILES_WITH_DOCKER=0 DOTFILES_WITH_HERMES=1 DOTFILES_ROOT="{{.ROOT_DIR}}" task darwin:install
        platforms: [darwin]

  hermes:storage:inspect:
    desc: Inspect the Docker-managed Hermes runtime data volume
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
    cmds:
      - cmd: bash -lc 'docker volume inspect "${HERMES_DATA_VOLUME:-hermes-data}"'
        platforms: [linux, darwin]
      - cmd: pwsh -NoProfile -Command '$name = if ([string]::IsNullOrWhiteSpace($env:HERMES_DATA_VOLUME)) { "hermes-data" } else { $env:HERMES_DATA_VOLUME }; docker volume inspect $name'
        platforms: [windows]

  hermes:bootstrap:test:
    desc: Run the Hermes bootstrap container, gh wrapper, and provenance suites
    vars:
      PROVENANCE_URL: '{{.HERMES_HOME_PROVENANCE_URL | default "https://github.com/rurusasu/hermes-profile-alfred.git"}}'
    cmds:
      - cmd: python -m unittest tests/python/test_xapi_image_contract.py -v
        platforms: [windows]
      - cmd: python3 -m unittest tests/python/test_xapi_image_contract.py -v
        platforms: [linux, darwin]
      - task: hermes:bootstrap:test:container
        vars:
          PROVENANCE_URL: "{{.PROVENANCE_URL}}"

  hermes:bootstrap:test:container:
    internal: true
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
    cmds:
      - docker buildx bake -f docker/hermes-agent/docker-bake.hcl
      - cmd: docker/hermes-agent/tests/test_storage_volume_integration.sh
        platforms: [linux, darwin]
      - docker/hermes-agent/bootstrap/tests/test_gh_wrapper.sh
      - cmd: python docker/hermes-agent/bootstrap/tests/profile_sync_provenance_gate_contract.py
        platforms: [windows]
      - cmd: python3 docker/hermes-agent/bootstrap/tests/profile_sync_provenance_gate_contract.py
        platforms: [linux, darwin]
      - cmd: python docker/hermes-agent/bootstrap/tests/verify_profile_sync_provenance.py verify --dotfiles-repository . --source-url "{{.PROVENANCE_URL}}"
        platforms: [windows]
      - cmd: python3 docker/hermes-agent/bootstrap/tests/verify_profile_sync_provenance.py verify --dotfiles-repository . --source-url "{{.PROVENANCE_URL}}"
        platforms: [linux, darwin]

  hermes:bootstrap:config:
    desc: Validate the Hermes bootstrap Compose configuration
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
    cmds:
      - docker compose -f docker/hermes-service/compose.yml config --quiet

  hermes:memory:verify:
    desc: Run the complete Hermes Hindsight live acceptance lifecycle
    interactive: true
    deps:
      - task: mlflow:up
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
      - sh: test -f {{.HERMES_COMPOSE_FILE}}
        msg: "Hermes compose file not found: {{.HERMES_COMPOSE_FILE}}"
    cmds:
      - cmd: scripts/sh/hermes-hindsight-verify.sh
        platforms: [linux, darwin]
      - cmd: pwsh -NoProfile -File scripts/powershell/hermes-hindsight-verify.ps1
        platforms: [windows]

  hermes:pull:
    desc: Rebuild the Hermes browser and MCP sidecar images
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
    cmds:
      - docker compose -f {{.HERMES_COMPOSE_FILE}} build --pull chromium browser-mcp xapi-mcp

  hermes:xapi:auth:
    desc: Authenticate the X MCP bridge with the headless OAuth flow
    interactive: true
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
    cmds:
      - cmd: HERMES_COMPOSE_FILE={{.HERMES_COMPOSE_FILE}} bash scripts/sh/hermes-xapi.sh auth
        platforms: [linux, darwin]
      - cmd: pwsh -NoProfile -File scripts/powershell/hermes-xapi.ps1 -Action auth -ComposeFile "{{.HERMES_COMPOSE_FILE}}"
        platforms: [windows]

  hermes:xapi:setup:
    desc: Authenticate, sync the X API refresh token, and restart the MCP bridge
    interactive: true
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
      - sh: test -f {{.HERMES_COMPOSE_FILE}}
        msg: "Hermes compose file not found: {{.HERMES_COMPOSE_FILE}}"
    cmds:
      - task: hermes:xapi:auth
      - task: hermes:xapi:sync-token
      - task: hermes:xapi:restart

  hermes:xapi:sync-token:
    desc: Sync the local xurl refresh token into the shared 1Password item
    preconditions:
      - sh: test -f {{.HERMES_COMPOSE_FILE}}
        msg: "Hermes compose file not found: {{.HERMES_COMPOSE_FILE}}"
    cmds:
      - cmd: bash scripts/sh/hermes-xapi.sh sync-token
        platforms: [linux, darwin]
      - cmd: pwsh -NoProfile -File scripts/powershell/hermes-xapi.ps1 -Action sync-token
        platforms: [windows]

  hermes:xapi:restart:
    desc: Recreate the Hermes X MCP container
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
    cmds:
      - cmd: HERMES_COMPOSE_FILE={{.HERMES_COMPOSE_FILE}} bash scripts/sh/hermes-xapi.sh restart
        platforms: [linux, darwin]
      - cmd: pwsh -NoProfile -File scripts/powershell/hermes-xapi.ps1 -Action restart -ComposeFile "{{.HERMES_COMPOSE_FILE}}"
        platforms: [windows]

  hermes:xapi:logs:
    desc: Follow Hermes X MCP logs
    interactive: true
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
    cmds:
      - docker compose -f {{.HERMES_COMPOSE_FILE}} logs -f --tail=100 xapi-mcp

  hermes:gmail:auth:
    desc: Authenticate the shared Gmail MCP account
    interactive: true
    preconditions: []
    cmds:
      - cmd: HERMES_COMPOSE_FILE={{.HERMES_COMPOSE_FILE}} bash scripts/sh/hermes-gmail.sh auth
        platforms: [linux, darwin]
      - cmd: pwsh -NoProfile -File scripts/powershell/hermes-gmail.ps1 -Action auth -ComposeFile "{{.HERMES_COMPOSE_FILE}}"
        platforms: [windows]

  hermes:gmail:test:
    desc: Test Gmail MCP for one authenticated Hermes profile
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
      - sh: test -f {{.HERMES_COMPOSE_FILE}}
        msg: "Hermes compose file not found: {{.HERMES_COMPOSE_FILE}}"
      - sh: test -n "{{.PROFILE}}"
        msg: "Set PROFILE to an installed Hermes profile name."
    cmds:
      - cmd: HERMES_COMPOSE_FILE={{.HERMES_COMPOSE_FILE}} bash scripts/sh/hermes-gmail.sh test "{{.PROFILE}}"
        platforms: [linux, darwin]
      - cmd: pwsh -NoProfile -File scripts/powershell/hermes-gmail.ps1 -Action test -Profile "{{.PROFILE}}" -ComposeFile "{{.HERMES_COMPOSE_FILE}}"
        platforms: [windows]

  hermes:up:
    desc: Start the Nix-managed native Hermes Gateway service
    cmds:
      - cmd: hermes gateway start
        platforms: [linux, darwin]
      - cmd: '{{.WSL}}bash -lc "hermes gateway start"'
        platforms: [windows]

  hermes:desktop:
    desc: Launch the native Hermes Desktop application
    cmds:
      - cmd: open -a /Applications/Hermes.app
        platforms: [darwin]

  hermes:desktop:install:
    desc: Verify the Nix-managed Hermes CLI and nix-darwin Desktop cask
    cmds:
      - cmd: scripts/sh/hermes-desktop-install.sh
        platforms: [darwin]

  hermes:cli:
    desc: Run the Nix-managed native Hermes CLI
    interactive: true
    cmds:
      - cmd: hermes {{range .CLI_ARGS_LIST}}{{. | shellQuote}} {{end}}
        platforms: [darwin, linux]

  hermes:profile:status:
    desc: Show a Hermes profile status in the Nix-managed gateway
    vars:
      PROFILE: '{{.PROFILE | default ""}}'
    preconditions:
      - sh: test -n {{.PROFILE | shellQuote}}
        msg: "Set PROFILE to an installed Hermes profile name."
    cmds:
      - cmd: hermes -p {{.PROFILE | shellQuote}} gateway status
        platforms: [darwin, linux]
      - cmd: '{{.WSL}}bash -lc "hermes -p {{.PROFILE | shellQuote}} gateway status"'
        platforms: [windows]

  hermes:profile:up:
    desc: Start the Nix-managed gateway and show one Hermes profile status
    vars:
      PROFILE: '{{.PROFILE | default ""}}'
    preconditions:
      - sh: test -n {{.PROFILE | shellQuote}}
        msg: "Set PROFILE to an installed Hermes profile name."
    cmds:
      - task: hermes:up
      - task: hermes:profile:status
        vars:
          PROFILE: "{{.PROFILE}}"

  hermes:profile:down:
    desc: Stop the shared Nix-managed gateway for all Hermes profiles
    vars:
      PROFILE: '{{.PROFILE | default ""}}'
    preconditions:
      - sh: test -n {{.PROFILE | shellQuote}}
        msg: "Set PROFILE to an installed Hermes profile name."
    cmds:
      - task: hermes:down

  hermes:profile:restart:
    desc: Restart the Nix-managed gateway and show one Hermes profile status
    vars:
      PROFILE: '{{.PROFILE | default ""}}'
    preconditions:
      - sh: test -n {{.PROFILE | shellQuote}}
        msg: "Set PROFILE to an installed Hermes profile name."
    cmds:
      - task: hermes:restart
      - task: hermes:profile:status
        vars:
          PROFILE: "{{.PROFILE}}"

  hermes:down:
    desc: Stop the Nix-managed native Hermes Gateway service
    cmds:
      - cmd: hermes gateway stop
        platforms: [linux, darwin]
      - cmd: '{{.WSL}}bash -lc "hermes gateway stop"'
        platforms: [windows]

  hermes:restart:
    desc: Restart the Nix-managed native Hermes Gateway service
    cmds:
      - cmd: hermes gateway restart
        platforms: [linux, darwin]
      - cmd: '{{.WSL}}bash -lc "hermes gateway restart"'
        platforms: [windows]

  hermes:logs:
    desc: Follow native Hermes Gateway logs
    interactive: true
    cmds:
      - cmd: hermes logs -f
        platforms: [darwin, linux]
      - cmd: '{{.WSL}}bash -lc "hermes logs -f"'
        platforms: [windows]

  hermes:docker:up:
    desc: Compatibility alias for the Nix-managed Hermes gateway start
    cmds:
      - task: hermes:up

  hermes:docker:down:
    desc: Compatibility alias for the Nix-managed Hermes gateway stop
    cmds:
      - task: hermes:down

  hermes:docker:restart:
    desc: Compatibility alias for the Nix-managed Hermes gateway restart
    cmds:
      - task: hermes:restart

  hermes:docker:logs:
    desc: Compatibility alias for the native Hermes gateway logs
    cmds:
      - task: hermes:logs

  hermes:browser:pull:
    desc: Rebuild Hermes browser and Browser MCP Docker images
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
    cmds:
      - docker compose -f {{.HERMES_COMPOSE_FILE}} build --pull chromium browser-mcp

  hermes:browser:restart:
    desc: Recreate Hermes browser and Browser MCP containers
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
    cmds:
      - docker compose -f {{.HERMES_COMPOSE_FILE}} up -d --force-recreate chromium browser-mcp

  hermes:browser:logs:
    desc: Follow Hermes browser and Browser MCP Docker logs
    interactive: true
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
    cmds:
      - docker compose -f {{.HERMES_COMPOSE_FILE}} logs -f --tail=100 chromium browser-mcp

  hermes:browser:ps:
    desc: Show Hermes browser and Browser MCP container status
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
    cmds:
      - docker compose -f {{.HERMES_COMPOSE_FILE}} ps chromium browser-mcp

  hermes:rick:up:
    desc: Start the root multiplex gateway and show Rick profile status
    cmds:
      - task: hermes:profile:up
        vars:
          PROFILE: rick

  hermes:rick:down:
    desc: Stop the root multiplex gateway for all profiles
    cmds:
      - task: hermes:profile:down
        vars:
          PROFILE: rick

  hermes:rick:restart:
    desc: Restart the root multiplex gateway and show Rick profile status
    cmds:
      - task: hermes:profile:restart
        vars:
          PROFILE: rick

  hermes:rick:logs:
    desc: Follow Rick Hermes gateway logs
    interactive: true
    cmds:
      - task: hermes:logs

  hermes:hoffman:up:
    desc: Start the root multiplex gateway and show Hoffman profile status
    cmds:
      - task: hermes:profile:up
        vars:
          PROFILE: hoffman

  hermes:hoffman:down:
    desc: Stop the root multiplex gateway for all profiles
    cmds:
      - task: hermes:profile:down
        vars:
          PROFILE: hoffman

  hermes:hoffman:restart:
    desc: Restart the root multiplex gateway and show Hoffman profile status
    cmds:
      - task: hermes:profile:restart
        vars:
          PROFILE: hoffman

  hermes:hoffman:logs:
    desc: Follow Hoffman Hermes gateway logs
    interactive: true
    cmds:
      - task: hermes:logs

  hermes:risarisa:up:
    desc: Start the root multiplex gateway and show RisaRisa profile status
    cmds:
      - task: hermes:profile:up
        vars:
          PROFILE: risarisa

  hermes:risarisa:down:
    desc: Stop the root multiplex gateway for all profiles
    cmds:
      - task: hermes:profile:down
        vars:
          PROFILE: risarisa

  hermes:risarisa:restart:
    desc: Restart the root multiplex gateway and show RisaRisa profile status
    cmds:
      - task: hermes:profile:restart
        vars:
          PROFILE: risarisa

  hermes:risarisa:logs:
    desc: Follow RisaRisa Hermes gateway logs
    interactive: true
    cmds:
      - task: hermes:logs

  hermes:nancy:up:
    desc: Start the root multiplex gateway and show Nancy profile status
    cmds:
      - task: hermes:profile:up
        vars:
          PROFILE: nancy

  hermes:nancy:down:
    desc: Stop the root multiplex gateway for all profiles
    cmds:
      - task: hermes:profile:down
        vars:
          PROFILE: nancy

  hermes:nancy:restart:
    desc: Restart the root multiplex gateway and show Nancy profile status
    cmds:
      - task: hermes:profile:restart
        vars:
          PROFILE: nancy

  hermes:nancy:logs:
    desc: Follow Nancy Hermes gateway logs
    interactive: true
    cmds:
      - task: hermes:logs

  hermes:ps:
    desc: Show Hermes browser and MCP sidecar container status
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
    cmds:
      - docker compose -f {{.HERMES_COMPOSE_FILE}} ps chromium browser-mcp xapi-mcp hermes-bootstrap

  hermes:upgrade:
    desc: Update the Hermes flake input and activate the Nix-managed Hermes Agent
    cmds:
      - cmd: nix flake update hermes-agent && task hermes:bootstrap
        platforms: [linux, darwin]
      - cmd: '{{.WSL}}bash -lc "cd {{.DOTFILES_PATH}} && nix flake update hermes-agent && DOTFILES_WITH_HERMES=1 scripts/sh/nixos-rebuild-with-user.sh switch --flake . --impure"'
        platforms: [windows]
