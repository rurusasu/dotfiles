version: "3"

tasks:
  hermes:setup:
    desc: Run Hermes Agent setup wizard in Docker
    interactive: true
    deps:
      - task: hindsight:up
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
      - sh: test -f {{.HERMES_COMPOSE_FILE}}
        msg: "Hermes compose file not found: {{.HERMES_COMPOSE_FILE}}"
      - sh: test -f {{.HINDSIGHT_COMPOSE_FILE}}
        msg: "Hindsight compose file not found: {{.HINDSIGHT_COMPOSE_FILE}}"
    cmds:
      - docker compose -f {{.HERMES_COMPOSE_FILE}} run --rm hermes setup

  hermes:bootstrap:
    desc: Initialize the Docker data volume and bootstrap Hermes through the supported host adapter
    interactive: true
    deps:
      - task: hindsight:up
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
      - sh: test -f {{.HERMES_COMPOSE_FILE}}
        msg: "Hermes compose file not found: {{.HERMES_COMPOSE_FILE}}"
    cmds:
      - cmd: bash -lc 'set -euo pipefail; source scripts/sh/install-common.sh; source scripts/sh/hermes-agent.sh; dotfiles_hermes_start_stack docker "{{.HERMES_COMPOSE_FILE}}"'
        platforms: [linux, darwin]
      - cmd: pwsh -NoProfile -File scripts/powershell/hermes-bootstrap.ps1 -ComposeFile "{{.HERMES_COMPOSE_FILE}}"
        platforms: [windows]

  hermes:storage:inspect:
    desc: Inspect the Docker-managed Hermes runtime data volume
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
    cmds:
      - cmd: bash -lc 'docker volume inspect "${HERMES_DATA_VOLUME:-hermes-data}"'
        platforms: [linux, darwin]
      - cmd: pwsh -NoProfile -Command '$name = if ([string]::IsNullOrWhiteSpace($env:HERMES_DATA_VOLUME)) { "hermes-data" } else { $env:HERMES_DATA_VOLUME }; docker volume inspect $name'
        platforms: [windows]

  hermes:bootstrap:test:
    desc: Run the Hermes bootstrap container, gh wrapper, and provenance suites
    vars:
      PROVENANCE_URL: '{{.HERMES_HOME_PROVENANCE_URL | default "https://github.com/rurusasu/hermes-home.git"}}'
    cmds:
      - cmd: python -m unittest tests/python/test_xapi_image_contract.py -v
        platforms: [windows]
      - cmd: python3 -m unittest tests/python/test_xapi_image_contract.py -v
        platforms: [linux, darwin]
      - task: hermes:bootstrap:test:container
        vars:
          PROVENANCE_URL: "{{.PROVENANCE_URL}}"

  hermes:bootstrap:test:container:
    internal: true
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
    cmds:
      - docker build --target hermes-bootstrap-test -t local/hermes-bootstrap-test -f docker/hermes-agent/Dockerfile docker
      - docker build --target hermes-bootstrap-runtime -t local/hermes-agent-gh:latest -f docker/hermes-agent/Dockerfile docker
      - cmd: docker/hermes-agent/tests/test_storage_volume_integration.sh
        platforms: [linux, darwin]
      - docker/hermes-agent/bootstrap/tests/test_gh_wrapper.sh
      - cmd: python docker/hermes-agent/bootstrap/tests/profile_sync_provenance_gate_contract.py
        platforms: [windows]
      - cmd: python3 docker/hermes-agent/bootstrap/tests/profile_sync_provenance_gate_contract.py
        platforms: [linux, darwin]
      - cmd: python docker/hermes-agent/bootstrap/tests/verify_profile_sync_provenance.py verify --dotfiles-repository . --source-url "{{.PROVENANCE_URL}}"
        platforms: [windows]
      - cmd: python3 docker/hermes-agent/bootstrap/tests/verify_profile_sync_provenance.py verify --dotfiles-repository . --source-url "{{.PROVENANCE_URL}}"
        platforms: [linux, darwin]

  hermes:bootstrap:config:
    desc: Validate the Hermes bootstrap Compose configuration
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
    cmds:
      - docker compose -f docker/hermes-service/compose.yml config --quiet

  hermes:memory:verify:
    desc: Run the complete Hermes Hindsight live acceptance lifecycle
    interactive: true
    deps:
      - task: mlflow:up
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
      - sh: test -f {{.HERMES_COMPOSE_FILE}}
        msg: "Hermes compose file not found: {{.HERMES_COMPOSE_FILE}}"
    cmds:
      - cmd: scripts/sh/hermes-hindsight-verify.sh
        platforms: [linux, darwin]
      - cmd: pwsh -NoProfile -File scripts/powershell/hermes-hindsight-verify.ps1
        platforms: [windows]

  hermes:pull:
    desc: Rebuild the Hermes Agent Docker images with the latest base images
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
    cmds:
      - docker compose -f {{.HERMES_COMPOSE_FILE}} build --pull hermes chromium browser-mcp xapi-mcp

  hermes:xapi:auth:
    desc: Authenticate the X MCP bridge with the headless OAuth flow
    interactive: true
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
    cmds:
      - cmd: HERMES_COMPOSE_FILE={{.HERMES_COMPOSE_FILE}} bash scripts/sh/hermes-xapi.sh auth
        platforms: [linux, darwin]
      - cmd: pwsh -NoProfile -File scripts/powershell/hermes-xapi.ps1 -Action auth -ComposeFile "{{.HERMES_COMPOSE_FILE}}"
        platforms: [windows]

  hermes:xapi:setup:
    desc: Authenticate, sync the X API refresh token, and restart the MCP bridge
    interactive: true
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
      - sh: test -f {{.HERMES_COMPOSE_FILE}}
        msg: "Hermes compose file not found: {{.HERMES_COMPOSE_FILE}}"
    cmds:
      - task: hermes:xapi:auth
      - task: hermes:xapi:sync-token
      - task: hermes:xapi:restart

  hermes:xapi:sync-token:
    desc: Sync the local xurl refresh token into the shared 1Password item
    preconditions:
      - sh: test -f {{.HERMES_COMPOSE_FILE}}
        msg: "Hermes compose file not found: {{.HERMES_COMPOSE_FILE}}"
    cmds:
      - cmd: bash scripts/sh/hermes-xapi.sh sync-token
        platforms: [linux, darwin]
      - cmd: pwsh -NoProfile -File scripts/powershell/hermes-xapi.ps1 -Action sync-token
        platforms: [windows]

  hermes:xapi:restart:
    desc: Recreate the Hermes X MCP container
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
    cmds:
      - cmd: HERMES_COMPOSE_FILE={{.HERMES_COMPOSE_FILE}} bash scripts/sh/hermes-xapi.sh restart
        platforms: [linux, darwin]
      - cmd: pwsh -NoProfile -File scripts/powershell/hermes-xapi.ps1 -Action restart -ComposeFile "{{.HERMES_COMPOSE_FILE}}"
        platforms: [windows]

  hermes:xapi:logs:
    desc: Follow Hermes X MCP logs
    interactive: true
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
    cmds:
      - docker compose -f {{.HERMES_COMPOSE_FILE}} logs -f --tail=100 xapi-mcp

  hermes:gmail:auth:
    desc: Authenticate the shared Gmail MCP account
    interactive: true
    preconditions: []
    cmds:
      - cmd: HERMES_COMPOSE_FILE={{.HERMES_COMPOSE_FILE}} bash scripts/sh/hermes-gmail.sh auth
        platforms: [linux, darwin]
      - cmd: pwsh -NoProfile -File scripts/powershell/hermes-gmail.ps1 -Action auth -ComposeFile "{{.HERMES_COMPOSE_FILE}}"
        platforms: [windows]

  hermes:gmail:test:
    desc: Test Gmail MCP for one authenticated Hermes profile
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
      - sh: test -f {{.HERMES_COMPOSE_FILE}}
        msg: "Hermes compose file not found: {{.HERMES_COMPOSE_FILE}}"
      - sh: test -n "{{.PROFILE}}"
        msg: "Set PROFILE to an installed Hermes profile name."
    cmds:
      - cmd: HERMES_COMPOSE_FILE={{.HERMES_COMPOSE_FILE}} bash scripts/sh/hermes-gmail.sh test "{{.PROFILE}}"
        platforms: [linux, darwin]
      - cmd: pwsh -NoProfile -File scripts/powershell/hermes-gmail.ps1 -Action test -Profile "{{.PROFILE}}" -ComposeFile "{{.HERMES_COMPOSE_FILE}}"
        platforms: [windows]

  hermes:up:
    desc: Bootstrap Hermes memory configuration and start the gateway in Docker
    deps:
      - task: hermes:bootstrap
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."

  hermes:desktop:
    desc: Launch Hermes Desktop connected to the Docker gateway
    preconditions:
      - sh: command -v hermes-desktop-docker
        msg: "Hermes Desktop Docker launcher is not installed. Apply the WithHermes profile."
    cmds:
      - cmd: hermes-desktop-docker
        platforms: [darwin]

  hermes:cli:
    desc: Run the Hermes CLI inside the Docker Agent container
    interactive: true
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
      - sh: test -f {{.HERMES_COMPOSE_FILE}}
        msg: "Hermes compose file not found: {{.HERMES_COMPOSE_FILE}}"
      - sh: command -v hermes-docker
        msg: "Hermes Docker CLI adapter is not installed. Apply the WithHermes profile."
    cmds:
      - cmd: HERMES_COMPOSE_FILE={{.HERMES_COMPOSE_FILE | shellQuote}} hermes-docker {{range .CLI_ARGS_LIST}}{{. | shellQuote}} {{end}}
        platforms: [darwin]

  hermes:profile:status:
    desc: Show the gateway status for a Hermes profile
    vars:
      PROFILE: '{{.PROFILE | default ""}}'
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
      - sh: test -n {{.PROFILE | shellQuote}}
        msg: "Set PROFILE to an installed Hermes profile name."
    cmds:
      - cmd: docker exec hermes /opt/hermes/.venv/bin/hermes -p {{.PROFILE | shellQuote}} gateway status
        platforms: [darwin, linux]

  hermes:profile:up:
    desc: Start the gateway for a Hermes profile
    vars:
      PROFILE: '{{.PROFILE | default ""}}'
    deps:
      - task: hermes:up
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
      - sh: test -n {{.PROFILE | shellQuote}}
        msg: "Set PROFILE to an installed Hermes profile name."
    cmds:
      - cmd: docker exec hermes /opt/hermes/.venv/bin/hermes -p {{.PROFILE | shellQuote}} gateway start
        platforms: [darwin, linux]

  hermes:down:
    desc: Stop Hermes Agent Docker container
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
    cmds:
      - docker compose -f {{.HERMES_COMPOSE_FILE}} down

  hermes:restart:
    desc: Recreate Hermes Agent Docker container with xapi credentials
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
    cmds:
      - task: hermes:up

  hermes:logs:
    desc: Follow Hermes Agent Docker logs
    interactive: true
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
    cmds:
      - docker compose -f {{.HERMES_COMPOSE_FILE}} logs -f --tail=100 hermes

  hermes:browser:pull:
    desc: Rebuild Hermes browser and Browser MCP Docker images
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
    cmds:
      - docker compose -f {{.HERMES_COMPOSE_FILE}} build --pull chromium browser-mcp

  hermes:browser:restart:
    desc: Recreate Hermes browser and Browser MCP containers
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
    cmds:
      - docker compose -f {{.HERMES_COMPOSE_FILE}} up -d --force-recreate chromium browser-mcp

  hermes:browser:logs:
    desc: Follow Hermes browser and Browser MCP Docker logs
    interactive: true
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
    cmds:
      - docker compose -f {{.HERMES_COMPOSE_FILE}} logs -f --tail=100 chromium browser-mcp

  hermes:browser:ps:
    desc: Show Hermes browser and Browser MCP container status
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
    cmds:
      - docker compose -f {{.HERMES_COMPOSE_FILE}} ps chromium browser-mcp

  hermes:rick:up:
    desc: Start Rick Hermes profile gateway in the Hermes container
    deps:
      - task: hermes:up
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
    cmds:
      - docker compose -f {{.HERMES_COMPOSE_FILE}} up -d hermes
      - docker exec hermes /opt/hermes/.venv/bin/hermes -p rick gateway start

  hermes:rick:down:
    desc: Stop Rick Hermes profile gateway
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
    cmds:
      - docker exec hermes /opt/hermes/.venv/bin/hermes -p rick gateway stop

  hermes:rick:restart:
    desc: Restart Rick Hermes profile gateway
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
    cmds:
      - docker exec hermes /opt/hermes/.venv/bin/hermes -p rick gateway restart

  hermes:rick:logs:
    desc: Follow Rick Hermes gateway logs
    interactive: true
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
    cmds:
      - docker exec hermes sh -lc 'tail -F /opt/data/logs/gateways/rick/current'

  hermes:hoffman:up:
    desc: Start Hoffman Hermes profile gateway in the Hermes container
    deps:
      - task: hermes:up
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
    cmds:
      - docker compose -f {{.HERMES_COMPOSE_FILE}} up -d hermes
      - docker exec hermes /opt/hermes/.venv/bin/hermes -p hoffman gateway start

  hermes:hoffman:down:
    desc: Stop Hoffman Hermes profile gateway
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
    cmds:
      - docker exec hermes /opt/hermes/.venv/bin/hermes -p hoffman gateway stop

  hermes:hoffman:restart:
    desc: Restart Hoffman Hermes profile gateway
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
    cmds:
      - docker exec hermes /opt/hermes/.venv/bin/hermes -p hoffman gateway restart

  hermes:hoffman:logs:
    desc: Follow Hoffman Hermes gateway logs
    interactive: true
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
    cmds:
      - docker exec hermes sh -lc 'tail -F /opt/data/logs/gateways/hoffman/current'

  hermes:risarisa:up:
    desc: Start RisaRisa Hermes profile gateway in the Hermes container
    deps:
      - task: hermes:up
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
    cmds:
      - docker compose -f {{.HERMES_COMPOSE_FILE}} up -d hermes
      - docker exec hermes /opt/hermes/.venv/bin/hermes -p risarisa gateway start

  hermes:risarisa:down:
    desc: Stop RisaRisa Hermes profile gateway
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
    cmds:
      - docker exec hermes /opt/hermes/.venv/bin/hermes -p risarisa gateway stop

  hermes:risarisa:restart:
    desc: Restart RisaRisa Hermes profile gateway
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
    cmds:
      - docker exec hermes /opt/hermes/.venv/bin/hermes -p risarisa gateway restart

  hermes:risarisa:logs:
    desc: Follow RisaRisa Hermes gateway logs
    interactive: true
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
    cmds:
      - docker exec hermes sh -lc 'tail -F /opt/data/logs/gateways/risarisa/current'

  hermes:nancy:up:
    desc: Start Nancy Hermes profile gateway in the Hermes container
    deps:
      - task: hermes:up
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
    cmds:
      - docker compose -f {{.HERMES_COMPOSE_FILE}} up -d hermes
      - docker exec hermes /opt/hermes/.venv/bin/hermes -p nancy gateway start

  hermes:nancy:down:
    desc: Stop Nancy Hermes profile gateway
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
    cmds:
      - docker exec hermes /opt/hermes/.venv/bin/hermes -p nancy gateway stop

  hermes:nancy:restart:
    desc: Restart Nancy Hermes profile gateway
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
    cmds:
      - docker exec hermes /opt/hermes/.venv/bin/hermes -p nancy gateway restart

  hermes:nancy:logs:
    desc: Follow Nancy Hermes gateway logs
    interactive: true
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
    cmds:
      - docker exec hermes sh -lc 'tail -F /opt/data/logs/gateways/nancy/current'

  hermes:ps:
    desc: Show Hermes Agent Docker container status
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
    cmds:
      - docker compose -f {{.HERMES_COMPOSE_FILE}} ps

  hermes:upgrade:
    desc: Rebuild and recreate Hermes Agent Docker container
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
    cmds:
      - task: hermes:pull
      - task: hermes:up
