version: "3"

vars:
  MLFLOW_COMPOSE_FILE: docker/local-ai-services/compose.yml

tasks:
  mlflow:up:
    desc: Start MLflow and wait for health
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
      - sh: test -f {{.MLFLOW_COMPOSE_FILE}}
        msg: "MLflow compose file not found: {{.MLFLOW_COMPOSE_FILE}}"
    cmds:
      - cmd: docker network inspect local-ai-services >/dev/null 2>&1 || docker network create local-ai-services
        platforms: [linux, darwin]
      - cmd: "pwsh -NoProfile -Command 'docker network inspect local-ai-services *> $null; if ($LASTEXITCODE -ne 0) { docker network create local-ai-services }'"
        platforms: [windows]
      - docker compose -f {{.MLFLOW_COMPOSE_FILE}} up -d --remove-orphans --wait mlflow

  mlflow:update:
    desc: Pull the pinned MLflow image and recreate it
    cmds:
      - docker compose -f {{.MLFLOW_COMPOSE_FILE}} pull mlflow
      - task: mlflow:up

  mlflow:down:
    desc: Stop MLflow without removing its data or the shared network
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
    cmds:
      - docker compose -f {{.MLFLOW_COMPOSE_FILE}} stop mlflow

  mlflow:status:
    desc: Show MLflow service status
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
    cmds:
      - docker compose -f {{.MLFLOW_COMPOSE_FILE}} ps mlflow

  mlflow:logs:
    desc: Follow MLflow logs
    interactive: true
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
    cmds:
      - docker compose -f {{.MLFLOW_COMPOSE_FILE}} logs -f --tail=100 mlflow

  mlflow:verify:
    desc: Verify the MLflow API
    preconditions:
      - sh: docker info
        msg: "Docker daemon is not running. Start Docker Desktop and try again."
    cmds:
      - >-
        docker compose -f {{.MLFLOW_COMPOSE_FILE}} exec -T mlflow python -c
        "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"
