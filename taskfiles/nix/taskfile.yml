version: "3"

tasks:
  keybindings:export:
    desc: Regenerate Windows desktop settings from shared Nix keybindings
    platforms: [linux, darwin]
    preconditions:
      - sh: command -v nix
        msg: Nix is required; run this task from macOS, Linux, or WSL
    cmds:
      - |-
        set -eu
        output="$(nix build .#windows-keybindings-export --no-link --print-out-paths --no-write-lock-file)"
        find "$output" -type f -exec sh -eu -c '
          output=$1
          shift
          for artifact do
            target="chezmoi/${artifact#"$output"/}"
            mkdir -p "$(dirname "$target")"
            install -m644 "$artifact" "$target"
          done
        ' sh "$output" {} +

  keybindings:check:
    desc: Check that Windows desktop settings match the shared Nix source
    platforms: [linux, darwin]
    preconditions:
      - sh: command -v nix
        msg: Nix is required; run this task from macOS, Linux, or WSL
    cmds:
      - |-
        set -eu
        system="$(nix eval --raw --impure --expr 'builtins.currentSystem')"
        nix build ".#checks.${system}.windows-keybindings-generated" --no-link --no-write-lock-file

  darwin:install:
    desc: Update custom packages then run the macOS activation adapter
    interactive: true
    preconditions:
      - sh: test -n "${DOTFILES_ROOT:-}" && test -n "${DOTFILES_WITH_OLLAMA:-}" && test -n "${DOTFILES_WITH_DOCKER:-}" && test -n "${DOTFILES_WITH_HERMES:-}"
        msg: Run ./install.sh to initialize the macOS install profile
    cmds:
      - task: darwin:install:update
      - bash -c 'source scripts/sh/install-macos.sh; finish_macos_install'

  darwin:install:update:
    internal: true
    status:
      - test "${DOTFILES_SKIP_FLAKE_UPDATE:-0}" = 1
    cmds:
      - task: darwin:update

  darwin:update:check:
    desc: Check official feeds for Darwin package updates
    cmds:
      - "python3 scripts/python/update_darwin_packages.py --check --output darwin-package-update.json"

  darwin:update:
    desc: Apply safe Darwin package version, URL, and hash updates
    cmds:
      - >-
        bash -euc 'source scripts/sh/install-display.sh;
        dotfiles_display_init;
        dotfiles_step "Checking custom macOS package updates"
        "Check release feeds and download changed packages to verify their hashes. Large application downloads can take time."
        python3 scripts/python/update_darwin_packages.py --write --output darwin-package-update.json'

  darwin:promote:
    desc: Build and promote explicit nixpkgs Darwin candidates
    cmds:
      - "python3 scripts/python/update_darwin_packages.py --write --promote --output darwin-package-update.json"

  darwin:update:promote:
    desc: Update custom Darwin packages and build provider candidates in one report
    cmds:
      - "python3 scripts/python/update_darwin_packages.py --write --promote --output darwin-package-update.json"

  nrs:
    desc: Update inputs and activate OS-managed applications and configuration
    cmds:
      - task: rebuild
      - '{{.WSL}}bash -lc "cd {{.DOTFILES_PATH}} && source scripts/sh/codex-npm.sh && dotfiles_install_codex_npm"'

  rebuild:
    desc: Run nixos-rebuild switch
    cmds:
      - '{{.WSL}}bash -lc "cd {{.DOTFILES_PATH}} && nix flake update && scripts/sh/nixos-rebuild-with-user.sh switch --flake . --impure"'

  build:
    desc: Dry build NixOS configuration
    cmds:
      - '{{.WSL}}bash -lc "cd {{.DOTFILES_PATH}} && nix build .#nixosConfigurations.nixos.config.system.build.toplevel --dry-run"'

  update:
    desc: Update flake inputs
    cmds:
      - '{{.WSL}}bash -lc "cd {{.DOTFILES_PATH}} && nix flake update"'
