version: "3"

tasks:
  darwin:install:
    desc: Install Nix if needed and switch the macOS configuration
    interactive: true
    cmds:
      - ./install.sh

  nrs:
    desc: Apply locked OS-managed applications and configuration
    cmds:
      - cmd: ./install.sh
        platforms: [darwin, linux]
      - cmd: task rebuild
        platforms: [windows]

  rebuild:
    desc: Run nixos-rebuild switch
    cmds:
      - '{{.WSL}}bash -lc "cd {{.DOTFILES_PATH}} && sudo nixos-rebuild switch --flake . --impure --no-update-lock-file"'

  build:
    desc: Dry build NixOS configuration
    cmds:
      - '{{.WSL}}bash -lc "cd {{.DOTFILES_PATH}} && nix build .#nixosConfigurations.nixos.config.system.build.toplevel --dry-run --no-update-lock-file"'

  update:
    desc: Update flake inputs for review and CI without applying them
    cmds:
      - '{{.WSL}}bash -lc "cd {{.DOTFILES_PATH}} && bash scripts/sh/update-flake-inputs.sh ."'
