version: "3"

vars:
  UPDATE_FLAKE_INPUTS: '{{.UPDATE_FLAKE_INPUTS | default "true"}}'

tasks:
  darwin:install:
    desc: Install Nix if needed and switch the macOS configuration
    interactive: true
    cmds:
      - ./install.sh

  nrs:
    desc: Update inputs and activate OS-managed applications and configuration
    env:
      UPDATE_FLAKE_INPUTS: "{{.UPDATE_FLAKE_INPUTS}}"
    cmds:
      - cmd: ./install.sh
        platforms: [darwin, linux]
      - cmd: task rebuild
        platforms: [windows]

  rebuild:
    desc: Run nixos-rebuild switch
    cmds:
      - '{{.WSL}}bash -lc "cd {{.DOTFILES_PATH}} && {{if ne .UPDATE_FLAKE_INPUTS "false"}}bash scripts/sh/update-flake-inputs.sh . && {{end}}sudo nixos-rebuild switch --flake . --impure{{if eq .UPDATE_FLAKE_INPUTS "false"}} --no-update-lock-file{{end}}"'

  build:
    desc: Dry build NixOS configuration
    cmds:
      - '{{.WSL}}bash -lc "cd {{.DOTFILES_PATH}} && nix build .#nixosConfigurations.nixos.config.system.build.toplevel --dry-run"'

  update:
    desc: Update flake inputs
    cmds:
      - '{{.WSL}}bash -lc "cd {{.DOTFILES_PATH}} && bash scripts/sh/update-flake-inputs.sh ."'
