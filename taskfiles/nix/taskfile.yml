version: "3"

tasks:
  darwin:install:
    desc: Install Nix if needed and switch the macOS configuration
    interactive: true
    cmds:
      - ./install.sh

  rebuild:
    desc: Run nixos-rebuild switch
    cmds:
      - '{{.WSL}}bash -lc "cd {{.DOTFILES_PATH}} && ./install.sh"'

  build:
    desc: Dry build NixOS configuration
    cmds:
      - '{{.WSL}}bash -lc "cd {{.DOTFILES_PATH}} && nix build .#nixosConfigurations.wsl.config.system.build.toplevel --dry-run --no-update-lock-file"'

  update:
    desc: Update flake inputs for review and CI without applying them
    cmds:
      - '{{.WSL}}bash -lc "cd {{.DOTFILES_PATH}} && bash scripts/sh/update-flake-inputs.sh ."'
