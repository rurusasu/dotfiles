version: "3"

tasks:
  darwin:install:
    desc: Update custom packages then run the macOS activation adapter
    interactive: true
    preconditions:
      - sh: test -n "${DOTFILES_ROOT:-}" && test -n "${DOTFILES_WITH_OLLAMA:-}" && test -n "${DOTFILES_WITH_DOCKER:-}" && test -n "${DOTFILES_WITH_HERMES:-}"
        msg: Run ./install.sh to initialize the macOS install profile
    cmds:
      - task: darwin:install:update
      - bash -c 'source scripts/sh/install-macos.sh; finish_macos_install'

  darwin:install:update:
    internal: true
    status:
      - test "${DOTFILES_SKIP_FLAKE_UPDATE:-0}" = 1
    cmds:
      - task: darwin:update

  darwin:verify:
    cmds:
      - "bash scripts/sh/verify-darwin-package.sh {{.CLI_ARGS}}"

  darwin:migrate:
    cmds:
      - "bash scripts/sh/migrate-darwin-provider.sh {{.CLI_ARGS}}"

  darwin:update:check:
    desc: Check official feeds for Darwin package updates
    cmds:
      - "python3 scripts/python/update_darwin_packages.py --check --output darwin-package-update.json"

  darwin:update:
    desc: Apply safe Darwin package version, URL, and hash updates
    cmds:
      - "python3 scripts/python/update_darwin_packages.py --write --output darwin-package-update.json"

  darwin:promote:
    desc: Verify and promote explicit nixpkgs Darwin candidates
    cmds:
      - "python3 scripts/python/update_darwin_packages.py --write --promote --output darwin-package-update.json"

  darwin:update:promote:
    desc: Update custom Darwin packages and verify provider promotions in one report
    cmds:
      - "python3 scripts/python/update_darwin_packages.py --write --promote --output darwin-package-update.json"

  nrs:
    desc: Update inputs, activate NixOS, upgrade the profile, and bootstrap Hermes
    cmds:
      - task: rebuild
      - '{{.WSL}}bash -lc "nix profile upgrade ''.*'' || nix profile install {{.DOTFILES_PATH}}#default"'
      - task: hermes:bootstrap

  rebuild:
    desc: Run nixos-rebuild switch
    cmds:
      - '{{.WSL}}bash -lc "cd {{.DOTFILES_PATH}} && nix flake update && scripts/sh/nixos-rebuild-with-user.sh switch --flake . --impure"'

  build:
    desc: Dry build NixOS configuration
    cmds:
      - '{{.WSL}}bash -lc "cd {{.DOTFILES_PATH}} && nix build .#nixosConfigurations.nixos.config.system.build.toplevel --dry-run"'

  update:
    desc: Update flake inputs
    cmds:
      - '{{.WSL}}bash -lc "cd {{.DOTFILES_PATH}} && nix flake update"'
