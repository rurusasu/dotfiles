version: "3"

tasks:
  test:
    desc: Run platform-appropriate tests
    cmds:
      - task: '{{if eq OS "windows"}}test:powershell{{else}}test:nix{{end}}'

  test:nix:
    desc: Run Nix-native configuration tests
    cmds:
      - |-
        system="$(nix eval --raw --impure --expr 'builtins.currentSystem')"
        nix build ".#checks.${system}.nix-unit" --no-link --no-write-lock-file
        nix build ".#checks.${system}.custom-package-builds" --no-link --no-write-lock-file
        nix build ".#checks.${system}.neovim-native" --no-link --no-write-lock-file
        nix build ".#checks.${system}.ghostty-config" --no-link --no-write-lock-file

  test:powershell:
    desc: Run PowerShell tests
    cmds:
      - pwsh -NoProfile -Command "& ./scripts/powershell/tests/Invoke-Tests.ps1 -MinimumCoverage 0 -IncludeIntegration"

  test:coverage:
    desc: Run PowerShell tests with coverage
    cmds:
      - pwsh -NoProfile -Command "& ./scripts/powershell/tests/Invoke-Tests.ps1 -IncludeIntegration -ShowCoverage"

  test:bash:
    desc: Run classified Bats runtime and artifact contracts
    cmds:
      - '{{if eq OS "darwin"}}sh -c ''export PATH=/opt/homebrew/bin:/opt/homebrew/sbin:$PATH; cd "$(cd {{.DOTFILES_PATH}} && pwd -P)" && bats tests/bash''{{else}}{{.WSL}}bash -lc "cd {{.DOTFILES_PATH}} && bats tests/bash"{{end}}'
