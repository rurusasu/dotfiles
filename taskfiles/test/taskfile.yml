version: "3"

tasks:
  test:
    desc: Run platform-appropriate tests
    cmds:
      - task: '{{if eq OS "windows"}}test:powershell{{else}}test:nix{{end}}'

  test:nix:
    desc: Run all Nix flake checks for the current system
    cmds:
      - nix flake check --no-write-lock-file --print-build-logs

  test:powershell:
    desc: Run PowerShell tests
    cmds:
      - pwsh -NoProfile -File scripts/powershell/tests/Invoke-Tests.ps1

  test:bash:
    desc: Run classified Bats runtime and artifact contracts
    cmds:
      - '{{if eq OS "darwin"}}sh -c ''export PATH=/opt/homebrew/bin:/opt/homebrew/sbin:$PATH; cd "$(cd {{.DOTFILES_PATH}} && pwd -P)" && bash scripts/sh/run-bash-tests.sh''{{else}}{{.WSL}}bash -lc "cd {{.DOTFILES_PATH}} && bash scripts/sh/run-bash-tests.sh"{{end}}'
