version: "3"

tasks:
  toolkit:secrets:
    desc: Sync MCP Gateway secrets from 1Password to a private local file
    cmds:
      - '{{.WSL}}bash -lc "cd {{.DOTFILES_PATH}} && bash ./scripts/sh/mcp-toolkit.sh secrets"'

  toolkit:status:
    desc: Show the installed MCP Gateway version
    cmds:
      - '{{.WSL}}bash -lc "cd {{.DOTFILES_PATH}} && bash ./scripts/sh/mcp-toolkit.sh status"'
