version: "3"

tasks:
  toolkit:secrets:
    desc: Inject Docker MCP Toolkit secrets from the openclaw 1Password vault
    cmds:
      - '{{.WSL}}bash -lc "cd {{.DOTFILES_PATH}} && bash ./scripts/sh/mcp-toolkit.sh secrets"'

  toolkit:status:
    desc: Show the installed Docker MCP plugin version
    cmds:
      - '{{.WSL}}bash -lc "cd {{.DOTFILES_PATH}} && bash ./scripts/sh/mcp-toolkit.sh status"'
