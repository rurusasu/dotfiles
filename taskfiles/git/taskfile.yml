version: "3"

tasks:
  worktree:repair:
    desc: Repair an existing worktree's links using portable relative paths (keeps files and branches)
    requires:
      vars: [REPO, WORKTREE]
    env:
      DOTFILES_WORKTREE_REPO: "{{.REPO}}"
      DOTFILES_WORKTREE_PATH: "{{.WORKTREE}}"
    preconditions:
      - sh: test -f "$DOTFILES_WORKTREE_PATH/.git"
        msg: WORKTREE must be the actual linked worktree directory in the current OS
    cmds:
      - git -c safe.directory="$DOTFILES_WORKTREE_REPO" -C "$DOTFILES_WORKTREE_REPO" worktree repair --relative-paths "$DOTFILES_WORKTREE_PATH"

  commit:
    desc: Format, lint, and commit
    vars:
      MSG: '{{.CLI_ARGS | trimAll "\u0027" | default "update"}}'
    env:
      GIT_COMMIT_MSG: "{{.MSG}}"
      WSLENV: "GIT_COMMIT_MSG"
    cmds:
      - task: fmt
      - task: lint:no-format
      - '{{.WSL}}bash -lc "cd {{.DOTFILES_PATH}} && git add -A && printf ''%s\n'' \"$GIT_COMMIT_MSG\" | git commit -F -"'

  push:
    desc: Push to remote
    cmds:
      - '{{.WSL}}bash -lc "cd {{.DOTFILES_PATH}} && git push"'

  sync:
    desc: Format, lint, commit and push
    vars:
      MSG: '{{.CLI_ARGS | default "update"}}'
    cmds:
      - task: commit -- "{{.MSG}}"
      - task: push
