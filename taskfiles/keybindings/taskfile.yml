version: "3"

tasks:
  keybindings:export:
    desc: Export the canonical Nix appearance for Windows chezmoi
    dir: "{{.ROOT_DIR}}"
    cmds:
      - |
        {{if eq OS "windows"}}wsl -d {{.DISTRO}} --cd "{{.ROOT_DIR}}" --exec {{end}}bash -lc '
          set -euo pipefail
          appearance=$(nix build --no-link --print-out-paths --impure --expr "let f = builtins.getFlake (toString ./.); in import ./chezmoi/appearance/export.nix { config = f.homeConfigurations.x86_64-linux.config; pkgs = f.inputs.nixpkgs.legacyPackages.x86_64-linux; }")
          cp "$appearance" chezmoi/appearance/appearance.json
        '
